openapi: 3.1.0
info:
  title: my Fund Manager API
  version: 0.0.1
  description: |
    시즌 한 판 REST API(Phase 0). 금액·비율은 지수 없는 문자열(소수 자릿수 유지),
    수량·턴 번호·포메이션 비중은 정수다. 오류는 application/problem+json(Problem).
    시즌 중 응답에는 실제 날짜·사건 이름·경로가 나가지 않는다.
paths:
  /api/v1/pool:
    get:
      tags: [pool]
      operationId: getPool
      summary: 기준일 종목 풀
      description: |
        서버 설정의 기준일 풀 전체를 시장·종목코드 순서로 준다. 시스템 판정 포지션과
        판정 근거(참여율·변동성·최대 낙폭, 원화·월 단위·소수 8자리)를 함께 준다.
      responses:
        '200':
          description: 기준일 풀
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolDto'
        '409':
          description: 풀이 준비되지 않았다 — POOL_NOT_LOADED(행 없음), POOL_NOT_JUDGED(판정 빈 종목 있음)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/seasons:
    post:
      tags: [season]
      operationId: startSeason
      summary: 시즌 시작
      description: |
        위험 선언·포메이션·경로 길이로 새 시즌을 시작한다. 초기 자금·요율은 서버 설정이 정한다.
        시즌·경로·현금 계좌·입금·0턴 가격이 한 트랜잭션으로 만들어진다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSeasonRequest'
      responses:
        '201':
          description: 시작한 시즌
          headers:
            Location:
              description: 새 시즌의 주소
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
        '400':
          description: 입력이 틀렸다 — INVALID_ARGUMENT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 지금은 시작할 수 없다 — POOL_NOT_LOADED, POOL_NOT_JUDGED, SEASON_LIMIT(진행 중 3개)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 요청한 길이의 경로를 만들 수 없다 — PATH_TOO_LONG
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE(운영, 인증 전)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [season]
      operationId: listSeasons
      summary: 내 시즌 목록
      description: 현재 회원의 시즌 전부를 시즌 번호 내림차순으로 준다.
      responses:
        '200':
          description: 시즌 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonListDto'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/seasons/{seasonId}:
    get:
      tags: [season]
      operationId: getSeason
      summary: 시즌 한 개
      description: 현재 회원의 시즌 한 개. 없거나 다른 회원의 시즌이면 404.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 시즌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
        '400':
          description: 시즌 번호가 숫자가 아니다 — INVALID_ARGUMENT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 시즌이 없다 — NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/seasons/{seasonId}/prices:
    get:
      tags: [season]
      operationId: getTurnPrices
      summary: 턴 가격
      description: 한 턴의 풀 전체 가격을 종목 번호 순으로 준다. turnNo 를 생략하면 현재 턴.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: turnNo
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        '200':
          description: 그 턴의 가격
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnPricesDto'
        '400':
          description: turnNo 또는 시즌 번호가 틀렸다 — INVALID_ARGUMENT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 시즌이 없다 — NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 아직 진행하지 않은 턴이다 — TURN_NOT_REACHED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/seasons/{seasonId}/orders:
    post:
      tags: [order]
      operationId: placeOrder
      summary: 주문(시장가 매수·매도)
      description: 현재 턴 가격으로 한 건을 바로 체결한다. 0턴 팀 구성과 1턴 이후 매수가 같은 경로다. 매수는 대금과 수수료가 현금에서 빠지고 보유·라인업이 함께 바뀐다. 매도는 대금이 현금에 더해지고 수수료가 빠지며 실현 손익이 기록되고, 전량 매도면 구간이 닫힌다.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: 체결 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResultDto'
        '400':
          description: 입력이 틀렸다(수량 0 이하, 매도에 선언 포지션) — INVALID_ARGUMENT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 시즌이 없다 — NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 지금은 주문할 수 없다 — SEASON_NOT_ACTIVE, TURN_MISMATCH, LEDGER_MISMATCH, LINEUP_MISMATCH
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 주문 내용을 받을 수 없다 — ASSET_NOT_IN_POOL, INSUFFICIENT_CASH, INSUFFICIENT_HOLDING, POSITION_CONFLICT, POSITION_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE(운영, 인증 전)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/seasons/{seasonId}/formation-changes:
    post:
      tags: [formation]
      operationId: changeFormation
      summary: 전술 변경
      description: 현재 포메이션을 새 값으로 바꾸고 변경 이력을 남긴다. 같은 턴에 여러 번 바꿀 수 있고 모두 기록된다. 변경 뒤 같은 턴의 주문은 가장 마지막 변경에 묶인다. 팀 구성 중인 0턴에는 바꿀 수 없다.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeFormationRequest'
      responses:
        '201':
          description: 변경 결과(턴·이전·이후·사유)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormationChangeDto'
        '400':
          description: 입력이 틀렸다(합 ≠ 100, 골키퍼 0, 범위 밖, 필수값 누락, 사유 200자 초과, 현재와 같은 포메이션) — INVALID_ARGUMENT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 시즌이 없다 — NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 지금은 바꿀 수 없다 — SEASON_NOT_ACTIVE, TURN_MISMATCH(0턴 포함), INVALID_FORMATION, EVENT_TIME_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE(운영, 인증 전)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/seasons/{seasonId}/turns:
    post:
      tags: [turn]
      operationId: advanceTurn
      summary: 턴 전환(다음 달)
      description: 다음 달 블록을 적용한다. 한 트랜잭션에서 풀 전체의 다음 턴 가격과 턴 스냅샷을 만들고 대사 17개가 모두 일치하면 기록하고 현재 턴을 올린다. 마지막 턴이면 시즌이 끝난다. 대사가 하나라도 어긋나면 대사 기록만 남기고 409다.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceTurnRequest'
      responses:
        '201':
          description: 턴 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResultDto'
        '400':
          description: 입력이 틀렸다 — INVALID_ARGUMENT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 시즌이 없다 — NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 지금은 넘길 수 없다 — SEASON_NOT_ACTIVE, TURN_MISMATCH, RECONCILIATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE(운영, 인증 전)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/seasons/{seasonId}/turns/{turnNo}:
    get:
      tags: [turn]
      operationId: getTurn
      summary: 턴 결과 조회
      description: 한 턴의 결과(평가액·변화·현금·누적 낙폭·위험 선언 대비·포지션별 평가액과 비중·포메이션 차이)를 준다. 턴 전환 응답과 같은 형이다. status·pathLength 는 시즌의 지금 값이고, 비중 4개의 합은 1과 최대 2e-8 다를 수 있다. 진행 중이든 끝난 시즌이든 같다.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: turnNo
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: 턴 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResultDto'
        '400':
          description: turnNo 가 1 미만이거나 시즌·턴 번호가 숫자가 아니다 — INVALID_ARGUMENT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 시즌이 없다 — NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 아직 진행하지 않은 턴이다 — TURN_NOT_REACHED(현재 턴보다 큰 번호 전부. 경로 길이를 넘는 번호는 끝난 시즌에서도 이 코드이므로 클라이언트는 pathLength 로 범위를 먼저 거른다)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE(운영, 인증 전)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/seasons/{seasonId}/holdings:
    get:
      tags: [holding]
      operationId: getHoldings
      summary: 현재 팀(보유) 조회
      description: 현재 턴의 보유 × 그 턴 가격, 현금 포함 총액, 포지션별 평가액과 비중, 현재 포메이션 대비 차이를 준다. 이번 턴의 매매가 바로 반영되는 실시간 값이다. 비중 4개의 합은 1과 최대 2e-8 다를 수 있다.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 현재 팀
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingsDto'
        '400':
          description: 시즌 번호가 숫자가 아니다 — INVALID_ARGUMENT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 시즌이 없다 — NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE(운영, 인증 전)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    InternalError:
      description: 예상하지 못한 서버 오류 — INTERNAL_ERROR. 예외 내용은 싣지 않는 고정 문장이다(내용은 서버 로그에만)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PoolDto:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/PoolAssetDto'
    PoolAssetDto:
      type: object
      required: [assetId, market, ticker, name, assetType, returnBasis, proxyIndexName,
                 groupId, groupName, groupKind, systemPosition,
                 upParticipation, downParticipation, volatility, maxDrawdown]
      properties:
        assetId:
          type: integer
          format: int64
          description: 종목 식별자(주문 요청에 쓴다). 표시하지 않는다
        market:
          $ref: '#/components/schemas/Market'
        ticker:
          type: string
        name:
          type: string
        assetType:
          $ref: '#/components/schemas/AssetType'
        returnBasis:
          $ref: '#/components/schemas/ReturnBasis'
        proxyIndexName:
          type: [string, 'null']
          description: 상장 전 구간에 쓰는 추종 지수 이름(ETF만)
        groupId:
          type: integer
          format: int64
        groupName:
          type: string
        groupKind:
          $ref: '#/components/schemas/AssetGroupKind'
        systemPosition:
          $ref: '#/components/schemas/Position'
        upParticipation:
          type: string
          format: decimal
          description: 상승장 참여율(시장이 1% 이상 오른 달, 원화)
        downParticipation:
          type: string
          format: decimal
          description: 하락장 참여율(시장이 1% 이상 빠진 달, 원화)
        volatility:
          type: string
          format: decimal
          description: 월 수익률 표본 표준편차(연율화 안 함)
        maxDrawdown:
          type: string
          format: decimal
          description: 최대 낙폭, 0 이하(−0.35 = −35%)
    StartSeasonRequest:
      type: object
      description: 초기 자금·요율·시드는 요청에서 받지 않는다(서버 설정). pathLength 의 12·24·60 판정은 서버 규칙이다
      required: [riskLimit, formation]
      properties:
        riskLimit:
          type: string
          format: decimal
          description: '위험 선언(감수할 최대 낙폭): -0.10, -0.20, -0.30, -0.40 중 하나'
        formation:
          $ref: '#/components/schemas/FormationDto'
        pathLength:
          type: integer
          format: int32
          default: 12
          description: 경로 길이(턴 수) 12, 24, 60. 생략하면 12
    FormationDto:
      type: object
      description: 포지션별 비중(정수 퍼센트). 합 100, 골키퍼 1 이상. 요청과 응답이 같다
      required: [goalkeeper, defender, midfielder, forward]
      properties:
        goalkeeper:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: 골키퍼 비중(1–100)
        defender:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 수비수 비중(0–100)
        midfielder:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 미드필더 비중(0–100)
        forward:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 공격수 비중(0–100)
    ChangeFormationRequest:
      type: object
      description: 전술 변경 요청. 변경 전 포메이션과 같은 턴 주문과의 연결은 서버가 정한다
      required: [expectedTurnNo, formation]
      properties:
        expectedTurnNo:
          type: integer
          format: int32
          minimum: 0
          description: 변경이 보는 턴. 시즌의 현재 턴과 다르면 409. 0턴(팀 구성 중)에는 전술을 바꿀 수 없어 409
        formation:
          $ref: '#/components/schemas/FormationDto'
        reason:
          type: [string, 'null']
          maxLength: 200
          description: 선택 한 줄 사유(최대 200자, 유니코드 문자 수 기준). 생략과 null 은 같다
    FormationChangeDto:
      type: object
      description: 전술 변경 결과. 변경 번호·시즌 번호·기록 시각·비용은 싣지 않는다
      required: [turnNo, before, after, reason]
      properties:
        turnNo:
          type: integer
          format: int32
          description: 변경한 턴
        before:
          $ref: '#/components/schemas/FormationDto'
        after:
          $ref: '#/components/schemas/FormationDto'
        reason:
          type: [string, 'null']
          description: 사유. 없으면 null
    SeasonDto:
      type: object
      description: 시드·엔진 버전·기준일·스냅샷 날짜·회원 번호·버전·시각은 싣지 않는다
      required: [id, status, currentTurnNo, pathLength, riskLimit, startFormation, currentFormation,
                 initialCash, cashBalance, feeRateKr, feeRateUs, fxSpreadRate]
      properties:
        id:
          type: integer
          format: int64
          description: 시즌 식별자
        status:
          $ref: '#/components/schemas/SeasonStatus'
        currentTurnNo:
          type: integer
          format: int32
          description: 현재 턴(0 = 시작)
        pathLength:
          type: integer
          format: int32
          description: 경로 길이(턴 수)
        riskLimit:
          type: string
          format: decimal
          description: 위험 선언, 소수 8자리(-0.20000000 = -20%)
        startFormation:
          $ref: '#/components/schemas/FormationDto'
        currentFormation:
          $ref: '#/components/schemas/FormationDto'
        initialCash:
          type: string
          format: decimal
          description: 초기 자금, 원 단위 정수
        cashBalance:
          type: string
          format: decimal
          description: 현금 잔액, 원 단위 정수
        feeRateKr:
          type: string
          format: decimal
          description: 국내 수수료율, 소수 8자리
        feeRateUs:
          type: string
          format: decimal
          description: 미국 수수료율, 소수 8자리
        fxSpreadRate:
          type: string
          format: decimal
          description: 환전 비용률, 소수 8자리
    SeasonListDto:
      type: object
      description: 현재 회원의 시즌 전부(시즌 번호 내림차순). 쪽 나누기 없음
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SeasonDto'
    TurnPricesDto:
      type: object
      description: 한 턴의 풀 전체 가격(종목 번호 오름차순)
      required: [turnNo, prices]
      properties:
        turnNo:
          type: integer
          format: int32
        prices:
          type: array
          items:
            $ref: '#/components/schemas/TurnPriceDto'
    TurnPriceDto:
      type: object
      required: [assetId, price]
      properties:
        assetId:
          type: integer
          format: int64
          description: 종목 식별자(풀 응답의 assetId 와 같다)
        price:
          type: string
          format: decimal
          description: 가격, 원 단위 정수
    PlaceOrderRequest:
      type: object
      description: 시장가 매수·매도 한 건. 체결가·수수료·요율은 서버가 정하고 출발점은 서버가 DIRECT 로 고정한다
      required: [expectedTurnNo, side, assetId, quantity]
      properties:
        expectedTurnNo:
          type: integer
          format: int32
          minimum: 0
          description: 주문이 보는 턴. 시즌의 현재 턴과 다르면 409
        side:
          $ref: '#/components/schemas/OrderSide'
        assetId:
          type: integer
          format: int64
          exclusiveMinimum: 0
          description: 종목 식별자(풀 응답의 assetId 와 같다)
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: 정수 주(1 이상)
        declaredPosition:
          $ref: '#/components/schemas/Position'
    OrderResultDto:
      type: object
      description: 기록 시각·출발점·유형·상태·피드 번호·시드·경로·연월은 싣지 않는다
      required: [orderId, turnNo, side, assetId, quantity, fillPrice, notional, fee, cashBalance,
                 holdingQuantity, avgPrice, realizedPnl, declaredPosition, formationChangeId]
      properties:
        orderId:
          type: integer
          format: int64
          description: 주문 식별자
        turnNo:
          type: integer
          format: int32
          description: 주문한 턴
        side:
          $ref: '#/components/schemas/OrderSide'
        assetId:
          type: integer
          format: int64
          description: 종목 식별자(풀 응답의 assetId 와 같다)
        quantity:
          type: integer
          format: int32
          description: 체결 수량
        fillPrice:
          type: string
          format: decimal
          description: 체결가(그 턴 가격), 원 단위 정수
        notional:
          type: string
          format: decimal
          description: 대금(체결가 × 수량), 원 단위 정수
        fee:
          type: string
          format: decimal
          description: 수수료, 원 단위 정수
        cashBalance:
          type: string
          format: decimal
          description: 체결 뒤 현금 잔액, 원 단위 정수
        holdingQuantity:
          type: integer
          format: int32
          description: 체결 뒤 보유 수량
        avgPrice:
          type: string
          format: decimal
          description: 체결 뒤 평균단가(수수료 제외), 소수 4자리
        realizedPnl:
          type: [string, 'null']
          format: decimal
          description: 실현 손익(체결가 − 체결 직전 평균단가) × 수량, 소수 4자리 문자열, 음수 가능. 매수는 null
        declaredPosition:
          $ref: '#/components/schemas/Position'
        formationChangeId:
          type: [integer, 'null']
          format: int64
          description: 그 턴의 마지막 전술 변경 식별자. 변경이 없으면 null
    AdvanceTurnRequest:
      type: object
      description: 전환 전의 현재 턴이 멱등성 열쇠다
      required: [expectedTurnNo]
      properties:
        expectedTurnNo:
          type: integer
          format: int32
          minimum: 0
          description: 전환 전의 현재 턴. 시즌의 현재 턴과 다르면 409
    TurnResultDto:
      type: object
      description: 저장한 턴 행의 값과 거기서 계산한 비율. 턴 전환 응답과 턴 조회가 같은 형이다. 비중 4개의 합은 1과 최대 2e-8 다를 수 있고, status·pathLength 는 시즌의 지금 값이다. targetFormation 은 그 턴 시작 시점의 목표다. 대사 시도 번호·상태·시드·경로·월 블록·연월·수익률 종류는 싣지 않는다
      required: [seasonId, turnNo, status, pathLength, cashBalance, holdingsValue, totalValue, goalkeeperValue,
                 defenderValue, midfielderValue, forwardValue, drawdown, previousTotalValue, valueChange, periodReturn,
                 riskLimit, riskHeadroom, riskBreached, goalkeeperWeight, defenderWeight, midfielderWeight,
                 forwardWeight, targetFormation, goalkeeperGap, defenderGap, midfielderGap, forwardGap,
                 formationDeviation]
      properties:
        seasonId:
          type: integer
          format: int64
          description: 시즌 식별자
        turnNo:
          type: integer
          format: int32
          description: 이 결과의 턴(전환 응답에서는 방금 적용된 턴 = 새 현재 턴)
        status:
          $ref: '#/components/schemas/SeasonStatus'
        pathLength:
          type: integer
          format: int32
          description: 경로 길이(턴 수)
        cashBalance:
          type: string
          format: decimal
          description: 현금 잔액, 원 단위 정수
        holdingsValue:
          type: string
          format: decimal
          description: 보유 평가액, 원 단위 정수
        totalValue:
          type: string
          format: decimal
          description: 총 평가액, 원 단위 정수
        goalkeeperValue:
          type: string
          format: decimal
          description: 골키퍼 평가액(현금 포함), 원 단위 정수
        defenderValue:
          type: string
          format: decimal
          description: 수비수 평가액, 원 단위 정수
        midfielderValue:
          type: string
          format: decimal
          description: 미드필더 평가액, 원 단위 정수
        forwardValue:
          type: string
          format: decimal
          description: 공격수 평가액, 원 단위 정수
        drawdown:
          type: string
          format: decimal
          description: 누적 낙폭(0 이하), 소수 8자리
        previousTotalValue:
          type: string
          format: decimal
          description: 직전 턴의 총 평가액(1턴이면 초기 자금), 원 단위 정수
        valueChange:
          type: string
          format: decimal
          description: 총 평가액 − 직전 총 평가액(음수 가능), 원 단위 정수
        periodReturn:
          type: string
          format: decimal
          description: 기간 수익률 = 변화 ÷ 직전 총 평가액, 소수 8자리
        riskLimit:
          type: string
          format: decimal
          description: 위험 선언(0 이하), 소수 8자리
        riskHeadroom:
          type: string
          format: decimal
          description: 위험 선언까지의 여유 = 낙폭 − 선언, 소수 8자리. 0 이상이면 선언 안, 음수면 넘었다
        riskBreached:
          type: boolean
          description: 낙폭이 위험 선언을 넘었는가(낙폭 < 선언)
        goalkeeperWeight:
          type: string
          format: decimal
          description: 골키퍼 비중 = 평가액 ÷ 총 평가액, 소수 8자리
        defenderWeight:
          type: string
          format: decimal
          description: 수비수 비중, 소수 8자리
        midfielderWeight:
          type: string
          format: decimal
          description: 미드필더 비중, 소수 8자리
        forwardWeight:
          type: string
          format: decimal
          description: 공격수 비중, 소수 8자리
        targetFormation:
          $ref: '#/components/schemas/FormationDto'
        goalkeeperGap:
          type: string
          format: decimal
          description: 골키퍼 비중 − 목표(양수 = 목표보다 많음), 소수 8자리
        defenderGap:
          type: string
          format: decimal
          description: 수비수 비중 − 목표, 소수 8자리
        midfielderGap:
          type: string
          format: decimal
          description: 미드필더 비중 − 목표, 소수 8자리
        forwardGap:
          type: string
          format: decimal
          description: 공격수 비중 − 목표, 소수 8자리
        formationDeviation:
          type: string
          format: decimal
          description: 포메이션 이탈 = 포지션별 |비중 − 목표|의 합, 소수 8자리
    HoldingsDto:
      type: object
      description: 현재 턴의 보유 × 그 턴 가격(이번 턴의 매매가 바로 반영되는 실시간 값). 매매가 없는 턴이면 총액·보유 평가액·포지션별 평가액이 그 턴의 턴 결과와 같다. currentFormation 은 지금 적용 중인 포메이션이다. 비중 4개의 합은 1과 최대 2e-8 다를 수 있다. 시드·경로·월 블록·연월·수익률 종류는 싣지 않는다
      required: [seasonId, turnNo, cashBalance, holdingsValue, totalValue, goalkeeperValue, defenderValue,
                 midfielderValue, forwardValue, goalkeeperWeight, defenderWeight, midfielderWeight, forwardWeight,
                 currentFormation, goalkeeperGap, defenderGap, midfielderGap, forwardGap, formationDeviation, holdings]
      properties:
        seasonId:
          type: integer
          format: int64
          description: 시즌 식별자
        turnNo:
          type: integer
          format: int32
          description: 시즌의 현재 턴(가격 기준 턴)
        cashBalance:
          type: string
          format: decimal
          description: 현금 잔액(지금), 원 단위 정수
        holdingsValue:
          type: string
          format: decimal
          description: 보유 평가액 = Σ 수량 × 현재 턴 가격, 원 단위 정수
        totalValue:
          type: string
          format: decimal
          description: 총 평가액 = 현금 + 보유 평가액, 원 단위 정수
        goalkeeperValue:
          type: string
          format: decimal
          description: 골키퍼 평가액(현금 포함, 총액 − 나머지 셋), 원 단위 정수
        defenderValue:
          type: string
          format: decimal
          description: 수비수 평가액, 원 단위 정수
        midfielderValue:
          type: string
          format: decimal
          description: 미드필더 평가액, 원 단위 정수
        forwardValue:
          type: string
          format: decimal
          description: 공격수 평가액, 원 단위 정수
        goalkeeperWeight:
          type: string
          format: decimal
          description: 골키퍼 비중 = 평가액 ÷ 총 평가액, 소수 8자리
        defenderWeight:
          type: string
          format: decimal
          description: 수비수 비중, 소수 8자리
        midfielderWeight:
          type: string
          format: decimal
          description: 미드필더 비중, 소수 8자리
        forwardWeight:
          type: string
          format: decimal
          description: 공격수 비중, 소수 8자리
        currentFormation:
          $ref: '#/components/schemas/FormationDto'
        goalkeeperGap:
          type: string
          format: decimal
          description: 골키퍼 비중 − 현재 포메이션(양수 = 목표보다 많음), 소수 8자리
        defenderGap:
          type: string
          format: decimal
          description: 수비수 비중 − 현재 포메이션, 소수 8자리
        midfielderGap:
          type: string
          format: decimal
          description: 미드필더 비중 − 현재 포메이션, 소수 8자리
        forwardGap:
          type: string
          format: decimal
          description: 공격수 비중 − 현재 포메이션, 소수 8자리
        formationDeviation:
          type: string
          format: decimal
          description: 포메이션 이탈 = 포지션별 |비중 − 현재 포메이션|의 합, 소수 8자리
        holdings:
          type: array
          description: 수량 1 이상인 보유(종목 번호 오름차순)
          items:
            $ref: '#/components/schemas/HoldingDto'
    HoldingDto:
      type: object
      description: 보유 한 종목. 종목 이름은 싣지 않는다 — 풀 응답의 assetId 로 잇는다
      required: [assetId, quantity, avgPrice, declaredPosition, price, value, weight]
      properties:
        assetId:
          type: integer
          format: int64
          description: 종목 식별자(풀 응답의 assetId 와 같다)
        quantity:
          type: integer
          format: int32
          description: 보유 수량(1 이상)
        avgPrice:
          type: string
          format: decimal
          description: 평균단가(수수료 제외), 소수 4자리
        declaredPosition:
          $ref: '#/components/schemas/Position'
        price:
          type: string
          format: decimal
          description: 현재 턴 가격, 원 단위 정수
        value:
          type: string
          format: decimal
          description: 평가액 = 수량 × 현재 턴 가격, 원 단위 정수
        weight:
          type: string
          format: decimal
          description: 종목 비중 = 평가액 ÷ 총 평가액(현금 포함), 소수 8자리
    OrderSide:
      type: string
      enum: [BUY, SELL]
    SeasonStatus:
      type: string
      enum: [IN_PROGRESS, ABANDONING, FINISHED]
    Market:
      type: string
      enum: [KR, US]
    AssetType:
      type: string
      enum: [STOCK, ETF]
    ReturnBasis:
      type: string
      enum: [PRICE, TOTAL]
    AssetGroupKind:
      type: string
      enum: [SECTOR, ASSET_CLASS]
    Position:
      type: string
      enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD_TARGET, FORWARD_BREAKOUT, FORWARD_DEFENSIVE]
    Problem:
      type: object
      description: RFC 9457 문제 상세 + 최상위 code. type은 about:blank라 생략된다
      required: [title, status, detail, instance, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
          description: 고정 한국어 문장. 거부된 값·금액을 싣지 않는다
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          description: '@Valid 위반일 때만'
          items:
            $ref: '#/components/schemas/FieldViolation'
    FieldViolation:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
          description: 제약 애너테이션 단순 이름(예 Min)
    ErrorCode:
      type: string
      enum: [INVALID_ARGUMENT, NOT_FOUND, METHOD_NOT_ALLOWED, NOT_ACCEPTABLE,
             UNSUPPORTED_MEDIA_TYPE, INTERNAL_ERROR, POOL_NOT_LOADED, POOL_NOT_JUDGED, PATH_TOO_LONG,
             SEASON_LIMIT, TURN_NOT_REACHED, SEASON_NOT_ACTIVE, TURN_MISMATCH, LEDGER_MISMATCH,
             LINEUP_MISMATCH, ASSET_NOT_IN_POOL, INSUFFICIENT_CASH, INSUFFICIENT_HOLDING, POSITION_CONFLICT, POSITION_REQUIRED,
             INVALID_FORMATION, EVENT_TIME_CONFLICT, MEMBER_UNAVAILABLE, RECONCILIATION_FAILED, FORBIDDEN]
