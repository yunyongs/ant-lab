openapi: 3.1.0
info:
  title: my Fund Manager API
  version: 0.0.1
  description: |
    시즌 한 판 REST API(Phase 0). 금액·비율은 지수 없는 문자열(소수 자릿수 유지),
    수량·턴 번호·포메이션 비중은 정수다. 오류는 application/problem+json(Problem).
    시즌 중 응답에는 실제 날짜·사건 이름·경로가 나가지 않는다.
paths:
  /api/v1/pool:
    get:
      tags: [pool]
      operationId: getPool
      summary: 기준일 종목 풀
      description: |
        서버 설정의 기준일 풀 전체를 시장·종목코드 순서로 준다. 시스템 판정 포지션과
        판정 근거(참여율·변동성·최대 낙폭, 원화·월 단위·소수 8자리)를 함께 준다.
      responses:
        '200':
          description: 기준일 풀
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolDto'
        '409':
          description: 풀이 준비되지 않았다 — POOL_NOT_LOADED(행 없음), POOL_NOT_JUDGED(판정 빈 종목 있음)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/seasons:
    post:
      tags: [season]
      operationId: startSeason
      summary: 시즌 시작
      description: |
        위험 선언·포메이션·경로 길이로 새 시즌을 시작한다. 초기 자금·요율은 서버 설정이 정한다.
        시즌·경로·현금 계좌·입금·0턴 가격이 한 트랜잭션으로 만들어진다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSeasonRequest'
      responses:
        '201':
          description: 시작한 시즌
          headers:
            Location:
              description: 새 시즌의 주소
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
        '400':
          description: 입력이 틀렸다 — INVALID_ARGUMENT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 지금은 시작할 수 없다 — POOL_NOT_LOADED, POOL_NOT_JUDGED, SEASON_LIMIT(진행 중 3개)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 요청한 길이의 경로를 만들 수 없다 — PATH_TOO_LONG
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE(운영, 인증 전)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [season]
      operationId: listSeasons
      summary: 내 시즌 목록
      description: 현재 회원의 시즌 전부를 시즌 번호 내림차순으로 준다.
      responses:
        '200':
          description: 시즌 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonListDto'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/seasons/{seasonId}:
    get:
      tags: [season]
      operationId: getSeason
      summary: 시즌 한 개
      description: 현재 회원의 시즌 한 개. 없거나 다른 회원의 시즌이면 404.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 시즌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
        '400':
          description: 시즌 번호가 숫자가 아니다 — INVALID_ARGUMENT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 시즌이 없다 — NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/seasons/{seasonId}/prices:
    get:
      tags: [season]
      operationId: getTurnPrices
      summary: 턴 가격
      description: 한 턴의 풀 전체 가격을 종목 번호 순으로 준다. turnNo 를 생략하면 현재 턴.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: turnNo
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        '200':
          description: 그 턴의 가격
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnPricesDto'
        '400':
          description: turnNo 또는 시즌 번호가 틀렸다 — INVALID_ARGUMENT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 시즌이 없다 — NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 아직 진행하지 않은 턴이다 — TURN_NOT_REACHED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/seasons/{seasonId}/orders:
    post:
      tags: [order]
      operationId: placeOrder
      summary: 주문(시장가 매수)
      description: 현재 턴 가격으로 한 건을 바로 체결한다. 0턴 팀 구성과 1턴 이후 매수가 같은 경로다. 대금과 수수료는 현금에서 빠지고 보유·라인업이 함께 바뀐다. 매도는 아직 받지 않는다(400).
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: 체결 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResultDto'
        '400':
          description: 입력이 틀렸다(수량 0 이하, 매도 포함) — INVALID_ARGUMENT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 시즌이 없다 — NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 지금은 주문할 수 없다 — SEASON_NOT_ACTIVE, TURN_MISMATCH, LEDGER_MISMATCH, LINEUP_MISMATCH
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 주문 내용을 받을 수 없다 — ASSET_NOT_IN_POOL, INSUFFICIENT_CASH, POSITION_CONFLICT, POSITION_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE(운영, 인증 전)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    PoolDto:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/PoolAssetDto'
    PoolAssetDto:
      type: object
      required: [assetId, market, ticker, name, assetType, returnBasis, proxyIndexName,
                 groupId, groupName, groupKind, systemPosition,
                 upParticipation, downParticipation, volatility, maxDrawdown]
      properties:
        assetId:
          type: integer
          format: int64
          description: 종목 식별자(주문 요청에 쓴다). 표시하지 않는다
        market:
          $ref: '#/components/schemas/Market'
        ticker:
          type: string
        name:
          type: string
        assetType:
          $ref: '#/components/schemas/AssetType'
        returnBasis:
          $ref: '#/components/schemas/ReturnBasis'
        proxyIndexName:
          type: [string, 'null']
          description: 상장 전 구간에 쓰는 추종 지수 이름(ETF만)
        groupId:
          type: integer
          format: int64
        groupName:
          type: string
        groupKind:
          $ref: '#/components/schemas/AssetGroupKind'
        systemPosition:
          $ref: '#/components/schemas/Position'
        upParticipation:
          type: string
          format: decimal
          description: 상승장 참여율(시장이 1% 이상 오른 달, 원화)
        downParticipation:
          type: string
          format: decimal
          description: 하락장 참여율(시장이 1% 이상 빠진 달, 원화)
        volatility:
          type: string
          format: decimal
          description: 월 수익률 표본 표준편차(연율화 안 함)
        maxDrawdown:
          type: string
          format: decimal
          description: 최대 낙폭, 0 이하(−0.35 = −35%)
    StartSeasonRequest:
      type: object
      description: 초기 자금·요율·시드는 요청에서 받지 않는다(서버 설정). pathLength 의 12·24·60 판정은 서버 규칙이다
      required: [riskLimit, formation]
      properties:
        riskLimit:
          type: string
          format: decimal
          description: '위험 선언(감수할 최대 낙폭): -0.10, -0.20, -0.30, -0.40 중 하나'
        formation:
          $ref: '#/components/schemas/FormationDto'
        pathLength:
          type: integer
          format: int32
          default: 12
          description: 경로 길이(턴 수) 12, 24, 60. 생략하면 12
    FormationDto:
      type: object
      description: 포지션별 비중(정수 퍼센트). 합 100, 골키퍼 1 이상. 요청과 응답이 같다
      required: [goalkeeper, defender, midfielder, forward]
      properties:
        goalkeeper:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: 골키퍼 비중(1–100)
        defender:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 수비수 비중(0–100)
        midfielder:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 미드필더 비중(0–100)
        forward:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 공격수 비중(0–100)
    SeasonDto:
      type: object
      description: 시드·엔진 버전·기준일·스냅샷 날짜·회원 번호·버전·시각은 싣지 않는다
      required: [id, status, currentTurnNo, pathLength, riskLimit, startFormation, currentFormation,
                 initialCash, cashBalance, feeRateKr, feeRateUs, fxSpreadRate]
      properties:
        id:
          type: integer
          format: int64
          description: 시즌 식별자
        status:
          $ref: '#/components/schemas/SeasonStatus'
        currentTurnNo:
          type: integer
          format: int32
          description: 현재 턴(0 = 시작)
        pathLength:
          type: integer
          format: int32
          description: 경로 길이(턴 수)
        riskLimit:
          type: string
          format: decimal
          description: 위험 선언, 소수 8자리(-0.20000000 = -20%)
        startFormation:
          $ref: '#/components/schemas/FormationDto'
        currentFormation:
          $ref: '#/components/schemas/FormationDto'
        initialCash:
          type: string
          format: decimal
          description: 초기 자금, 원 단위 정수
        cashBalance:
          type: string
          format: decimal
          description: 현금 잔액, 원 단위 정수
        feeRateKr:
          type: string
          format: decimal
          description: 국내 수수료율, 소수 8자리
        feeRateUs:
          type: string
          format: decimal
          description: 미국 수수료율, 소수 8자리
        fxSpreadRate:
          type: string
          format: decimal
          description: 환전 비용률, 소수 8자리
    SeasonListDto:
      type: object
      description: 현재 회원의 시즌 전부(시즌 번호 내림차순). 쪽 나누기 없음
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SeasonDto'
    TurnPricesDto:
      type: object
      description: 한 턴의 풀 전체 가격(종목 번호 오름차순)
      required: [turnNo, prices]
      properties:
        turnNo:
          type: integer
          format: int32
        prices:
          type: array
          items:
            $ref: '#/components/schemas/TurnPriceDto'
    TurnPriceDto:
      type: object
      required: [assetId, price]
      properties:
        assetId:
          type: integer
          format: int64
          description: 종목 식별자(풀 응답의 assetId 와 같다)
        price:
          type: string
          format: decimal
          description: 가격, 원 단위 정수
    PlaceOrderRequest:
      type: object
      description: 시장가 한 건. 체결가·수수료·요율은 서버가 정하고 출발점은 서버가 DIRECT 로 고정한다
      required: [expectedTurnNo, side, assetId, quantity]
      properties:
        expectedTurnNo:
          type: integer
          format: int32
          minimum: 0
          description: 주문이 보는 턴. 시즌의 현재 턴과 다르면 409
        side:
          $ref: '#/components/schemas/OrderSide'
        assetId:
          type: integer
          format: int64
          exclusiveMinimum: 0
          description: 종목 식별자(풀 응답의 assetId 와 같다)
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: 정수 주(1 이상)
        declaredPosition:
          $ref: '#/components/schemas/Position'
    OrderResultDto:
      type: object
      description: 기록 시각·출발점·유형·상태·피드 번호·시드·경로·연월은 싣지 않는다
      required: [orderId, turnNo, side, assetId, quantity, fillPrice, notional, fee, cashBalance,
                 holdingQuantity, avgPrice, declaredPosition, formationChangeId]
      properties:
        orderId:
          type: integer
          format: int64
          description: 주문 식별자
        turnNo:
          type: integer
          format: int32
          description: 주문한 턴
        side:
          $ref: '#/components/schemas/OrderSide'
        assetId:
          type: integer
          format: int64
          description: 종목 식별자(풀 응답의 assetId 와 같다)
        quantity:
          type: integer
          format: int32
          description: 체결 수량
        fillPrice:
          type: string
          format: decimal
          description: 체결가(그 턴 가격), 원 단위 정수
        notional:
          type: string
          format: decimal
          description: 대금(체결가 × 수량), 원 단위 정수
        fee:
          type: string
          format: decimal
          description: 수수료, 원 단위 정수
        cashBalance:
          type: string
          format: decimal
          description: 체결 뒤 현금 잔액, 원 단위 정수
        holdingQuantity:
          type: integer
          format: int32
          description: 체결 뒤 보유 수량
        avgPrice:
          type: string
          format: decimal
          description: 체결 뒤 평균단가(수수료 제외), 소수 4자리
        declaredPosition:
          $ref: '#/components/schemas/Position'
        formationChangeId:
          type: [integer, 'null']
          format: int64
          description: 그 턴의 마지막 전술 변경 식별자. 변경이 없으면 null
    OrderSide:
      type: string
      enum: [BUY, SELL]
    SeasonStatus:
      type: string
      enum: [IN_PROGRESS, ABANDONING, FINISHED]
    Market:
      type: string
      enum: [KR, US]
    AssetType:
      type: string
      enum: [STOCK, ETF]
    ReturnBasis:
      type: string
      enum: [PRICE, TOTAL]
    AssetGroupKind:
      type: string
      enum: [SECTOR, ASSET_CLASS]
    Position:
      type: string
      enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD_TARGET, FORWARD_BREAKOUT, FORWARD_DEFENSIVE]
    Problem:
      type: object
      description: RFC 9457 문제 상세 + 최상위 code. type은 about:blank라 생략된다
      required: [title, status, detail, instance, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
          description: 고정 한국어 문장. 거부된 값·금액을 싣지 않는다
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          description: '@Valid 위반일 때만'
          items:
            $ref: '#/components/schemas/FieldViolation'
    FieldViolation:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
          description: 제약 애너테이션 단순 이름(예 Min)
    ErrorCode:
      type: string
      enum: [INVALID_ARGUMENT, NOT_FOUND, METHOD_NOT_ALLOWED, NOT_ACCEPTABLE,
             UNSUPPORTED_MEDIA_TYPE, INTERNAL_ERROR, POOL_NOT_LOADED, POOL_NOT_JUDGED, PATH_TOO_LONG,
             SEASON_LIMIT, TURN_NOT_REACHED, SEASON_NOT_ACTIVE, TURN_MISMATCH, LEDGER_MISMATCH,
             LINEUP_MISMATCH, ASSET_NOT_IN_POOL, INSUFFICIENT_CASH, POSITION_CONFLICT, POSITION_REQUIRED,
             MEMBER_UNAVAILABLE]
