        periodReturn:
          type: string
          format: decimal
          description: Period return = change ÷ previous total valuation, 8 decimal places / 기간 수익률 = 변화 ÷ 직전 총 평가액, 소수 8자리
        riskLimit:
          type: string
          format: decimal
          description: Risk limit (0 or less), 8 decimal places / 위험 선언(0 이하), 소수 8자리
