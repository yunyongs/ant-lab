            That turn has not been played yet — TURN_NOT_REACHED (every number above the current turn; a number beyond the path length gets this code even in a finished season, so clients first check the range against pathLength)

            아직 진행하지 않은 턴이다 — TURN_NOT_REACHED(현재 턴보다 큰 번호 전부. 경로 길이를 넘는 번호는 끝난 시즌에서도 이 코드이므로 클라이언트는 pathLength 로 범위를 먼저 거른다)
