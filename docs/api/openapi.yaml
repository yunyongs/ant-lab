openapi: 3.1.0
info:
  title: my Fund Manager API
  version: 0.0.1
  description: |-
    REST API for one season of play (Phase 0). Money and ratios are exponent-free strings (decimal places kept); quantities, turn numbers and formation shares are integers. Errors are application/problem+json (Problem). Responses during a season never carry real dates, event names or the path.

    시즌 한 판 REST API(Phase 0). 금액·비율은 지수 없는 문자열(소수 자릿수 유지),
    수량·턴 번호·포메이션 비중은 정수다. 오류는 application/problem+json(Problem).
    시즌 중 응답에는 실제 날짜·사건 이름·경로가 나가지 않는다.
# Errors raised by the framework for any operation (wrong method, unsupported Accept or Content-Type). They are not
# repeated per operation. / 프레임워크가 모든 연산에 공통으로 내는 오류(메서드·Accept·Content-Type). 연산마다 적지 않는다.
x-framework-errors:
  '405': [METHOD_NOT_ALLOWED]
  '406': [NOT_ACCEPTABLE]
  '415': [UNSUPPORTED_MEDIA_TYPE]
paths:
  /api/v1/pool:
    get:
      tags: [pool]
      operationId: getPool
      summary: Asset pool on the reference date / 기준일 종목 풀
      description: |-
        Returns the whole pool of the server-configured reference date, ordered by market and asset code. Each asset carries its system-judged position and the judgment basis (participation rates, volatility, maximum drawdown; KRW, monthly, 8 decimal places).

        서버 설정의 기준일 풀 전체를 시장·종목코드 순서로 준다. 시스템 판정 포지션과
        판정 근거(참여율·변동성·최대 낙폭, 원화·월 단위·소수 8자리)를 함께 준다.
      responses:
        '200':
          description: Pool on the reference date / 기준일 풀
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolDto'
        '409':
          description: |-
            The pool is not ready — POOL_NOT_LOADED (no rows), POOL_NOT_JUDGED (some assets have no judgment)

            풀이 준비되지 않았다 — POOL_NOT_LOADED(행 없음), POOL_NOT_JUDGED(판정 빈 종목 있음)
          x-error-codes: [POOL_NOT_LOADED, POOL_NOT_JUDGED]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: Sign up / 가입
      description: |-
        Creates a member with the USER role from an email, a display name and a password. Open self-signup without email verification (v0.1). The password is stored only as a BCrypt hash.

        이메일·표시 이름·비밀번호로 USER 역할의 회원을 만든다. 이메일 확인 없는 자유 가입이다(v0.1). 비밀번호는 BCrypt 해시로만 저장한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: The new member / 새 회원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDto'
        '400':
          description: The input is invalid — INVALID_ARGUMENT / 입력이 틀렸다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The email is already registered (in any letter case) — EMAIL_TAKEN / 이미 가입한 이메일이다(대소문자 무시) — EMAIL_TAKEN
          x-error-codes: [EMAIL_TAKEN]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in / 로그인
      description: |-
        Checks the email (in any letter case) and password and starts a login. The access token (JWT, 15 minutes) is in the body; keep it in memory only. The refresh token is set as an HttpOnly cookie for /api/v1/auth and is never in a body.

        이메일(대소문자 무시)과 비밀번호를 확인하고 로그인을 시작한다. 접근 토큰(JWT, 15분)은 본문에 있으며 메모리에만 둔다. 갱신 토큰은 /api/v1/auth 경로의 HttpOnly 쿠키로 설정되고 본문에는 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in / 로그인함
          headers:
            Set-Cookie:
              description: The refresh token cookie (antlab_refresh) / 갱신 토큰 쿠키(antlab_refresh)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenDto'
        '400':
          description: The input is invalid — INVALID_ARGUMENT / 입력이 틀렸다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The email or password is wrong; the same answer for an unknown email — INVALID_CREDENTIALS / 이메일이나 비밀번호가 맞지 않다. 없는 이메일도 같은 답이다 — INVALID_CREDENTIALS
          x-error-codes: [INVALID_CREDENTIALS]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Refresh the access token / 접근 토큰 갱신
      description: |-
        Rotates the refresh token from the antlab_refresh cookie: the presented token is retired, a new cookie and a new access token are returned. Presenting an already rotated token again ends that login on every device that shares it.

        antlab_refresh 쿠키의 갱신 토큰을 회전한다: 제시한 토큰은 폐기하고 새 쿠키와 새 접근 토큰을 돌려준다. 이미 회전한 토큰을 다시 제시하면 그 로그인이 모든 기기에서 끝난다.
      parameters:
        - name: antlab_refresh
          in: cookie
          description: The refresh token cookie set by login / 로그인이 설정한 갱신 토큰 쿠키
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Refreshed / 갱신함
          headers:
            Set-Cookie:
              description: The rotated refresh token cookie (antlab_refresh) / 회전한 갱신 토큰 쿠키(antlab_refresh)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenDto'
        '401':
          description: The refresh token is missing, unknown, expired or revoked — UNAUTHENTICATED / 갱신 토큰이 없거나 모르거나 만료·폐기되었다 — UNAUTHENTICATED
          x-error-codes: [UNAUTHENTICATED]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Log out / 로그아웃
      description: |-
        Ends the login of the antlab_refresh cookie and clears the cookie. Always answers 204, also without a cookie.

        antlab_refresh 쿠키의 로그인을 끝내고 쿠키를 지운다. 쿠키가 없어도 언제나 204로 답한다.
      parameters:
        - name: antlab_refresh
          in: cookie
          description: The refresh token cookie set by login / 로그인이 설정한 갱신 토큰 쿠키
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Logged out / 로그아웃함
          headers:
            Set-Cookie:
              description: Clears the refresh token cookie / 갱신 토큰 쿠키를 지운다
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/seasons:
    post:
      tags: [season]
      operationId: startSeason
      summary: Start a season / 시즌 시작
      description: |-
        Starts a new season from a risk limit, a formation and a path length. Initial capital and rates come from the server configuration. The season, path, cash account, deposit and turn-0 prices are created in one transaction.

        위험 선언·포메이션·경로 길이로 새 시즌을 시작한다. 초기 자금·요율은 서버 설정이 정한다.
        시즌·경로·현금 계좌·입금·0턴 가격이 한 트랜잭션으로 만들어진다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSeasonRequest'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: The season that was started / 시작한 시즌
          headers:
            Location:
              description: Address of the new season / 새 시즌의 주소
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
        '400':
          description: The input is invalid — INVALID_ARGUMENT / 입력이 틀렸다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |-
            A season cannot be started now — POOL_NOT_LOADED, POOL_NOT_JUDGED, SEASON_LIMIT (3 in progress)

            지금은 시작할 수 없다 — POOL_NOT_LOADED, POOL_NOT_JUDGED, SEASON_LIMIT(진행 중 3개)
          x-error-codes: [POOL_NOT_LOADED, POOL_NOT_JUDGED, SEASON_LIMIT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: A path of the requested length cannot be built — PATH_TOO_LONG / 요청한 길이의 경로를 만들 수 없다 — PATH_TOO_LONG
          x-error-codes: [PATH_TOO_LONG]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The current member is unknown — MEMBER_UNAVAILABLE / 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE
          x-error-codes: [MEMBER_UNAVAILABLE]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [season]
      operationId: listSeasons
      summary: My seasons / 내 시즌 목록
      description: Returns all seasons of the current member, newest season number first. / 현재 회원의 시즌 전부를 시즌 번호 내림차순으로 준다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Season list / 시즌 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonListDto'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: The current member is unknown — MEMBER_UNAVAILABLE / 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE
          x-error-codes: [MEMBER_UNAVAILABLE]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/seasons/{seasonId}:
    get:
      tags: [season]
      operationId: getSeason
      summary: One season / 시즌 한 개
      description: One season of the current member. 404 if it does not exist or belongs to another member. / 현재 회원의 시즌 한 개. 없거나 다른 회원의 시즌이면 404.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Season / 시즌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
        '400':
          description: The season number is not a number — INVALID_ARGUMENT / 시즌 번호가 숫자가 아니다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The season does not exist — NOT_FOUND / 시즌이 없다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The current member is unknown — MEMBER_UNAVAILABLE / 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE
          x-error-codes: [MEMBER_UNAVAILABLE]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/seasons/{seasonId}/prices:
    get:
      tags: [season]
      operationId: getTurnPrices
      summary: Turn prices / 턴 가격
      description: |-
        Returns the prices of the whole pool for one turn, ordered by asset number. If turnNo is omitted, returns prices for the current turn.

        한 턴의 풀 전체 가격을 종목 번호 순으로 준다. turnNo 를 생략하면 현재 턴.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: turnNo
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Prices of that turn / 그 턴의 가격
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnPricesDto'
        '400':
          description: turnNo or the season number is wrong — INVALID_ARGUMENT / turnNo 또는 시즌 번호가 틀렸다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The season does not exist — NOT_FOUND / 시즌이 없다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: That turn has not been played yet — TURN_NOT_REACHED / 아직 진행하지 않은 턴이다 — TURN_NOT_REACHED
          x-error-codes: [TURN_NOT_REACHED]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The current member is unknown — MEMBER_UNAVAILABLE / 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE
          x-error-codes: [MEMBER_UNAVAILABLE]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/seasons/{seasonId}/orders:
    post:
      tags: [order]
      operationId: placeOrder
      summary: Order (market buy or sell) / 주문(시장가 매수·매도)
      description: |-
        Fills one order immediately at the current turn price. Turn-0 team setup and buys from turn 1 onward use the same path. A buy takes the amount and fee out of cash and changes holdings and lineup together. A sell adds the amount to cash, deducts the fee, records the realized P&L, and closes the position span when everything is sold.

        현재 턴 가격으로 한 건을 바로 체결한다. 0턴 팀 구성과 1턴 이후 매수가 같은 경로다. 매수는 대금과 수수료가 현금에서 빠지고 보유·라인업이 함께 바뀐다. 매도는 대금이 현금에 더해지고 수수료가 빠지며 실현 손익이 기록되고, 전량 매도면 구간이 닫힌다.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Fill result / 체결 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResultDto'
        '400':
          description: The input is invalid (quantity 0 or less, declared position on a sell) — INVALID_ARGUMENT / 입력이 틀렸다(수량 0 이하, 매도에 선언 포지션) — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The season does not exist — NOT_FOUND / 시즌이 없다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |-
            An order cannot be placed now — SEASON_NOT_ACTIVE, TURN_MISMATCH, LEDGER_MISMATCH, LINEUP_MISMATCH, EVENT_TIME_CONFLICT

            지금은 주문할 수 없다 — SEASON_NOT_ACTIVE, TURN_MISMATCH, LEDGER_MISMATCH, LINEUP_MISMATCH, EVENT_TIME_CONFLICT
          x-error-codes: [SEASON_NOT_ACTIVE, TURN_MISMATCH, LEDGER_MISMATCH, LINEUP_MISMATCH, EVENT_TIME_CONFLICT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |-
            The order content is not acceptable — ASSET_NOT_IN_POOL, INSUFFICIENT_CASH, INSUFFICIENT_HOLDING, POSITION_CONFLICT, POSITION_REQUIRED

            주문 내용을 받을 수 없다 — ASSET_NOT_IN_POOL, INSUFFICIENT_CASH, INSUFFICIENT_HOLDING, POSITION_CONFLICT, POSITION_REQUIRED
          x-error-codes: [ASSET_NOT_IN_POOL, INSUFFICIENT_CASH, INSUFFICIENT_HOLDING, POSITION_CONFLICT, POSITION_REQUIRED]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The current member is unknown — MEMBER_UNAVAILABLE / 현재 회원을 알 수 없다 — MEMBER_UNAVAILABLE
          x-error-codes: [MEMBER_UNAVAILABLE]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/seasons/{seasonId}/formation-changes:
    post:
      tags: [formation]
      operationId: changeFormation
      summary: Formation change / 전술 변경
      description: |-
        Changes the current formation to a new value and keeps the change history. It can be changed several times in the same turn and every change is recorded. Orders placed after a change in the same turn are tied to the latest change. It cannot be changed at turn 0 while the team is being built.

        현재 포메이션을 새 값으로 바꾸고 변경 이력을 남긴다. 같은 턴에 여러 번 바꿀 수 있고 모두 기록된다. 변경 뒤 같은 턴의 주문은 가장 마지막 변경에 묶인다. 팀 구성 중인 0턴에는 바꿀 수 없다.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeFormationRequest'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Change result (turn, before, after, reason) / 변경 결과(턴·이전·이후·사유)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormationChangeDto'
        '400':
          description: |-
            The input is invalid (sum ≠ 100, goalkeeper 0, out of range, missing required value, reason over 200 characters, same formation as now) — INVALID_ARGUMENT

            입력이 틀렸다(합 ≠ 100, 골키퍼 0, 범위 밖, 필수값 누락, 사유 200자 초과, 현재와 같은 포메이션) — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The season does not exist — NOT_FOUND / 시즌이 없다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |-
            It cannot be changed now — SEASON_NOT_ACTIVE, TURN_MISMATCH (including turn 0), INVALID_FORMATION, EVENT_TIME_CONFLICT

            지금은 바꿀 수 없다 — SEASON_NOT_ACTIVE, TURN_MISMATCH(0턴 포함), INVALID_FORMATION, EVENT_TIME_CONFLICT
          x-error-codes: [SEASON_NOT_ACTIVE, TURN_MISMATCH, INVALID_FORMATION, EVENT_TIME_CONFLICT]
          content:
            application/problem+json:
              schema:
