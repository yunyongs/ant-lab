components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        The access token from POST /api/v1/auth/login or /api/v1/auth/refresh, sent as Authorization: Bearer <token>. It lasts 15 minutes.

        POST /api/v1/auth/login이나 /api/v1/auth/refresh가 준 접근 토큰을 Authorization: Bearer <토큰>으로 보낸다. 15분 동안 쓴다.
  responses:
    Unauthenticated:
      description: |-
        The request has no valid bearer token: missing, expired, wrongly signed, or naming no member — UNAUTHENTICATED

        유효한 Bearer 토큰이 없다: 없거나 만료됐거나 서명이 틀렸거나 없는 회원의 토큰이다 — UNAUTHENTICATED
      x-error-codes: [UNAUTHENTICATED]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: |-
        An unexpected server error — INTERNAL_ERROR. The message is a fixed sentence that carries no exception content (the content goes to the server log only)

        예상하지 못한 서버 오류 — INTERNAL_ERROR. 예외 내용은 싣지 않는 고정 문장이다(내용은 서버 로그에만)
      x-error-codes: [INTERNAL_ERROR]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
