          type: string
          format: decimal
          description: Goalkeeper share − target (positive = more than the target), 8 decimal places / 골키퍼 비중 − 목표(양수 = 목표보다 많음), 소수 8자리
        defenderGap:
          type: string
          format: decimal
          description: Defender share − target, 8 decimal places / 수비수 비중 − 목표, 소수 8자리
        midfielderGap:
          type: string
          format: decimal
          description: Midfielder share − target, 8 decimal places / 미드필더 비중 − 목표, 소수 8자리
        forwardGap:
          type: string
          format: decimal
          description: Attacker share − target, 8 decimal places / 공격수 비중 − 목표, 소수 8자리
        formationDeviation:
          type: string
          format: decimal
          description: Formation deviation = sum of |share − target| over the positions, 8 decimal places / 포메이션 이탈 = 포지션별 |비중 − 목표|의 합, 소수 8자리
    SeasonReportDto:
      type: object
      description: Season report / 시즌 성적표
      required: [seasonStatus, isFinal, reportTurns, pathLength, pendingOrders, pendingChanges, initialCash, finalValue, totalReturn, monthlyVolatility, maxDrawdown, baselineFinalValue, baselineReturn, excessReturn, riskLimit, riskBreachTurns, riskBreachDepth, maxSingleWeight, tradeNotional, turnoverAnnual, formationDeviation, roleFit, rolePlayersJudged, rolePlayersUnjudged, nudgeShare, nudgeSameTurnShare, totalFee, teamFee, formationChangeFee, platformNudgeFee, formationChanges, formationChangeOrders, changesWithoutOrders, reconMismatchRows, reconTurnBundles, reconManualBundles, reconOutOfRangeRows]
      properties:
        seasonStatus:
          $ref: '#/components/schemas/SeasonStatus'
          description: Season status (FINISHED, because only a finished season has a report) / 시즌 상태(끝난 시즌만 성적표를 내므로 FINISHED)
        isFinal:
          type: boolean
          description: |-
            Whether the report is final (true for a finished season; an interim report during play comes after the MVP)

            확정 여부(끝난 시즌이면 true, 진행 중 잠정 성적표는 MVP 이후)
        reportTurns:
          type: integer
          format: int32
          description: Number of reported turns = the last snapshot turn / 보고 턴 수 = 마지막 스냅샷 턴
        pathLength:
          type: integer
          format: int32
          description: Path length (number of turns) / 경로 길이(턴 수)
        pendingOrders:
          type: integer
          format: int32
          description: Pending orders of the reported turn (0 for a finished season) / 보고 턴의 보류 주문 수(끝난 시즌은 0)
        pendingChanges:
          type: integer
          format: int32
          description: Pending formation changes of the reported turn (0 for a finished season) / 보고 턴의 보류 전술 변경 수(끝난 시즌은 0)
        initialCash:
          type: string
          format: decimal
          description: Initial capital, whole KRW / 초기 자금, 원 단위 정수
        finalValue:
          type: string
          format: decimal
          description: Final total valuation, whole KRW / 최종 총 평가액, 원 단위 정수
        totalReturn:
          type: string
          format: decimal
          description: Total return = (final − initial) ÷ initial, 8 decimal places / 총 수익률 = (최종 − 초기) ÷ 초기, 소수 8자리
        monthlyVolatility:
          type: [string, null]
          format: decimal
          description: |-
            Monthly volatility = sample standard deviation of monthly returns (n − 1), not annualized, 8 decimal places. null for one turn

            월 변동성 = 월 수익률의 표본 표준편차(n − 1), 연율화하지 않음, 소수 8자리. 한 턴이면 null
        maxDrawdown:
          type: string
          format: decimal
          description: Maximum drawdown (0 or less), 8 decimal places / 최대 낙폭(0 이하), 소수 8자리
        baselineFinalValue:
          type: string
          format: decimal
          description: |-
            Final valuation of the benchmark (buy and hold of a proxy ETF for the market index), whole KRW

            기준선(시장 지수 대용 ETF 매수 후 보유)의 최종 평가액, 원 단위 정수
        baselineReturn:
          type: string
          format: decimal
          description: Benchmark return, 8 decimal places / 기준선 수익률, 소수 8자리
        excessReturn:
          type: string
          format: decimal
          description: |-
            Excess return = (final − benchmark final) ÷ initial, divided once — not the difference of two returns. 8 decimal places

            초과 수익률 = (최종 − 기준선 최종) ÷ 초기, 한 번 나눔 — 두 수익률의 차가 아니다. 소수 8자리
        riskLimit:
          type: string
          format: decimal
          description: Risk limit (0 or less), 8 decimal places / 위험 선언(0 이하), 소수 8자리
        riskBreachTurns:
          type: integer
          format: int32
          description: Number of turns where the drawdown crossed the risk limit / 낙폭이 위험 선언을 넘은 턴 수
        riskBreachDepth:
          type: string
          format: decimal
          description: Deepest excess beyond the risk limit (0 or less, 0 if never crossed), 8 decimal places / 위험 선언을 넘은 가장 깊은 정도(0 이하, 넘은 적 없으면 0), 소수 8자리
        maxSingleWeight:
          type: string
          format: decimal
          description: |-
            Maximum single-asset share = the maximum over turns of (largest asset value ÷ total valuation) (0 without holdings), 8 decimal places

            최대 단일 종목 비중 = 턴마다 (가장 큰 종목 가치 ÷ 총 평가액)의 최댓값(보유가 없으면 0), 소수 8자리
        tradeNotional:
          type: string
          format: decimal
          description: Total traded amount (fill price × quantity, turn-0 team setup excluded), whole KRW / 매매 대금 합(체결가 × 수량, 0턴 팀 구성 제외), 원 단위 정수
        turnoverAnnual:
          type: string
          format: decimal
          description: |-
            Annualized turnover = 12 × traded amount ÷ sum of per-turn total valuations, 8 decimal places

            연 환산 회전율 = 12 × 매매 대금 ÷ 턴별 총 평가액 합, 소수 8자리
        formationDeviation:
          type: string
          format: decimal
          description: |-
            Average formation deviation = exact average over turns of Σ|actual share − target share| (divided once by the common denominator), 8 decimal places

            포메이션 이탈 평균 = 턴마다 Σ|실제 비중 − 목표 비중|의 정확한 평균(공통 분모로 한 번 나눔), 소수 8자리
        roleFit:
          type: [string, null]
          format: decimal
          description: |-
            Role fit = the exposed value of players whose declared and measured season positions match ÷ the exposed value of measured players, 8 decimal places. null if there is no measured exposure.

            역할 수행 = 선언과 시즌 실측 포지션이 같은 선수의 노출 가치 ÷ 실측된 선수의 노출 가치, 소수 8자리. 실측된 노출이 없으면 null
        rolePlayersJudged:
          type: integer
          format: int32
          description: Number of exposed assets whose position was measured / 실측 포지션이 나온 노출 종목 수
        rolePlayersUnjudged:
          type: integer
          format: int32
          description: Number of exposed assets that could not be measured for lack of samples / 표본 부족으로 실측하지 못한 노출 종목 수
        nudgeShare:
          type: [string, null]
          format: decimal
          description: |-
            Encouragement share = traded amount from trades initiated through rankings, feed and alerts ÷ traded amount, 8 decimal places. null if the traded amount is 0.

            독려 비중 = 랭킹·피드·알림에서 시작된 매매 대금 ÷ 매매 대금, 소수 8자리. 매매 대금이 0이면 null
        nudgeSameTurnShare:
          type: [string, null]
          format: decimal
          description: |-
            Same-turn encouragement share = encouraged traded amount whose ranking or feed turn equals the order turn ÷ traded amount, 8 decimal places. null if the traded amount is 0

            같은 턴 독려 비중 = 랭킹 또는 피드 턴과 주문 턴이 같은 독려 매매 대금 ÷ 매매 대금, 소수 8자리. 매매 대금이 0이면 null
        totalFee:
          type: string
          format: decimal
          description: Total fees (turn-0 team setup included), whole KRW / 수수료 합(0턴 팀 구성 포함), 원 단위 정수
        teamFee:
          type: string
          format: decimal
          description: Turn-0 team setup fees (buys and sells), whole KRW / 0턴 팀 구성 수수료(매수·매도 모두), 원 단위 정수
        formationChangeFee:
          type: string
          format: decimal
          description: Total fees of fills linked to a formation change, whole KRW / 전술 변경에 연결된 체결의 수수료 합, 원 단위 정수
        platformNudgeFee:
          type: string
          format: decimal
          description: |-
            Encouragement portion of platform revenue = fees from trades initiated through rankings and alerts, whole KRW.

            플랫폼 수익 중 독려 몫 = 랭킹·알림에서 시작된 매매의 수수료, 원 단위 정수
        formationChanges:
          type: integer
          format: int32
          description: Number of formation changes (in the report range) / 전술 변경 수(보고 범위)
        formationChangeOrders:
          type: integer
          format: int32
          description: Number of orders linked to a formation change / 전술 변경에 연결된 주문 수
        changesWithoutOrders:
          type: integer
          format: int32
          description: Number of formation changes with no linked order / 연결된 주문이 없는 전술 변경 수
        reconMismatchRows:
          type: integer
          format: int32
          description: Number of recorded reconciliation mismatch rows (recovered attempts included) / 기록된 대사 불일치 행 수(복구된 시도 포함)
        reconTurnBundles:
          type: integer
          format: int32
          description: Number of turn-advance reconciliation bundles (17 rows per turn and attempt) / 턴 전환 대사 묶음 수(턴·시도마다 17행)
        reconManualBundles:
          type: integer
          format: int32
          description: Number of manual reconciliation bundles (15 rows per turn and attempt) / 수동 대사 묶음 수(턴·시도마다 15행)
        reconOutOfRangeRows:
          type: integer
          format: int32
          description: Number of reconciliation rows for turns beyond the path length / 경로 길이를 넘는 턴의 대사 행 수
    SeasonReviewDto:
      type: object
      description: |-
        Season review for a finished season. Month block number, event number, event key, reference date, member number and times are not included

        끝난 시즌의 복기. 월 블록 번호·사건 번호·사건 키·기준일·회원 번호·시각은 싣지 않는다
      required: [seasonStatus, pathLength, abandonedTurnNo, seed, engineVersion, dataSnapshotDate, turns, formationChanges]
      properties:
        seasonStatus:
          $ref: '#/components/schemas/SeasonStatus'
          description: Season status (FINISHED, because only a finished season has a season review) / 시즌 상태(끝난 시즌만 복기를 내므로 FINISHED)
        pathLength:
          type: integer
          format: int32
          description: Path length (number of turns) / 경로 길이(턴 수)
        abandonedTurnNo:
          type: [integer, 'null']
          format: int32
          description: The turn that was given up. null if the season was not given up / 포기한 턴. 포기하지 않았으면 null
        seed:
          type: string
          pattern: '^-?[0-9]{1,19}$'
          description: Path seed (decimal string of a 64-bit integer) / 경로 시드(64비트 정수의 10진 문자열)
        engineVersion:
          type: string
          description: Engine version that built the path / 경로를 만든 엔진 버전
        dataSnapshotDate:
          type: string
          format: date
          description: Data snapshot date (yyyy-MM-dd) / 데이터 스냅샷 날짜(yyyy-MM-dd)
        turns:
          type: array
          description: In turn-number order (1..path length) / 턴 번호 순서(1..경로 길이)
          items:
            $ref: '#/components/schemas/ReviewTurnDto'
        formationChanges:
          type: array
          description: Formation-change history (in change order). An empty list if there is none / 전술 변경 기록(변경 순서). 없으면 빈 목록
          items:
            $ref: '#/components/schemas/FormationChangeDto'
    ReviewTurnDto:
      type: object
      required: [turnNo, yearMonth, eventSummary, events]
      properties:
        turnNo:
          type: integer
          format: int32
          description: Turn number (from 1) / 턴 번호(1부터)
        yearMonth:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}$'
          description: The real year-month used in this turn (yyyy-MM) / 이 턴에 쓰인 실제 연월(yyyy-MM)
        eventSummary:
          type: [string, 'null']
          description: One-line summary of that month. null if there is none / 그 달의 한 줄 요약. 없으면 null
        events:
          type: array
          description: Event tags of that month (in event key order). An empty list if there are none / 그 달의 사건 태그(사건 키 순서). 없으면 빈 목록
          items:
            $ref: '#/components/schemas/ReviewEventDto'
    ReviewEventDto:
      type: object
      required: [category, eventType, phase, title, hindsight, source]
      properties:
        category:
          $ref: '#/components/schemas/EventCategory'
        eventType:
          type: string
          description: Event kind / 사건 유형
        phase:
          $ref: '#/components/schemas/EventPhase'
        title:
          type: string
          description: Real name / 실제 이름
        hindsight:
          type: [string, 'null']
          description: Name given later and hindsight assessment. null if there is none / 나중에 붙은 이름·사후 평가. 없으면 null
        source:
          type: string
          description: URL or bibliography / URL 또는 서지
    HoldingsDto:
      type: object
      description: |-
        Holdings of the current turn × that turn's prices (a live value that reflects this turn's trades immediately). In a turn without trades, the total, holdings valuation and valuation per position equal the turn result of that turn. currentFormation is the formation applied now. The sum of the four shares can differ from 1 by at most 2e-8. Seed, path, month block, year-month and return kind are not included.

        현재 턴의 보유 × 그 턴 가격(이번 턴의 매매가 바로 반영되는 실시간 값). 매매가 없는 턴이면 총액·보유 평가액·포지션별 평가액이 그 턴의 턴 결과와 같다. currentFormation 은 지금 적용 중인 포메이션이다. 비중 4개의 합은 1과 최대 2e-8 다를 수 있다. 시드·경로·월 블록·연월·수익률 종류는 싣지 않는다
      required: [seasonId, turnNo, cashBalance, holdingsValue, totalValue, goalkeeperValue, defenderValue,
                 midfielderValue, forwardValue, goalkeeperWeight, defenderWeight, midfielderWeight, forwardWeight,
                 currentFormation, goalkeeperGap, defenderGap, midfielderGap, forwardGap, formationDeviation, holdings]
      properties:
        seasonId:
          type: integer
          format: int64
          description: Season identifier / 시즌 식별자
        turnNo:
          type: integer
          format: int32
          description: The season's current turn (the turn the prices are based on) / 시즌의 현재 턴(가격 기준 턴)
        cashBalance:
          type: string
          format: decimal
          description: Cash balance (now), whole KRW / 현금 잔액(지금), 원 단위 정수
        holdingsValue:
          type: string
          format: decimal
          description: Holdings valuation = Σ quantity × current turn price, whole KRW / 보유 평가액 = Σ 수량 × 현재 턴 가격, 원 단위 정수
        totalValue:
          type: string
          format: decimal
          description: Total valuation = cash + holdings valuation, whole KRW / 총 평가액 = 현금 + 보유 평가액, 원 단위 정수
        goalkeeperValue:
          type: string
          format: decimal
          description: Goalkeeper valuation (cash included, total − the other three), whole KRW / 골키퍼 평가액(현금 포함, 총액 − 나머지 셋), 원 단위 정수
        defenderValue:
          type: string
          format: decimal
          description: Defender valuation, whole KRW / 수비수 평가액, 원 단위 정수
        midfielderValue:
          type: string
          format: decimal
          description: Midfielder valuation, whole KRW / 미드필더 평가액, 원 단위 정수
        forwardValue:
          type: string
          format: decimal
          description: Attacker valuation, whole KRW / 공격수 평가액, 원 단위 정수
        goalkeeperWeight:
          type: string
          format: decimal
          description: Goalkeeper share = valuation ÷ total valuation, 8 decimal places / 골키퍼 비중 = 평가액 ÷ 총 평가액, 소수 8자리
        defenderWeight:
          type: string
          format: decimal
          description: Defender share, 8 decimal places / 수비수 비중, 소수 8자리
        midfielderWeight:
          type: string
          format: decimal
          description: Midfielder share, 8 decimal places / 미드필더 비중, 소수 8자리
        forwardWeight:
          type: string
          format: decimal
          description: Attacker share, 8 decimal places / 공격수 비중, 소수 8자리
        currentFormation:
          $ref: '#/components/schemas/FormationDto'
        goalkeeperGap:
          type: string
          format: decimal
          description: Goalkeeper share − current formation (positive = more than the target), 8 decimal places / 골키퍼 비중 − 현재 포메이션(양수 = 목표보다 많음), 소수 8자리
        defenderGap:
          type: string
          format: decimal
          description: Defender share − current formation, 8 decimal places / 수비수 비중 − 현재 포메이션, 소수 8자리
        midfielderGap:
          type: string
          format: decimal
          description: Midfielder share − current formation, 8 decimal places / 미드필더 비중 − 현재 포메이션, 소수 8자리
        forwardGap:
          type: string
          format: decimal
          description: Attacker share − current formation, 8 decimal places / 공격수 비중 − 현재 포메이션, 소수 8자리
        formationDeviation:
          type: string
          format: decimal
          description: |-
            Formation deviation = sum of |share − current formation| over the positions, 8 decimal places

            포메이션 이탈 = 포지션별 |비중 − 현재 포메이션|의 합, 소수 8자리
        holdings:
          type: array
          description: Holdings with quantity 1 or more (ascending asset number) / 수량 1 이상인 보유(종목 번호 오름차순)
          items:
            $ref: '#/components/schemas/HoldingDto'
    HoldingDto:
      type: object
      description: |-
        One held asset. The asset name is not included — link it by assetId from the pool response

        보유 한 종목. 종목 이름은 싣지 않는다 — 풀 응답의 assetId 로 잇는다
      required: [assetId, quantity, avgPrice, declaredPosition, price, value, weight]
      properties:
        assetId:
          type: integer
          format: int64
          description: Asset identifier (the same as assetId in the pool response) / 종목 식별자(풀 응답의 assetId 와 같다)
        quantity:
          type: integer
          format: int32
          description: Quantity held (1 or more) / 보유 수량(1 이상)
        avgPrice:
          type: string
          format: decimal
          description: Average cost (fee excluded), 4 decimal places / 평균단가(수수료 제외), 소수 4자리
        declaredPosition:
          $ref: '#/components/schemas/Position'
          description: Declared position of the open span / 열린 구간의 선언 포지션
        price:
          type: string
          format: decimal
          description: Current turn price, whole KRW / 현재 턴 가격, 원 단위 정수
        value:
          type: string
          format: decimal
          description: Valuation = quantity × current turn price, whole KRW / 평가액 = 수량 × 현재 턴 가격, 원 단위 정수
        weight:
          type: string
          format: decimal
          description: Asset share = valuation ÷ total valuation (cash included), 8 decimal places / 종목 비중 = 평가액 ÷ 총 평가액(현금 포함), 소수 8자리
    OrderSide:
      type: string
      enum: [BUY, SELL]
    SeasonStatus:
      type: string
      enum: [IN_PROGRESS, ABANDONING, FINISHED]
    EventCategory:
      type: string
      enum: [GEOPOLITICS, TRADE, POLITICS, SUPPLY_SHOCK, FINANCIAL, POLICY, HEALTH]
    EventPhase:
      type: string
      enum: [START, ONGOING, END]
    Market:
      type: string
      enum: [KR, US]
    AssetType:
      type: string
      enum: [STOCK, ETF]
    ReturnBasis:
      type: string
      enum: [PRICE, TOTAL]
    AssetGroupKind:
      type: string
      enum: [SECTOR, ASSET_CLASS]
    Position:
      type: string
      enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD_TARGET, FORWARD_BREAKOUT, FORWARD_DEFENSIVE]
    Problem:
      type: object
      description: RFC 9457 problem details + a top-level code. type is omitted because it is about:blank / RFC 9457 문제 상세 + 최상위 code. type은 about:blank라 생략된다
      required: [title, status, detail, instance, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
          description: Fixed Korean sentence. It never carries the rejected value or amount / 고정 한국어 문장. 거부된 값·금액을 싣지 않는다
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          description: Only for @Valid violations / @Valid 위반일 때만
          items:
            $ref: '#/components/schemas/FieldViolation'
    FieldViolation:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
          description: Simple name of the constraint annotation (for example Min) / 제약 애너테이션 단순 이름(예 Min)
    ErrorCode:
      type: string
      enum: [INVALID_ARGUMENT, NOT_FOUND, METHOD_NOT_ALLOWED, NOT_ACCEPTABLE,
             UNSUPPORTED_MEDIA_TYPE, INTERNAL_ERROR, POOL_NOT_LOADED, POOL_NOT_JUDGED, PATH_TOO_LONG,
             SEASON_LIMIT, TURN_NOT_REACHED, SEASON_NOT_FINISHED, SEASON_NOT_ACTIVE, TURN_MISMATCH, LEDGER_MISMATCH,
             LINEUP_MISMATCH, ASSET_NOT_IN_POOL, INSUFFICIENT_CASH, INSUFFICIENT_HOLDING, POSITION_CONFLICT, POSITION_REQUIRED,
             INVALID_FORMATION, EVENT_TIME_CONFLICT, MEMBER_UNAVAILABLE, RECONCILIATION_FAILED, FORBIDDEN, EMAIL_TAKEN,
             UNAUTHENTICATED, INVALID_CREDENTIALS]
