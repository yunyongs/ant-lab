  /api/v1/seasons/{seasonId}/turns:
    post:
      tags: [turn]
      operationId: advanceTurn
      summary: Advance the turn (next month) / 턴 전환(다음 달)
      description: |-
        Applies the next month block. In one transaction it builds the next-turn prices of the whole pool and the turn snapshot; if all 17 reconciliation checks match, it records them and advances the current turn. After the last turn the season ends. If any check mismatches, only the reconciliation log is kept and the answer is 409.

        다음 달 블록을 적용한다. 한 트랜잭션에서 풀 전체의 다음 턴 가격과 턴 스냅샷을 만들고 대사 17개가 모두 일치하면 기록하고 현재 턴을 올린다. 마지막 턴이면 시즌이 끝난다. 대사가 하나라도 어긋나면 대사 기록만 남기고 409다.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceTurnRequest'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Turn result / 턴 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResultDto'
        '400':
          description: The input is invalid — INVALID_ARGUMENT / 입력이 틀렸다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The season does not exist — NOT_FOUND / 시즌이 없다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
