  /api/v1/seasons/{seasonId}/turns/{turnNo}:
    get:
      tags: [turn]
      operationId: getTurn
      summary: Turn result lookup / 턴 결과 조회
      description: |-
        Returns the result of one turn (valuation, change, cash, cumulative drawdown, comparison with the risk limit, valuation and share per position, formation deviation). It has the same shape as the advance-turn response. status and pathLength are the season's values now, and the sum of the four shares can differ from 1 by at most 2e-8. It is the same for a season in progress and a finished one.

        한 턴의 결과(평가액·변화·현금·누적 낙폭·위험 선언 대비·포지션별 평가액과 비중·포메이션 차이)를 준다. 턴 전환 응답과 같은 형이다. status·pathLength 는 시즌의 지금 값이고, 비중 4개의 합은 1과 최대 2e-8 다를 수 있다. 진행 중이든 끝난 시즌이든 같다.
      parameters:
        - name: seasonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: turnNo
          in: path
