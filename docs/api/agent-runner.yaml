        Advances the season through the same path as the human turn advance (prices, snapshot, reconciliation), but only when the current turn has a final decision (any outcome, including NO_RESPONSE, which means no trades that turn). Without one the answer is DECISION_MISSING and nothing changes.

        사람의 턴 전환과 같은 경로(가격·스냅샷·대사)로 시즌을 넘기되, 현재 턴에 최종 결정이 있을 때만 한다(NO_RESPONSE 도 결정이며 그 턴은 거래가 없다). 없으면 DECISION_MISSING 이고 아무것도 바뀌지 않는다.
