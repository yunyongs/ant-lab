  /internal/agent-runner/v1/agents/{agentId}/memory/comparison:
    get:
      tags: [agent]
      operationId: getMemoryComparison
      summary: Compare two memory versions on the same seeds / 같은 시드에서 두 메모리 버전 비교
      description: |-
        Compares memory version A with version B of the agent (0 = no memory). One row per closed same-seed group in which the agent has a finished season with each version: per side the pinned version, the valuation multiple, the stored season score with its nine items and the number of failed turns, plus whether the agent met the seed in a season outside the group. A group is closed only when every league of it is closed. Abandoned seasons are left out. With the same version on both sides the first two seasons of that version in the group are compared. Groups are named G1, G2, ... in creation order; no seed, date, month block or league number is shown. Under 5 groups the summary is marked anecdotal; the mean differences are B minus A. Only the agent's own record is read.

        에이전트의 메모리 버전 A와 B를 비교한다(0 = 메모리 없음). 닫힌 같은 시드 묶음마다 한 줄, 에이전트가 두 버전 각각으로 끝낸 시즌이 있는 묶음만 넣는다. 각 쪽에 고정한 버전, 평가 배수, 저장된 시즌 점수와 아홉 항목, 실패한 턴 수, 그리고 에이전트가 묶음 밖 시즌에서 그 시드를 만난 적이 있는지를 준다. 묶음은 모든 리그가 닫혀야 닫힌 것이다. 포기한 시즌은 뺀다. 양쪽 버전이 같으면 묶음 안에서 그 버전의 첫 두 시즌을 비교한다. 묶음은 만든 순서로 G1, G2, ... 라 부르며 시드·날짜·달 블록·리그 번호는 보이지 않는다. 묶음이 5개 미만이면 요약에 anecdotal 표시가 붙고, 평균 차이는 B 빼기 A다. 에이전트 본인의 기록만 읽는다.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - name: versionA
          in: query
          required: true
          description: Memory version A, 0 for no memory / 메모리 버전 A, 0은 메모리 없음
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: versionB
          in: query
          required: true
          description: Memory version B, 0 for no memory / 메모리 버전 B, 0은 메모리 없음
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        '200':
          description: The comparison, with no row when no group qualifies / 비교, 맞는 묶음이 없으면 줄이 없다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryComparisonDto'
        '400':
          description: A number is missing, not a number or below 0 — INVALID_ARGUMENT / 번호가 없거나 숫자가 아니거나 0 미만이다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The agent does not exist or is not this owner's, or it has no such version. One answer for all — NOT_FOUND / 에이전트가 없거나 이 소유자의 것이 아니거나 그 버전이 없다. 모두 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/agent-runner/v1/agents/{agentId}/memory/{version}:
    get:
