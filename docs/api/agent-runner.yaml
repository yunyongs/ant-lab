          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResultDto'
        '400':
          description: The turn number is not a number or below 0 — INVALID_ARGUMENT / 턴 번호가 숫자가 아니거나 0 미만이다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
