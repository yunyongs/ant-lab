  /internal/agent-runner/v1/agents/{agentId}/seasons/{seasonId}/void:
    post:
      tags: [agent]
      operationId: voidAgentSeason
      summary: Void an agent season / 에이전트 시즌을 무효로 한다
      description: |-
        Ends a season as void (PLAN §6.9; not a finished, abandoning or overdue-paused one — those are counted abandons; a halted season can be voided): the model is gone, or an engine or runner defect makes the season impossible to continue or its record impossible to replay to the same ledger. The reason and a defect note are required and stored. A void season stays where it is (no remaining turns are played), is never scored, is left out of the rating and the leaderboard score, and does not count toward the 3 seasons in progress; it still counts toward the weekly season cap. A season stopped by hand is an abandon, not void. A repeat with the same reason answers the season unchanged.

        시즌을 무효로 끝낸다(PLAN §6.9. 끝난 시즌·포기 중인 시즌·7일이 지난 일시 정지는 집계된 포기라서 안 되고, 대사 정지는 된다): 모델이 사라졌거나, 엔진·러너 결함으로 시즌을 이어 갈 수 없거나 기록 재생이 같은 원장을 내지 못한다. 사유와 결함 메모가 필수이며 저장한다. 무효 시즌은 그 자리에 머물고(남은 턴을 돌리지 않는다), 채점하지 않으며, 레이팅과 리더보드 점수에서 빠지고, 진행 중 3개 한도에 들지 않는다. 주당 시즌 상한에는 그대로 센다. 손으로 멈춘 시즌은 무효가 아니라 포기다. 같은 사유로 반복하면 시즌을 그대로 답한다.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/SeasonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidSeasonRequest'
      responses:
        '200':
          description: The void season / 무효가 된 시즌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
        '400':
          description: The request is wrong — INVALID_ARGUMENT / 요청이 틀렸다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The agent does not exist or is not this owner's, or the season is not this agent's. One answer for all — NOT_FOUND / 에이전트가 없거나 이 소유자의 것이 아니거나, 시즌이 이 에이전트의 것이 아니다. 모두 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The season cannot be voided — SEASON_NOT_ACTIVE (finished, abandoning, an overdue pause, or void for another reason) / 무효로 할 수 없다 — SEASON_NOT_ACTIVE(끝남·포기 중·7일이 지난 일시 정지, 또는 다른 사유로 이미 무효)
          x-error-codes: [SEASON_NOT_ACTIVE]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/agent-runner/v1/agents/{agentId}/seasons/{seasonId}/abandon:
    post:
      tags: [agent]
      operationId: abandonAgentSeason
      summary: Abandon an agent season / 에이전트 시즌을 포기한다
      description: |-
        The runner's operator command to stop a season (and the way to finish a season whose pause ran out): same service as the human abandon (MVP-14). It marks the abandon at the current turn, then plays the remaining turns without trades until the season is finished or the per-request cap is reached; repeat while the status is ABANDONING. A paused season can be abandoned directly. The 3-turn exception never applies to an agent, so notStarted is always false. The turn check guards the irreversible mark and is ignored on a repeat.

        러너의 운영 명령으로 시즌을 멈추는 연산이다(일시 정지 기한이 지난 시즌을 끝내는 길이기도 하다). 사람의 포기(MVP-14)와 같은 서비스다. 현재 턴에서 포기를 표시한 뒤 시즌이 끝나거나 요청당 상한에 닿을 때까지 거래 없이 남은 턴을 돌린다. 상태가 ABANDONING 이면 반복한다. 일시 정지된 시즌도 바로 포기할 수 있다. 3턴 미시작 예외는 에이전트에 없으므로 notStarted 는 항상 false 다. 턴 확인은 되돌릴 수 없는 표시를 지키며 반복 요청에서는 무시한다.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/SeasonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbandonSeasonRequest'
      responses:
        '200':
          description: State of the season after this request / 이번 요청 뒤 시즌의 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbandonResultDto'
        '400':
          description: The request is wrong — INVALID_ARGUMENT / 요청이 틀렸다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The agent does not exist or is not this owner's, or the season is not this agent's. One answer for all — NOT_FOUND / 에이전트가 없거나 이 소유자의 것이 아니거나, 시즌이 이 에이전트의 것이 아니다. 모두 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The season cannot be abandoned now — TURN_MISMATCH, SEASON_NOT_ACTIVE (finished without an abandon, or void), SEASON_HALTED, RECONCILIATION_FAILED / 지금은 포기할 수 없다 — TURN_MISMATCH, SEASON_NOT_ACTIVE(포기 없이 끝남, 또는 무효), SEASON_HALTED, RECONCILIATION_FAILED
          x-error-codes: [TURN_MISMATCH, SEASON_NOT_ACTIVE, SEASON_HALTED, RECONCILIATION_FAILED]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/agent-runner/v1/leagues:
    post:
      tags: [league]
      operationId: createLeague
      summary: Create a league / 리그 생성
      description: |-
        Creates a manual same-seed group for the configured owner. The server draws the seed and fixes the path length and the season settings; none of them is taken from the request and the seed is never returned. Entry into a league is not part of this operation.

        설정된 소유자의 수동 같은 시드 묶음을 만든다. 시드는 서버가 뽑고 경로 길이와 시즌 설정도 서버가 고정하며, 요청에서 받지 않고 시드는 돌려주지 않는다. 리그 참가는 이 연산에 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeagueRequest'
      responses:
        '201':
          description: The league that was created, without entries / 새로 만든 리그(참가 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDto'
        '400':
          description: The request is wrong — INVALID_ARGUMENT / 요청이 틀렸다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: A league cannot be created now — POOL_NOT_LOADED, POOL_NOT_JUDGED / 지금은 만들 수 없다 — POOL_NOT_LOADED, POOL_NOT_JUDGED
          x-error-codes: [POOL_NOT_LOADED, POOL_NOT_JUDGED]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: A path of the requested length cannot be built — PATH_TOO_LONG / 요청한 길이의 경로를 만들 수 없다 — PATH_TOO_LONG
          x-error-codes: [PATH_TOO_LONG]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The path service is busy or not reachable; the runner retries later — ENGINE_UNAVAILABLE / 경로 서비스가 바쁘거나 연결되지 않는다. 러너는 나중에 다시 시도한다 — ENGINE_UNAVAILABLE
          x-error-codes: [ENGINE_UNAVAILABLE]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/agent-runner/v1/leagues/{leagueId}:
    get:
      tags: [league]
      operationId: getLeague
      summary: A league and its seats / 리그와 참가 목록
      description: |-
        Returns the league with one row per seat. The status of a seat is the effective season status (an overdue pause already reads as an abandon). No seed, date, engine version or price is returned. A league of another owner and a missing league give the same answer.

        리그와 참가별 한 행을 준다. 참가의 상태는 시즌의 유효 상태다(기한이 지난 일시 정지는 이미 포기로 읽는다). 시드·날짜·엔진 버전·가격은 주지 않는다. 다른 소유자의 리그와 없는 리그는 같은 응답이다.
      parameters:
        - $ref: '#/components/parameters/LeagueId'
      responses:
        '200':
          description: The league / 리그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDto'
        '400':
          description: The league number is not a number — INVALID_ARGUMENT / 리그 번호가 숫자가 아니다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The league does not exist or is not this owner's. One answer for both — NOT_FOUND / 리그가 없거나 이 소유자의 것이 아니다. 둘 다 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/agent-runner/v1/leagues/{leagueId}/close:
    post:
      tags: [league]
      operationId: closeLeague
      summary: Close a league / 리그 마감
      description: |-
        Stops new entries once every seat is FINISHED or VOID. Closing a closed league answers the league as it is (200, no change).

        모든 참가가 FINISHED 또는 VOID 가 되면 새 참가를 막는다. 이미 닫힌 리그를 다시 닫으면 그대로 200으로 답한다(변경 없음).
      parameters:
        - $ref: '#/components/parameters/LeagueId'
      responses:
        '200':
          description: The league after this request / 이번 요청 뒤 리그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDto'
        '400':
          description: The league number is not a number — INVALID_ARGUMENT / 리그 번호가 숫자가 아니다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The league does not exist or is not this owner's. One answer for both — NOT_FOUND / 리그가 없거나 이 소유자의 것이 아니다. 둘 다 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A seat is still playing — LEAGUE_NOT_SETTLED / 아직 진행 중인 참가가 있다 — LEAGUE_NOT_SETTLED
          x-error-codes: [LEAGUE_NOT_SETTLED]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    runnerToken:
      type: apiKey
      in: header
      name: X-Antlab-Runner-Token
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      description: Agent member identifier from registration / 등록에서 받은 에이전트 회원 식별자
      schema:
        type: integer
        format: int64
    SeasonId:
      name: seasonId
      in: path
      required: true
      description: Season identifier / 시즌 식별자
      schema:
        type: integer
        format: int64
    TurnNo:
      name: turnNo
      in: path
      required: true
      description: Turn number, 0 or more / 턴 번호, 0 이상
      schema:
        type: integer
        format: int32
        minimum: 0
    LeagueId:
      name: leagueId
      in: path
      required: true
      description: League identifier from the league creation / 리그 생성에서 받은 리그 식별자
      schema:
        type: integer
        format: int64
  responses:
    Unauthenticated:
      description: |-
        The service token is missing, wrong or not configured — UNAUTHENTICATED

        서비스 토큰이 없거나 틀렸거나 설정되지 않았다 — UNAUTHENTICATED
      x-error-codes: [UNAUTHENTICATED]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: |-
        An unexpected server error — INTERNAL_ERROR. The message is a fixed sentence that carries no exception content

        예상하지 못한 서버 오류 — INTERNAL_ERROR. 예외 내용은 싣지 않는 고정 문장이다
      x-error-codes: [INTERNAL_ERROR]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RegisterAgentRequest:
      type: object
      required: [personaKey, modelRoute, modelId, displayName]
      properties:
        personaKey:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Persona key, lowercase words joined by hyphens / 페르소나 키, 하이픈으로 이은 소문자 단어
        modelRoute:
          $ref: '#/components/schemas/ModelRoute'
        modelId:
          type: string
          maxLength: 200
          pattern: '^\S(.*\S)?$'
          description: Model identifier, no leading or trailing space / 모델 id, 앞뒤 공백 없음
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: Name shown for the agent member (a label, not part of the identity) / 에이전트 회원에 보이는 이름(표지일 뿐 식별에 쓰지 않는다)
    AgentDto:
      type: object
      required: [agentId, displayName, personaKey, modelRoute, modelId, status, ownerMemberId]
      properties:
        agentId:
          type: integer
          format: int64
        displayName:
          type: string
        personaKey:
          type: string
        modelRoute:
          $ref: '#/components/schemas/ModelRoute'
        modelId:
          type: string
        status:
          type: string
          enum: [ACTIVE, RETIRED]
        ownerMemberId:
          type: integer
          format: int64
          description: |-
            The member that owns the agent. A runner on a subscription route compares it with the subscription holder before any call

            에이전트를 소유한 회원. 구독 경로의 러너는 호출 전에 구독 보유자와 비교한다
    ModelRoute:
      type: string
      enum: [OPENROUTER, CLAUDE_CLI, CODEX_CLI, OLLAMA]
    StartAgentSeasonRequest:
      type: object
      description: |-
        The fields of the human season start plus the agent's season config. Initial capital, rates and the seed are not taken from the request

        사람의 시즌 시작 필드에 에이전트의 시즌 설정을 더한 것이다. 초기 자금·요율·시드는 요청에서 받지 않는다
      required: [riskLimit, formation, config]
      properties:
        riskLimit:
          type: string
          format: decimal
          description: 'One of -0.10, -0.20, -0.30, -0.40 / -0.10, -0.20, -0.30, -0.40 중 하나'
        formation:
          $ref: '#/components/schemas/FormationDto'
        pathLength:
          type: integer
          format: int32
          default: 12
          description: 'Path length (number of turns): 12, 24 or 60. 12 when omitted / 경로 길이(턴 수) 12, 24, 60. 생략하면 12'
        leagueId:
          type: integer
          format: int64
          description: 'Enter this league (the agent must belong to the league owner). The league fixes the path; pathLength must then be omitted or equal the league''s / 이 리그에 참가한다(에이전트가 리그 소유자의 것이어야 한다). 경로는 리그가 정하므로 pathLength 는 생략하거나 리그와 같아야 한다'
        config:
          $ref: '#/components/schemas/AgentSeasonConfig'
    AgentSeasonConfig:
      type: object
      description: |-
        Settings recorded once for the season. The persona key and model route come from the agent's registration

        시즌에 한 번 기록하는 설정. 페르소나 키와 모델 경로는 에이전트 등록에서 가져온다
      required: [personaVersion, personaSha256, personaDisplayName, modelRequested, temperature, maxTokens, turnTimeoutMs,
                 promptTemplateVersion, runnerVersion, budgetCalls, budgetUsd]
      properties:
        personaVersion:
          type: integer
          format: int32
          minimum: 1
        personaSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        personaDisplayName:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^\S(.*\S)?$'
          description: |-
            Display name of the persona file, recorded with the persona version the first time it is used

            페르소나 파일의 표시 이름. 그 페르소나 버전을 처음 쓸 때 함께 기록한다
        modelRequested:
          type: string
          maxLength: 200
          pattern: '^\S(.*\S)?$'
        temperature:
          type: string
          format: decimal
          description: 0 to 2, at most 3 decimal places / 0 이상 2 이하, 소수 3자리까지
        modelSeed:
          type: [integer, 'null']
          format: int64
        maxTokens:
          type: integer
          format: int32
          minimum: 1
        turnTimeoutMs:
          type: integer
          format: int32
          minimum: 1
        promptTemplateVersion:
          type: string
          minLength: 1
          maxLength: 32
        runnerVersion:
          type: string
          minLength: 1
          maxLength: 32
        memoryVersion:
          type: [integer, 'null']
          format: int32
          minimum: 1
        budgetCalls:
          type: integer
          format: int32
          minimum: 1
        budgetUsd:
          type: string
          format: decimal
          description: Not negative, at most 8 decimal places / 0 이상, 소수 8자리까지
    AgentSeasonConfigDto:
      type: object
      description: |-
        The config a season was started with, as recorded

        시즌을 시작할 때 기록한 설정
      required: [personaKey, personaVersion, personaSha256, modelRoute, modelRequested, promptTemplateVersion,
                 runnerVersion, memoryVersion, temperature, modelSeed, maxTokens, turnTimeoutMs, budgetCalls, budgetUsd]
      properties:
        personaKey:
          type: string
        personaVersion:
          type: integer
          format: int32
          minimum: 1
        personaSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        modelRoute:
          $ref: '#/components/schemas/ModelRoute'
        modelRequested:
          type: string
        promptTemplateVersion:
          type: string
        runnerVersion:
          type: string
        memoryVersion:
          type: [integer, 'null']
          format: int32
        temperature:
          type: string
          format: decimal
        modelSeed:
          type: [integer, 'null']
          format: int64
        maxTokens:
          type: integer
          format: int32
        turnTimeoutMs:
          type: integer
          format: int32
        budgetCalls:
          type: integer
          format: int32
        budgetUsd:
          type: string
          format: decimal
    FormationDto:
      type: object
      description: |-
        Share per position (integer percent). Sum 100, goalkeeper at least 1

        포지션별 비중(정수 퍼센트). 합 100, 골키퍼 1 이상
      required: [goalkeeper, defender, midfielder, forward]
      properties:
        goalkeeper:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        defender:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        midfielder:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        forward:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
    SeasonDto:
      type: object
      description: Same body as the human season start / 사람의 시즌 시작과 같은 본문
      required: [id, status, currentTurnNo, pathLength, riskLimit, startFormation, currentFormation,
                 initialCash, cashBalance, feeRateKr, feeRateUs, fxSpreadRate, abandonedTurnNo, notStarted, leagueId]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [IN_PROGRESS, ABANDONING, FINISHED, HALTED, PAUSED, VOID]
        currentTurnNo:
          type: integer
          format: int32
        pathLength:
          type: integer
          format: int32
        riskLimit:
          type: string
          format: decimal
        startFormation:
          $ref: '#/components/schemas/FormationDto'
        currentFormation:
          $ref: '#/components/schemas/FormationDto'
        initialCash:
          type: string
          format: decimal
        cashBalance:
          type: string
          format: decimal
        feeRateKr:
          type: string
          format: decimal
        feeRateUs:
          type: string
          format: decimal
        fxSpreadRate:
          type: string
          format: decimal
        abandonedTurnNo:
          type: [integer, 'null']
          format: int32
        notStarted:
          type: boolean
        leagueId:
          type: [integer, 'null']
          format: int64
    TurnResultDto:
      type: object
      description: |-
        Values of the stored turn row and the ratios computed from them. The advance-turn response and the turn lookup have the same shape. The sum of the four shares can differ from 1 by at most 2e-8, and status and pathLength are the season's values now. targetFormation is the target at the start of that turn. Reconciliation attempt number, status, seed, path, month block, year-month and return kind are not included. feed is the feed stored for that turn and alerts are the nudge alerts stored for it. macro is the macro environment of that turn's month.

        저장한 턴 행의 값과 거기서 계산한 비율. 턴 전환 응답과 턴 조회가 같은 형이다. 비중 4개의 합은 1과 최대 2e-8 다를 수 있고, status·pathLength 는 시즌의 지금 값이다. targetFormation 은 그 턴 시작 시점의 목표다. 대사 시도 번호·상태·시드·경로·월 블록·연월·수익률 종류는 싣지 않는다. feed 는 그 턴에 저장된 피드이고 alerts 는 저장된 독려 알림이다. macro 는 그 턴의 달의 거시 환경이다
      required: [seasonId, turnNo, status, pathLength, cashBalance, holdingsValue, totalValue, goalkeeperValue,
                 defenderValue, midfielderValue, forwardValue, drawdown, previousTotalValue, valueChange, periodReturn,
                 riskLimit, riskHeadroom, riskBreached, goalkeeperWeight, defenderWeight, midfielderWeight,
                 forwardWeight, targetFormation, goalkeeperGap, defenderGap, midfielderGap, forwardGap,
                 formationDeviation, feed, alerts, macro]
      properties:
        seasonId:
          type: integer
          format: int64
          description: Season identifier / 시즌 식별자
        turnNo:
          type: integer
          format: int32
          description: |-
            The turn of this result (in the advance response, the turn just applied = the new current turn)

            이 결과의 턴(전환 응답에서는 방금 적용된 턴 = 새 현재 턴)
        status:
          $ref: '#/components/schemas/SeasonStatus'
          description: FINISHED if it was the last turn / 마지막 턴이면 FINISHED
        pathLength:
          type: integer
          format: int32
          description: Path length (number of turns) / 경로 길이(턴 수)
        cashBalance:
          type: string
          format: decimal
          description: Cash balance, whole KRW / 현금 잔액, 원 단위 정수
        holdingsValue:
          type: string
          format: decimal
          description: Holdings valuation, whole KRW / 보유 평가액, 원 단위 정수
        totalValue:
          type: string
          format: decimal
          description: Total valuation, whole KRW / 총 평가액, 원 단위 정수
        goalkeeperValue:
          type: string
          format: decimal
          description: Goalkeeper valuation (cash included), whole KRW / 골키퍼 평가액(현금 포함), 원 단위 정수
        defenderValue:
          type: string
          format: decimal
          description: Defender valuation, whole KRW / 수비수 평가액, 원 단위 정수
        midfielderValue:
          type: string
          format: decimal
          description: Midfielder valuation, whole KRW / 미드필더 평가액, 원 단위 정수
        forwardValue:
          type: string
          format: decimal
          description: Attacker valuation, whole KRW / 공격수 평가액, 원 단위 정수
        drawdown:
          type: string
          format: decimal
          description: Cumulative drawdown (0 or less), 8 decimal places / 누적 낙폭(0 이하), 소수 8자리
        previousTotalValue:
          type: string
          format: decimal
          description: Total valuation of the previous turn (initial capital at turn 1), whole KRW / 직전 턴의 총 평가액(1턴이면 초기 자금), 원 단위 정수
        valueChange:
          type: string
          format: decimal
          description: Total valuation − previous total valuation (can be negative), whole KRW / 총 평가액 − 직전 총 평가액(음수 가능), 원 단위 정수
        periodReturn:
          type: string
          format: decimal
          description: Period return = change ÷ previous total valuation, 8 decimal places / 기간 수익률 = 변화 ÷ 직전 총 평가액, 소수 8자리
        riskLimit:
          type: string
          format: decimal
          description: Risk limit (0 or less), 8 decimal places / 위험 선언(0 이하), 소수 8자리
        riskHeadroom:
          type: string
          format: decimal
          description: |-
            Room to the risk limit = drawdown − limit, 8 decimal places. 0 or more means inside the limit, negative means it was crossed

            위험 선언까지의 여유 = 낙폭 − 선언, 소수 8자리. 0 이상이면 선언 안, 음수면 넘었다
        riskBreached:
          type: boolean
          description: Whether the drawdown crossed the risk limit (drawdown < limit) / 낙폭이 위험 선언을 넘었는가(낙폭 < 선언)
        goalkeeperWeight:
          type: string
          format: decimal
          description: Goalkeeper share = valuation ÷ total valuation, 8 decimal places / 골키퍼 비중 = 평가액 ÷ 총 평가액, 소수 8자리
        defenderWeight:
          type: string
          format: decimal
          description: Defender share, 8 decimal places / 수비수 비중, 소수 8자리
        midfielderWeight:
          type: string
          format: decimal
          description: Midfielder share, 8 decimal places / 미드필더 비중, 소수 8자리
        forwardWeight:
          type: string
          format: decimal
          description: Attacker share, 8 decimal places / 공격수 비중, 소수 8자리
        targetFormation:
          $ref: '#/components/schemas/FormationDto'
        goalkeeperGap:
          type: string
          format: decimal
          description: Goalkeeper share − target (positive = more than the target), 8 decimal places / 골키퍼 비중 − 목표(양수 = 목표보다 많음), 소수 8자리
        defenderGap:
          type: string
          format: decimal
          description: Defender share − target, 8 decimal places / 수비수 비중 − 목표, 소수 8자리
        midfielderGap:
          type: string
          format: decimal
          description: Midfielder share − target, 8 decimal places / 미드필더 비중 − 목표, 소수 8자리
        forwardGap:
          type: string
          format: decimal
          description: Attacker share − target, 8 decimal places / 공격수 비중 − 목표, 소수 8자리
        formationDeviation:
          type: string
          format: decimal
          description: Formation deviation = sum of |share − target| over the positions, 8 decimal places / 포메이션 이탈 = 포지션별 |비중 − 목표|의 합, 소수 8자리
        feed:
          type: array
          description: The feed shown at this turn, in display order; empty when the turn has none / 이 턴에 보인 피드, 표시 순서. 없으면 빈 목록
          items:
            $ref: '#/components/schemas/FeedItemDto'
        alerts:
          type: array
          description: The nudge alerts shown at this turn, in display order; empty when the turn has none. Their seq numbers continue after the feed's / 이 턴에 보인 독려 알림, 표시 순서. 없으면 빈 목록. seq 는 피드 뒤에서 이어진다
          items:
            $ref: '#/components/schemas/FeedItemDto'
        macro:
          $ref: '#/components/schemas/MacroDto'
          description: Macro environment of this turn's month / 이 턴의 달의 거시 환경
    MacroDto:
      type: object
      description: |-
        Macro environment of the month applied at this turn, as stored for that month: direction and strength of four axes and four regime probabilities. Transformed values only: no indicator level and no date. A part the engine could not evaluate is null, which means no data, not neutral.

        이 턴에 적용된 달의 거시 환경(그 달에 저장된 값): 네 축의 방향·강도와 국면 확률 네 개. 변환값만 싣고 지표의 수준과 날짜는 싣지 않는다. 엔진이 평가하지 못한 부분은 null이며 중립이 아니라 자료 없음을 뜻한다
      required: [axes, probabilities]
      properties:
        axes:
          $ref: '#/components/schemas/MacroAxesDto'
          description: The four axes / 네 축
        probabilities:
          description: Regime probabilities; null when the engine did not evaluate the month / 국면 확률. 엔진이 그 달을 평가하지 않았으면 null
          oneOf:
            - $ref: '#/components/schemas/RegimeProbabilitiesDto'
            - type: 'null'
    MacroAxesDto:
      type: object
      description: |-
        The four macro axes; an axis the engine could not evaluate is null

        거시 축 네 개. 엔진이 평가하지 못한 축은 null
      required: [rate, growth, fx, sentiment]
      properties:
        rate:
          description: Rate axis; UP means rates are rising / 금리 축. 상승은 금리가 오르는 중
          oneOf:
            - $ref: '#/components/schemas/MacroAxisDto'
            - type: 'null'
        growth:
          description: Growth axis; UP means growth is improving / 성장 축. 상승은 성장이 좋아지는 중
          oneOf:
            - $ref: '#/components/schemas/MacroAxisDto'
            - type: 'null'
        fx:
          description: Exchange-rate axis; UP means the dollar is strong against the won / 환율 축. 상승은 달러 강세(원화 약세)
          oneOf:
            - $ref: '#/components/schemas/MacroAxisDto'
            - type: 'null'
        sentiment:
          description: Market sentiment axis; UP means calmer markets and more risk appetite / 심리 축. 상승은 시장이 차분하고 위험 선호가 큼
          oneOf:
            - $ref: '#/components/schemas/MacroAxisDto'
            - type: 'null'
    MacroAxisDto:
      type: object
      description: One macro axis, direction and strength / 거시 축 하나, 방향과 강도
      required: [direction, strength]
      properties:
        direction:
          $ref: '#/components/schemas/AxisDirection'
          description: |-
            Direction of the axis: UP, DOWN or NEUTRAL

            축의 방향: 상승·하락·중립
        strength:
          type: string
          format: decimal
          description: |-
            Size of the axis score, 0 or more, 8 decimal places, no unit

            축 점수의 크기, 0 이상, 소수 8자리, 단위 없음
    AxisDirection:
      type: string
      enum: [UP, DOWN, NEUTRAL]
    RegimeProbabilitiesDto:
      type: object
      description: |-
        Four regime probabilities; their sum can differ from 1 by at most 0.0002

        국면 확률 네 개. 합은 1과 최대 0.0002 다를 수 있다
      required: [p1, p2, p3, p4]
      properties:
        p1:
          type: string
          format: decimal
          description: |-
            Probability of rates down and growth down, 4 decimal places

            금리 하락·성장 둔화 확률, 소수 4자리
        p2:
          type: string
          format: decimal
          description: |-
            Probability of rates down and growth up, 4 decimal places

            금리 하락·성장 확장 확률, 소수 4자리
        p3:
          type: string
          format: decimal
          description: |-
            Probability of rates up and growth up, 4 decimal places

            금리 상승·성장 확장 확률, 소수 4자리
        p4:
          type: string
          format: decimal
          description: |-
            Probability of rates up and growth down, 4 decimal places

            금리 상승·성장 둔화 확률, 소수 4자리
    FeedItemDto:
      type: object
      description: |-
        One feed item as shown. Event cards and noise share this shape; what was a real event is revealed in the review.

        보인 그대로의 피드 항목. 사건 카드와 소음은 같은 모양이며 무엇이 실제 사건이었는지는 복기에서 공개한다.
      required: [turnNo, seq, assetId, body]
      properties:
        turnNo:
          type: integer
          format: int32
          description: Turn the item was shown in / 보인 턴
        seq:
          type: integer
          format: int32
          description: Display order within the turn, from 1 / 턴 안의 표시 순서, 1부터
        assetId:
          type: [integer, 'null']
          format: int64
          description: Asset the sentence is about, null when it names none / 문장이 다루는 종목, 없으면 null
        body:
          type: string
          description: The sentence as shown / 보인 문장
    HoldingsDto:
      type: object
      description: |-
        Holdings of the current turn × that turn's prices (a live value that reflects this turn's trades immediately). In a turn without trades, the total, holdings valuation and valuation per position equal the turn result of that turn. currentFormation is the formation applied now. The sum of the four shares can differ from 1 by at most 2e-8. Seed, path, month block, year-month and return kind are not included.

        현재 턴의 보유 × 그 턴 가격(이번 턴의 매매가 바로 반영되는 실시간 값). 매매가 없는 턴이면 총액·보유 평가액·포지션별 평가액이 그 턴의 턴 결과와 같다. currentFormation 은 지금 적용 중인 포메이션이다. 비중 4개의 합은 1과 최대 2e-8 다를 수 있다. 시드·경로·월 블록·연월·수익률 종류는 싣지 않는다
      required: [seasonId, turnNo, cashBalance, holdingsValue, totalValue, goalkeeperValue, defenderValue,
                 midfielderValue, forwardValue, goalkeeperWeight, defenderWeight, midfielderWeight, forwardWeight,
                 currentFormation, goalkeeperGap, defenderGap, midfielderGap, forwardGap, formationDeviation, holdings]
      properties:
        seasonId:
          type: integer
          format: int64
          description: Season identifier / 시즌 식별자
        turnNo:
          type: integer
          format: int32
          description: The season's current turn (the turn the prices are based on) / 시즌의 현재 턴(가격 기준 턴)
        cashBalance:
          type: string
          format: decimal
          description: Cash balance (now), whole KRW / 현금 잔액(지금), 원 단위 정수
        holdingsValue:
          type: string
          format: decimal
          description: Holdings valuation = Σ quantity × current turn price, whole KRW / 보유 평가액 = Σ 수량 × 현재 턴 가격, 원 단위 정수
        totalValue:
          type: string
          format: decimal
          description: Total valuation = cash + holdings valuation, whole KRW / 총 평가액 = 현금 + 보유 평가액, 원 단위 정수
        goalkeeperValue:
          type: string
          format: decimal
          description: Goalkeeper valuation (cash included, total − the other three), whole KRW / 골키퍼 평가액(현금 포함, 총액 − 나머지 셋), 원 단위 정수
        defenderValue:
          type: string
          format: decimal
          description: Defender valuation, whole KRW / 수비수 평가액, 원 단위 정수
        midfielderValue:
          type: string
          format: decimal
          description: Midfielder valuation, whole KRW / 미드필더 평가액, 원 단위 정수
        forwardValue:
          type: string
          format: decimal
          description: Attacker valuation, whole KRW / 공격수 평가액, 원 단위 정수
        goalkeeperWeight:
          type: string
          format: decimal
          description: Goalkeeper share = valuation ÷ total valuation, 8 decimal places / 골키퍼 비중 = 평가액 ÷ 총 평가액, 소수 8자리
        defenderWeight:
          type: string
          format: decimal
          description: Defender share, 8 decimal places / 수비수 비중, 소수 8자리
        midfielderWeight:
          type: string
          format: decimal
          description: Midfielder share, 8 decimal places / 미드필더 비중, 소수 8자리
        forwardWeight:
          type: string
          format: decimal
          description: Attacker share, 8 decimal places / 공격수 비중, 소수 8자리
        currentFormation:
          $ref: '#/components/schemas/FormationDto'
        goalkeeperGap:
          type: string
          format: decimal
          description: Goalkeeper share − current formation (positive = more than the target), 8 decimal places / 골키퍼 비중 − 현재 포메이션(양수 = 목표보다 많음), 소수 8자리
        defenderGap:
          type: string
          format: decimal
          description: Defender share − current formation, 8 decimal places / 수비수 비중 − 현재 포메이션, 소수 8자리
        midfielderGap:
          type: string
          format: decimal
          description: Midfielder share − current formation, 8 decimal places / 미드필더 비중 − 현재 포메이션, 소수 8자리
        forwardGap:
          type: string
          format: decimal
          description: Attacker share − current formation, 8 decimal places / 공격수 비중 − 현재 포메이션, 소수 8자리
        formationDeviation:
          type: string
          format: decimal
          description: |-
            Formation deviation = sum of |share − current formation| over the positions, 8 decimal places

            포메이션 이탈 = 포지션별 |비중 − 현재 포메이션|의 합, 소수 8자리
        holdings:
          type: array
          description: Holdings with quantity 1 or more (ascending asset number) / 수량 1 이상인 보유(종목 번호 오름차순)
          items:
            $ref: '#/components/schemas/HoldingDto'
    HoldingDto:
      type: object
      description: |-
        One held asset. The asset name is not included — link it by assetId from the pool response

        보유 한 종목. 종목 이름은 싣지 않는다 — 풀 응답의 assetId 로 잇는다
      required: [assetId, quantity, avgPrice, declaredPosition, price, value, weight]
      properties:
        assetId:
          type: integer
          format: int64
          description: Asset identifier (the same as assetId in the pool response) / 종목 식별자(풀 응답의 assetId 와 같다)
        quantity:
          type: integer
          format: int32
          description: Quantity held (1 or more) / 보유 수량(1 이상)
        avgPrice:
          type: string
          format: decimal
          description: Average cost (fee excluded), 4 decimal places / 평균단가(수수료 제외), 소수 4자리
        declaredPosition:
          $ref: '#/components/schemas/Position'
          description: Declared position of the open span / 열린 구간의 선언 포지션
        price:
          type: string
          format: decimal
          description: Current turn price, whole KRW / 현재 턴 가격, 원 단위 정수
        value:
          type: string
          format: decimal
          description: Valuation = quantity × current turn price, whole KRW / 평가액 = 수량 × 현재 턴 가격, 원 단위 정수
        weight:
          type: string
          format: decimal
          description: Asset share = valuation ÷ total valuation (cash included), 8 decimal places / 종목 비중 = 평가액 ÷ 총 평가액(현금 포함), 소수 8자리
    TurnPricesDto:
      type: object
      description: Prices of the whole pool for one turn (ascending asset number) / 한 턴의 풀 전체 가격(종목 번호 오름차순)
      required: [turnNo, prices]
      properties:
        turnNo:
          type: integer
          format: int32
        prices:
          type: array
          items:
            $ref: '#/components/schemas/TurnPriceDto'
    TurnPriceDto:
      type: object
      required: [assetId, price]
      properties:
        assetId:
          type: integer
          format: int64
          description: Asset identifier (the same as assetId in the pool response) / 종목 식별자(풀 응답의 assetId 와 같다)
        price:
          type: string
          format: decimal
          description: Price, whole KRW / 가격, 원 단위 정수
    PoolAssetDto:
      type: object
      required: [assetId, market, ticker, name, assetType, returnBasis, proxyIndexName,
                 groupId, groupName, groupKind, systemPosition,
                 upParticipation, downParticipation, volatility, maxDrawdown]
      properties:
        assetId:
          type: integer
          format: int64
          description: Asset identifier (used in order requests). Not shown to the player / 종목 식별자(주문 요청에 쓴다). 표시하지 않는다
        market:
          $ref: '#/components/schemas/Market'
        ticker:
          type: string
        name:
          type: string
        assetType:
          $ref: '#/components/schemas/AssetType'
        returnBasis:
          $ref: '#/components/schemas/ReturnBasis'
        proxyIndexName:
          type: [string, 'null']
          description: Name of the tracked index used for the period before listing (ETFs only) / 상장 전 구간에 쓰는 추종 지수 이름(ETF만)
        groupId:
          type: integer
          format: int64
        groupName:
          type: string
        groupKind:
          $ref: '#/components/schemas/AssetGroupKind'
        systemPosition:
          $ref: '#/components/schemas/Position'
        upParticipation:
          type: string
          format: decimal
          description: Up-market participation rate (months the market rose 1% or more, in KRW) / 상승장 참여율(시장이 1% 이상 오른 달, 원화)
        downParticipation:
          type: string
          format: decimal
          description: Down-market participation rate (months the market fell 1% or more, in KRW) / 하락장 참여율(시장이 1% 이상 빠진 달, 원화)
        volatility:
          type: string
          format: decimal
          description: Sample standard deviation of monthly returns (not annualized) / 월 수익률 표본 표준편차(연율화 안 함)
        maxDrawdown:
          type: string
          format: decimal
          description: Maximum drawdown, 0 or less (−0.35 = −35%) / 최대 낙폭, 0 이하(−0.35 = −35%)
    SeasonStatus:
      type: string
      enum: [IN_PROGRESS, ABANDONING, FINISHED, HALTED, PAUSED, VOID]
    Market:
      type: string
      enum: [KR, US]
    AssetType:
      type: string
      enum: [STOCK, ETF]
    ReturnBasis:
      type: string
      enum: [PRICE, TOTAL]
    AssetGroupKind:
      type: string
      enum: [SECTOR, ASSET_CLASS]
    Position:
      type: string
      enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD_TARGET, FORWARD_BREAKOUT, FORWARD_DEFENSIVE]
    OrderSide:
      type: string
      enum: [BUY, SELL]
    AgentTurnViewDto:
      type: object
      description: |-
        The turn screen of an agent. season, lastTurn, holdings, prices and pool have the shapes of the human endpoints; agent is the agent-only part. Nothing the human turn screen does not show is added

        에이전트의 턴 화면. season·lastTurn·holdings·prices·pool 은 사람 조회와 같은 형이고 agent 는 에이전트 전용 몫이다. 사람의 턴 화면에 없는 것은 더하지 않는다
      required: [season, lastTurn, holdings, prices, pool, agent]
      properties:
        season:
          $ref: '#/components/schemas/SeasonDto'
        lastTurn:
          description: Result of the current turn; null at turn 0 / 현재 턴의 결과, 0턴이면 null
          oneOf:
            - $ref: '#/components/schemas/TurnResultDto'
            - type: 'null'
        holdings:
          $ref: '#/components/schemas/HoldingsDto'
        prices:
          $ref: '#/components/schemas/TurnPricesDto'
        pool:
          type: array
          items:
            $ref: '#/components/schemas/PoolAssetDto'
        agent:
          $ref: '#/components/schemas/AgentPartDto'
    AgentPartDto:
      type: object
      required: [schema, recentTrades, lastRejects, memory]
      properties:
        schema:
          type: string
          enum: [turn-decision/1]
          description: Reply format to answer in / 답할 응답 형식
        recentTrades:
          type: array
          description: Own fills of the last turns before the current one, oldest first / 현재 턴 이전 몇 턴의 본인 체결, 오래된 것부터
          items:
            $ref: '#/components/schemas/RecentTradeDto'
        lastRejects:
          type: array
          description: Units the engine rejected in the previous turn's decision; empty at turn 0 / 직전 턴 결정에서 엔진이 거부한 단위, 0턴이면 빈 목록
          items:
            $ref: '#/components/schemas/RejectDto'
        memory:
          type: 'null'
          description: Reserved for agent memory; always null for now / 에이전트 기억 자리, 지금은 항상 null
    RecentTradeDto:
      type: object
      required: [turnNo, side, asset, quantity, price, fee, source]
      properties:
        turnNo:
          type: integer
          format: int32
        side:
          $ref: '#/components/schemas/OrderSide'
        asset:
          type: string
          pattern: '^(KR|US):[A-Z0-9.]{1,12}$'
          description: MARKET:TICKER / 시장:종목코드
        quantity:
          type: integer
          format: int32
        price:
          type: string
          format: decimal
          description: Fill price (that turn's price), whole KRW / 체결가(그 턴 가격), 원 단위 정수
        fee:
          type: string
          format: decimal
          description: Fee, whole KRW / 수수료, 원 단위 정수
        source:
          $ref: '#/components/schemas/OrderSource'
    RejectDto:
      type: object
      description: |-
        One part of the previous decision that the engine rejected. Never model text: unit, code and pointer come from fixed sets or plain names. A unit reject has a unit (and an index for ORDER) and no pointer. A reply-level reject, such as a reply that failed the format check, has no unit and no index; its code is SCHEMA_INVALID and the pointer says where in the reply the fault is

        엔진이 거부한 직전 결정의 한 부분. 모델 문장이 아니다: unit·code·pointer 는 정해진 집합이나 평범한 이름이다. 단위 거부는 unit(ORDER 면 index)이 있고 pointer 가 없다. 응답 전체에 대한 거부(예: 형식 검사 실패)는 unit·index 가 없고 code 는 SCHEMA_INVALID, pointer 가 응답 안의 위치를 말한다
      required: [unit, index, code, pointer]
      properties:
        unit:
          type: [string, 'null']
          enum: [FORMATION, ORDER, THESES, null]
        index:
          type: [integer, 'null']
          format: int32
          minimum: 0
          maximum: 39
          description: Position in the reply's orders array, for ORDER only / 응답 orders 배열의 위치, ORDER 에만
        code:
          type: string
          pattern: '^[A-Z][A-Z_]{0,39}$'
          description: Reject code recorded by the engine / 엔진이 기록한 거부 코드
        pointer:
          type: [string, 'null']
          pattern: '^(/[A-Za-z0-9_]{1,40}){1,6}$'
          description: Where in the reply the fault is, for a reply-level reject only / 응답 안의 위치, 응답 전체 거부에만
    OrderSource:
      type: string
      enum: [RANKING, FEED, ALERT, BENCH, DIRECT]
    AbandonSeasonRequest:
      type: object
      description: |-
        The current turn the member saw is checked only while the season is in progress

        회원이 본 현재 턴은 시즌이 진행 중일 때만 확인한다
      required: [expectedTurnNo]
      properties:
        expectedTurnNo:
          type: integer
          format: int32
          minimum: 0
          description: The current turn the member saw. 409 TURN_MISMATCH if the season is in progress at another turn; ignored when the abandon was already marked (repeat) / 회원이 본 현재 턴. 진행 중인 시즌의 현재 턴과 다르면 409 TURN_MISMATCH, 이미 포기가 표시된 시즌의 반복 요청에서는 무시한다
    AbandonResultDto:
      type: object
      description: |-
        State of the season after this abandon request; repeat the request while the status is ABANDONING

        이번 포기 요청 뒤 시즌의 상태. 상태가 ABANDONING 이면 같은 요청을 반복한다
      required: [seasonId, status, currentTurnNo, pathLength, abandonedTurnNo, notStarted, advancedTurns, remainingTurns]
      properties:
        seasonId:
          type: integer
          format: int64
          description: Season identifier / 시즌 식별자
        status:
          $ref: '#/components/schemas/SeasonStatus'
          description: ABANDONING (more turns remain) or FINISHED / ABANDONING(남은 턴이 있다) 또는 FINISHED
        currentTurnNo:
          type: integer
          format: int32
          description: Current turn now / 지금의 현재 턴
        pathLength:
          type: integer
          format: int32
          description: Path length (number of turns) / 경로 길이(턴 수)
        abandonedTurnNo:
          type: integer
          format: int32
          description: The turn at which the season was abandoned / 포기한 턴
        notStarted:
          type: boolean
          description: True for a human member who abandoned before turn 3 (derived from the abandon turn and the member kind) / 사람 회원이 3턴 전에 포기하면 true(포기 턴과 회원 종류에서 계산)
        advancedTurns:
          type: integer
          format: int32
          description: Auto turns this request advanced / 이번 요청이 진행한 자동 턴 수
        remainingTurns:
          type: integer
          format: int32
          description: 'Turns still to run: pathLength - currentTurnNo / 남은 턴: pathLength - currentTurnNo'
    VoidSeasonRequest:
      type: object
      description: |-
        The defect record of a void season. The note holds no key, prompt or model reply

        무효 시즌의 결함 기록. 메모에는 키·프롬프트·모델 응답을 싣지 않는다
      required: [reason, note]
      properties:
        reason:
          $ref: '#/components/schemas/VoidReason'
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: What failed, in the runner's own words (not blank) / 무엇이 실패했는지 러너의 말로(공백 불가)
    VoidReason:
      type: string
      enum: [MODEL_GONE, ENGINE_DEFECT, RUNNER_DEFECT]
    AdvanceTurnRequest:
      type: object
      required: [expectedTurnNo]
      properties:
        expectedTurnNo:
          type: integer
          format: int32
          minimum: 0
          description: The current turn before the advance; 409 if it differs / 전환 전의 현재 턴, 다르면 409
    CallsRequest:
      type: object
      required: [calls]
      properties:
        calls:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/CallRecordRequest'
    DecisionRequest:
      type: object
      description: |-
        The runner's verdict, the reply and the calls of the turn. decision is a turn-decision/1 object and is present exactly when outcome is DECISION. The last call is the final one: its status must fit the outcome (DECISION needs OK; INVALID needs OK or INVALID; NO_RESPONSE needs a status other than OK and INVALID)

        러너의 판정, 응답, 그 턴의 호출. decision 은 turn-decision/1 객체이며 outcome 이 DECISION 일 때만 있다. 마지막 호출이 최종 호출이고 그 상태는 결과와 맞아야 한다(DECISION 은 OK, INVALID 는 OK 또는 INVALID, NO_RESPONSE 는 OK·INVALID 가 아닌 상태)
      required: [outcome, decision, calls]
      properties:
        outcome:
          $ref: '#/components/schemas/DecisionOutcome'
        decision:
          description: The reply as a turn-decision/1 object (docs/api/turn-decision-1.schema.json); null unless outcome is DECISION / turn-decision/1 객체 응답, outcome 이 DECISION 이 아니면 null
          type: [object, 'null']
        calls:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/CallRecordRequest'
    CallRecordRequest:
      type: object
      description: |-
        One model call (an attempt) as the runner made it. Attempt numbers follow one another; texts are stored as sent and received (at most 256 KiB each, no secret-looking strings)

        러너가 한 모델 호출(시도) 하나. 시도 번호는 이어지고, 원문은 보낸 그대로 저장한다(각 256 KiB 이하, 비밀값처럼 보이는 문자열 금지)
      required: [attemptNo, kind, status, modelRequested, requestText, latencyMs]
      properties:
        attemptNo:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        kind:
          type: string
          enum: [TURN_DECISION]
        ledgerCallId:
          type: [string, 'null']
          format: uuid
          description: Call id of the account-wide call ledger; required on an OPENROUTER season / 계정 전체 호출 장부의 호출 번호, OPENROUTER 시즌에서는 필수
        status:
          $ref: '#/components/schemas/AgentCallStatus'
        httpStatus:
          type: [integer, 'null']
          format: int32
          minimum: 100
          maximum: 599
        modelRequested:
          type: string
          maxLength: 200
          description: Must equal the model of the season config / 시즌 설정의 모델과 같아야 한다
        modelActual:
          type: [string, 'null']
          maxLength: 200
        provider:
          type: [string, 'null']
          maxLength: 100
        requestText:
          type: string
        responseText:
          type: [string, 'null']
        tokensIn:
          type: [integer, 'null']
          format: int32
          minimum: 0
        tokensOut:
          type: [integer, 'null']
          format: int32
          minimum: 0
        costUsd:
          type: [string, 'null']
          format: decimal
          description: Cost in USD as a decimal string, up to 8 decimals / USD 비용, 소수 8자리까지의 십진 문자열
        latencyMs:
          type: integer
          format: int32
          minimum: 0
    AgentCallStatus:
      type: string
      enum: [OK, UPSTREAM, TIMEOUT, LIMITED, POLICY_REFUSED, ERROR, INVALID]
    DecisionOutcome:
      type: string
      enum: [DECISION, NO_RESPONSE, INVALID]
    UnitStatus:
      type: string
      enum: [APPLIED, REJECTED, NONE]
    DecisionResultDto:
      type: object
      description: |-
        What the engine did with each unit. Unit rejects are results, not errors. A formation change that is rejected leaves the old formation, and the orders of that turn are then not linked to it

        엔진이 단위마다 한 일. 단위 거부는 오류가 아니라 결과다. 거부된 전술 변경은 이전 포메이션을 그대로 두고, 그 턴의 주문은 그 변경에 묶이지 않는다
      required: [seasonId, turnNo, outcome, replayed, formationChange, orders, theses, schemaViolations]
      properties:
        seasonId:
          type: integer
          format: int64
        turnNo:
          type: integer
          format: int32
        outcome:
          $ref: '#/components/schemas/DecisionOutcome'
        replayed:
          type: boolean
          description: True when the stored result of an earlier identical submit is returned / 앞서 낸 같은 결정의 저장된 결과이면 true
        formationChange:
          $ref: '#/components/schemas/FormationResultDto'
        orders:
          type: array
          description: One entry per order of the reply, in the reply's order / 응답의 주문마다 하나, 응답 순서대로
          items:
            $ref: '#/components/schemas/OrderUnitResultDto'
        theses:
          $ref: '#/components/schemas/ThesesResultDto'
        schemaViolations:
          type: array
          description: Where the reply broke the shape when the outcome is INVALID; empty otherwise / 결과가 INVALID 일 때 응답이 모양을 어긴 곳, 아니면 빈 목록
          items:
            $ref: '#/components/schemas/SchemaViolationDto'
    FormationResultDto:
      type: object
      required: [status, code, formationChangeId]
      properties:
        status:
          $ref: '#/components/schemas/UnitStatus'
        code:
          type: [string, 'null']
          description: Reject code when REJECTED / 거부일 때의 코드
          enum: [TURN_ZERO_FORMATION, FORMATION_UNCHANGED, FORMATION_INVALID, null]
        formationChangeId:
          type: [integer, 'null']
          format: int64
    OrderUnitResultDto:
      type: object
      required: [index, status, code, orderId]
      properties:
        index:
          type: integer
          format: int32
          minimum: 0
        status:
          $ref: '#/components/schemas/UnitStatus'
        code:
          type: [string, 'null']
          description: Reject code when REJECTED / 거부일 때의 코드
          enum: [ASSET_NOT_IN_POOL, QUANTITY_INVALID, INSUFFICIENT_HOLDING, INSUFFICIENT_CASH, SINGLE_ASSET_LIMIT, POSITION_REQUIRED, POSITION_CONFLICT, POSITION_ON_SELL, SOURCE_NOT_VISIBLE, SOURCE_NOT_ALLOWED, null]
        orderId:
          type: [integer, 'null']
          format: int64
    ThesesResultDto:
      type: object
      required: [status, code]
      properties:
        status:
          $ref: '#/components/schemas/UnitStatus'
        code:
          type: [string, 'null']
          enum: [THESES_NOT_SUPPORTED, null]
    SchemaViolationDto:
      type: object
      description: |-
        Where the reply broke the shape: a JSON pointer and the schema keyword. It never carries the offending value or a key chosen by the model

        응답이 모양을 어긴 곳: JSON 포인터와 스키마 키워드. 어긴 값이나 모델이 고른 키는 싣지 않는다
      required: [pointer, keyword]
      properties:
        pointer:
          type: string
        keyword:
          type: string
          enum: [type, required, additionalProperties, const, enum, pattern, maxLength, maxItems, minimum, maximum]
    CreateLeagueRequest:
      type: object
      description: |-
        The seed, base date and money settings are not taken from the request

        시드·기준일·돈 설정은 요청에서 받지 않는다
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        pathLength:
          type: integer
          format: int32
          default: 12
          description: 'Path length (number of turns): 12, 24 or 60. 12 when omitted / 경로 길이(턴 수) 12, 24, 60. 생략하면 12'
        maxEntries:
          type: integer
          format: int32
          minimum: 2
          maximum: 20
          default: 8
    LeagueDto:
      type: object
      required: [id, name, status, pathLength, maxEntries, entries]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          enum: [OPEN, CLOSED]
        pathLength:
          type: integer
          format: int32
        maxEntries:
          type: integer
          format: int32
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeagueEntryDto'
    LeagueEntryDto:
      type: object
      required: [memberId, memberKind, displayName, seasonId, status, currentTurnNo]
      properties:
        memberId:
          type: integer
          format: int64
        memberKind:
          type: string
          enum: [HUMAN, AGENT]
        displayName:
          type: string
        seasonId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SeasonStatus'
        currentTurnNo:
          type: integer
          format: int32
    Problem:
      type: object
      description: RFC 9457 problem details + a top-level code / RFC 9457 문제 상세 + 최상위 code
      required: [title, status, detail, instance, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
          description: Fixed Korean sentence. It never carries the rejected value / 고정 한국어 문장. 거부된 값을 싣지 않는다
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
    FieldViolation:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
    ErrorCode:
      type: string
      enum: [INVALID_ARGUMENT, NOT_FOUND, METHOD_NOT_ALLOWED, NOT_ACCEPTABLE,
             UNSUPPORTED_MEDIA_TYPE, MALFORMED_REQUEST, INTERNAL_ERROR, POOL_NOT_LOADED, POOL_NOT_JUDGED, PATH_TOO_LONG,
             ENGINE_UNAVAILABLE, SEASON_LIMIT, TURN_NOT_REACHED, SEASON_NOT_FINISHED, SEASON_NOT_ACTIVE, TURN_MISMATCH, LEDGER_MISMATCH,
             LINEUP_MISMATCH, ASSET_NOT_IN_POOL, SOURCE_NOT_VISIBLE, INSUFFICIENT_CASH, INSUFFICIENT_HOLDING, POSITION_CONFLICT, POSITION_REQUIRED,
             INVALID_FORMATION, EVENT_TIME_CONFLICT, RECONCILIATION_FAILED, SEASON_HALTED, FORBIDDEN, EMAIL_TAKEN,
             UNAUTHENTICATED, INVALID_CREDENTIALS, AGENT_RETIRED, DECISION_CONFLICT, DECISION_MISSING,
             PERSONA_VERSION_CONFLICT, PERSONA_VERSION_STALE, LEAGUE_NOT_SETTLED, LEAGUE_CLOSED, LEAGUE_SEAT_TAKEN,
             LEAGUE_FULL, LEAGUE_STALE, LEAGUE_OPEN]
