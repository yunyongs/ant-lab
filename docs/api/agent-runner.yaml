  /internal/agent-runner/v1/agents/{agentId}/seasons/{seasonId}/pause:
    post:
      tags: [agent]
      operationId: pauseAgentSeason
      summary: Pause an agent season / 에이전트 시즌을 일시 정지한다
      description: |-
        Stops a season in progress at its current turn (for a limit, a balance, a budget or a failure the runner cannot wait out). The turn does not change. A paused season cannot decide or advance, and the agent cannot start a new season while one is paused or abandoning (resume it, or abandon it and repeat until FINISHED). It ends by a resume (same turn) or an abandon. A pause that is not resumed within 7 days becomes an abandon (counted, PLAN §4.1-7): the rule is applied from the clock by the next pause, resume, abandon or void attempt on that season, not by a scheduler, but every read (this API's season and turn-view answers, the observation views) already shows a pause older than 7 days as ABANDONING with the paused turn as the abandon turn. A repeat on a paused season answers it unchanged. Send the unflushed attempts (POST calls) before pausing: a paused season refuses them.

        시즌을 현재 턴에서 멈춘다(러너가 기다릴 수 없는 한도·잔액·예산·실패). 턴은 바뀌지 않는다. 일시 정지된 시즌은 결정·전환을 할 수 없고, 에이전트는 일시 정지 중이거나 포기 중인 시즌이 있으면 새 시즌을 시작할 수 없다(재개하거나, 포기해 FINISHED 가 될 때까지 반복한다). 재개(같은 턴) 또는 포기로만 끝난다. 7일 안에 재개하지 않은 일시 정지는 포기가 된다(집계, PLAN §4.1-7). 저장된 행은 스케줄러가 아니라 그 시즌의 다음 일시 정지·재개·포기·무효 시도가 시계로 바꾸지만, 읽기(시즌·턴 화면 응답, 관측 뷰)는 7일이 지난 일시 정지를 이미 포기 턴 = 정지한 턴인 ABANDONING 으로 보인다. 이미 일시 정지된 시즌에 반복하면 그대로 답한다. 보내지 못한 시도(POST calls)는 정지 전에 보낸다 — 정지된 시즌은 받지 않는다.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          description: The season after the request. status is PAUSED, or ABANDONING when the pause was already over / 요청 뒤 시즌. 상태는 PAUSED, 기한이 이미 지났으면 ABANDONING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
        '400':
          description: The request is wrong — INVALID_ARGUMENT / 요청이 틀렸다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The agent does not exist or is not this owner's, or the season is not this agent's. One answer for all — NOT_FOUND / 에이전트가 없거나 이 소유자의 것이 아니거나, 시즌이 이 에이전트의 것이 아니다. 모두 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
