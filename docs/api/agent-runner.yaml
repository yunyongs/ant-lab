          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/agent-runner/v1/agents/{agentId}/seasons/{seasonId}/reflection-view:
    get:
      tags: [agent]
      operationId: getReflectionView
      summary: What the agent sees of a finished season for its reflection / 복기를 쓰는 에이전트가 끝난 시즌에서 보는 것
      description: |-
        Returns what the agent writes its reflection from: the base memory version and operating note (null and empty for the first), the path length, the season report and the stored score, and for every decision turn 0 to pathLength - 1 a relative label (such as 1년차 7월), the agent's own stated reason, its fills (asset, side, quantity; no price), the engine's rejects, and the display number and kind of the feed items its orders cited. No date, month, event name, seed, price or feed text is carried. It is available only when the season is the next one to write: FINISHED, not VOID, not abandoned, without an outcome, with its league and same-seed group closed, and with no earlier released season waiting. The score is made on demand; until it is stored the answer is SCORE_PENDING.

        에이전트가 복기를 쓸 때 바탕이 되는 것을 준다: 기준 메모리 버전과 운용 노트(처음이면 null과 빈 목록), 경로 길이, 시즌 성적표와 저장된 점수, 그리고 결정 턴 0부터 pathLength - 1 마다 상대 라벨(예: 1년차 7월), 에이전트 본인이 적은 이유, 체결(종목·방향·수량, 가격 없음), 엔진의 거부, 주문이 인용한 피드 항목의 표시 번호와 종류. 날짜·달·사건 이름·시드·가격·피드 문장은 싣지 않는다. 시즌이 다음에 쓸 차례일 때만 열린다: FINISHED 이고 VOID 도 포기도 아니며 결과가 아직 없고, 리그와 같은 시드 묶음이 닫혔고, 먼저 공개된 대기 시즌이 없어야 한다. 점수는 요청 때 만들며, 저장되기 전에는 SCORE_PENDING 이다.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          description: The reflection view / 복기 화면
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReflectionViewDto'
        '400':
          description: A number in the path is not a number — INVALID_ARGUMENT / 경로의 번호가 숫자가 아니다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The agent does not exist or is not this owner's, or the season is not this agent's. One answer for all — NOT_FOUND / 에이전트가 없거나 이 소유자의 것이 아니거나 시즌이 이 에이전트의 것이 아니다. 모두 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The season cannot be reflected on now — SEASON_NOT_FINISHED, MEMORY_NOT_ELIGIBLE (VOID or abandoned), MEMORY_DONE (an outcome is recorded), LEAGUE_OPEN (its league or same-seed group is still open), MEMORY_ORDER (an earlier released season must come first) / 지금은 복기를 쓸 수 없다 — SEASON_NOT_FINISHED, MEMORY_NOT_ELIGIBLE(VOID 또는 포기), MEMORY_DONE(결과가 이미 있다), LEAGUE_OPEN(리그나 같은 시드 묶음이 아직 열려 있다), MEMORY_ORDER(먼저 공개된 시즌이 앞선다)
          x-error-codes: [SEASON_NOT_FINISHED, MEMORY_NOT_ELIGIBLE, MEMORY_DONE, LEAGUE_OPEN, MEMORY_ORDER]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The season score is not stored yet; try again later — SCORE_PENDING / 시즌 점수가 아직 저장되지 않았다. 잠시 뒤 다시 시도한다 — SCORE_PENDING
          x-error-codes: [SCORE_PENDING]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/agent-runner/v1/agents/{agentId}/seasons/{seasonId}/memory:
    post:
      tags: [agent]
      operationId: submitSeasonMemory
      summary: Record the memory step of a finished season / 끝난 시즌의 기억 단계를 기록한다
      description: |-
        Records what became of one season's reflection: ACCEPTED (a season-reflection/1 object, the rewritten operating-note/1 object, the base version it was written on, and whether the note is the carried-over one) or DISCARDED (fixed reason codes only; the model calls are kept, no version is made). It stores the model calls (kinds REFLECTION and PLAYBOOK, numbered 1, 2, ... within each kind, at the path length as turn number, never final), the outcome and, when accepted, memory version n + 1, in one transaction under a lock on the agent, so one agent's memory is written one step at a time. The checks run in a fixed order and a failure writes nothing: the request (400), the season's gates (404, 409: SEASON_NOT_FINISHED, MEMORY_NOT_ELIGIBLE, MEMORY_DONE, LEAGUE_OPEN, MEMORY_ORDER, the same rules as the reflection view), the calls (400), baseVersion against the agent's latest version (409), the two JSON schemas docs/api/season-reflection-1.schema.json and docs/api/operating-note-1.schema.json (422), then the leak filter memory-filter/1 (422). The shape is checked before the filter because the filter skips what is not a string. A string with a NUL or an unpaired surrogate is a shape error (keyword encoding). Strings are stored in NFC and measured after NFC. A carried-over note must equal the previous version's rules, or, for the first version, the reflection's ruleCandidates. A season has one outcome: sending the same step again after it was recorded is MEMORY_DONE. The refusals name pointers and fixed codes only and never echo the text. The filter needs the month event titles of the history pool; without any, it refuses (POOL_NOT_LOADED).

        한 시즌의 복기가 어떻게 되었는지 기록한다: ACCEPTED(season-reflection/1 객체, 다시 쓴 operating-note/1 객체, 쓴 바탕 버전, 이월한 노트인지 여부) 또는 DISCARDED(고정 사유 코드만, 모델 호출은 남기고 버전은 만들지 않는다). 모델 호출(종류 REFLECTION·PLAYBOOK, 종류마다 1, 2, ... 번호, 턴 번호는 경로 길이, 최종 아님)과 결과, 받아들였으면 메모리 버전 n + 1을 에이전트 행 잠금 아래 한 트랜잭션으로 저장하므로 한 에이전트의 기억은 한 단계씩 쓰인다. 검사는 정해진 순서로 하고 실패하면 아무것도 쓰지 않는다: 요청(400), 시즌의 관문(404, 409: SEASON_NOT_FINISHED, MEMORY_NOT_ELIGIBLE, MEMORY_DONE, LEAGUE_OPEN, MEMORY_ORDER, 복기 화면과 같은 규칙), 호출(400), baseVersion과 에이전트의 최신 버전(409), 두 JSON 스키마 docs/api/season-reflection-1.schema.json·docs/api/operating-note-1.schema.json(422), 이어 누출 필터 memory-filter/1(422). 필터는 문자열이 아닌 것을 건너뛰므로 모양을 먼저 본다. NUL이나 짝 없는 서로게이트가 든 문자열은 모양 오류(keyword encoding)다. 문자열은 NFC로 저장하고 NFC 기준으로 잰다. 이월한 노트는 앞 버전의 규칙과 같아야 하고, 첫 버전이면 복기의 ruleCandidates와 같아야 한다. 시즌의 결과는 하나라서, 기록된 뒤 같은 단계를 다시 보내면 MEMORY_DONE이다. 거절 응답은 포인터와 고정 코드만 싣고 본문을 되풀이하지 않는다. 필터에는 역사 풀의 월별 사건 제목이 필요하며, 하나도 없으면 거절한다(POOL_NOT_LOADED).
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/SeasonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSeasonMemoryRequest'
      responses:
        '201':
          description: The outcome is recorded / 결과를 기록했다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitSeasonMemoryResultDto'
        '400':
          description: The request is wrong — INVALID_ARGUMENT (ACCEPTED without a reflection or note, or with discard codes; DISCARDED without codes, with a document, a base version or the carried flag; repeated codes; a call that is not of the kind REFLECTION or PLAYBOOK, or an ACCEPTED request without a REFLECTION call; attempt numbers that do not run 1, 2, ... within each kind; the rules of the calls endpoint; a carried note that differs from the one to carry). Nothing is recorded / 요청이 틀렸다 — INVALID_ARGUMENT(복기나 노트가 없는 ACCEPTED, 폐기 사유가 있는 ACCEPTED, 사유가 없거나 문서·기준 버전·이월 표시가 있는 DISCARDED, 겹친 사유, REFLECTION·PLAYBOOK 종류가 아닌 호출, REFLECTION 호출이 없는 ACCEPTED, 종류마다 1, 2, ...로 이어지지 않는 시도 번호, 호출 저장 연산의 규칙, 이월할 노트와 다른 이월 노트). 아무것도 기록하지 않는다
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The agent does not exist or is not this owner's, or the season is not this agent's. One answer for all — NOT_FOUND / 에이전트가 없거나 이 소유자의 것이 아니거나 시즌이 이 에이전트의 것이 아니다. 모두 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The step cannot be recorded now — SEASON_NOT_FINISHED, MEMORY_NOT_ELIGIBLE (VOID or abandoned), MEMORY_DONE (an outcome is recorded), LEAGUE_OPEN (its league or same-seed group is still open), MEMORY_ORDER (an earlier released season must come first), MEMORY_BASE_STALE (baseVersion is not the agent's latest version; read the memory again), POOL_NOT_LOADED (no month event titles for the filter) / 지금은 기록할 수 없다 — SEASON_NOT_FINISHED, MEMORY_NOT_ELIGIBLE(VOID 또는 포기), MEMORY_DONE(결과가 이미 있다), LEAGUE_OPEN(리그나 같은 시드 묶음이 아직 열려 있다), MEMORY_ORDER(먼저 공개된 시즌이 앞선다), MEMORY_BASE_STALE(baseVersion이 최신 버전이 아니다. 기억을 다시 읽는다), POOL_NOT_LOADED(필터에 쓸 월별 사건 제목이 없다)
          x-error-codes: [SEASON_NOT_FINISHED, MEMORY_NOT_ELIGIBLE, MEMORY_DONE, LEAGUE_OPEN, MEMORY_ORDER, MEMORY_BASE_STALE, POOL_NOT_LOADED]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The reflection or note was refused, with pointers and fixed codes in the body, never the text — MEMORY_SCHEMA_INVALID (violations[] with pointer and keyword), MEMORY_LEAK (leaks[] with pointer and code) / 복기나 노트를 거절했다. 본문에는 포인터와 고정 코드만 있고 문장은 없다 — MEMORY_SCHEMA_INVALID(violations[]에 포인터와 keyword), MEMORY_LEAK(leaks[]에 포인터와 code)
          x-error-codes: [MEMORY_SCHEMA_INVALID, MEMORY_LEAK]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MemoryRejectedProblem'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/agent-runner/v1/leagues:
    post:
      tags: [league]
      operationId: createLeague
      summary: Create a league / 리그 생성
      description: |-
        Creates a manual same-seed group for the configured owner. The server draws the seed and fixes the path length and the season settings; none of them is taken from the request and the seed is never returned. With sameSeedAs the new league is a sibling in the group of that root league: it copies the root's seed and settings, and it is refused when the root is itself a sibling (400) or already CLOSED (409). The root row is locked, so a close of the root cannot interleave with the creation. Entry into a league is not part of this operation.

        설정된 소유자의 수동 같은 시드 묶음을 만든다. 시드는 서버가 뽑고 경로 길이와 시즌 설정도 서버가 고정하며, 요청에서 받지 않고 시드는 돌려주지 않는다. sameSeedAs 를 주면 그 뿌리 리그 묶음의 형제가 되어 뿌리의 시드와 설정을 그대로 쓰며, 뿌리가 형제이면 거절(400), 이미 CLOSED 이면 거절(409)한다. 뿌리 행을 잠가서 뿌리를 닫는 일이 생성 중간에 끼어들 수 없다. 리그 참가는 이 연산에 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeagueRequest'
      responses:
        '201':
          description: The league that was created, without entries / 새로 만든 리그(참가 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDto'
        '400':
          description: The request is wrong, or sameSeedAs names a sibling instead of a root — INVALID_ARGUMENT / 요청이 틀렸거나 sameSeedAs 가 뿌리가 아니라 형제를 가리킨다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: With sameSeedAs, the league does not exist or is not this owner's — NOT_FOUND / sameSeedAs 가 가리키는 리그가 없거나 이 소유자의 것이 아니다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A league cannot be created now — LEAGUE_CLOSED (the root of sameSeedAs is closed), POOL_NOT_LOADED, POOL_NOT_JUDGED / 지금은 만들 수 없다 — LEAGUE_CLOSED(sameSeedAs 의 뿌리가 닫혔다), POOL_NOT_LOADED, POOL_NOT_JUDGED
          x-error-codes: [LEAGUE_CLOSED, POOL_NOT_LOADED, POOL_NOT_JUDGED]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: A path of the requested length cannot be built — PATH_TOO_LONG / 요청한 길이의 경로를 만들 수 없다 — PATH_TOO_LONG
          x-error-codes: [PATH_TOO_LONG]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The path service is busy or not reachable; the runner retries later — ENGINE_UNAVAILABLE / 경로 서비스가 바쁘거나 연결되지 않는다. 러너는 나중에 다시 시도한다 — ENGINE_UNAVAILABLE
          x-error-codes: [ENGINE_UNAVAILABLE]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/agent-runner/v1/leagues/{leagueId}:
    get:
      tags: [league]
      operationId: getLeague
      summary: A league and its seats / 리그와 참가 목록
      description: |-
        Returns the league with one row per seat. The status of a seat is the effective season status (an overdue pause already reads as an abandon). No seed, date, engine version or price is returned. A league of another owner and a missing league give the same answer.

        리그와 참가별 한 행을 준다. 참가의 상태는 시즌의 유효 상태다(기한이 지난 일시 정지는 이미 포기로 읽는다). 시드·날짜·엔진 버전·가격은 주지 않는다. 다른 소유자의 리그와 없는 리그는 같은 응답이다.
      parameters:
        - $ref: '#/components/parameters/LeagueId'
      responses:
        '200':
          description: The league / 리그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDto'
        '400':
          description: The league number is not a number — INVALID_ARGUMENT / 리그 번호가 숫자가 아니다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The league does not exist or is not this owner's. One answer for both — NOT_FOUND / 리그가 없거나 이 소유자의 것이 아니다. 둘 다 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/agent-runner/v1/leagues/{leagueId}/close:
    post:
      tags: [league]
      operationId: closeLeague
      summary: Close a league / 리그 마감
      description: |-
        Stops new entries once every seat is FINISHED or VOID. Closing a closed league answers the league as it is (200, no change).

        모든 참가가 FINISHED 또는 VOID 가 되면 새 참가를 막는다. 이미 닫힌 리그를 다시 닫으면 그대로 200으로 답한다(변경 없음).
      parameters:
        - $ref: '#/components/parameters/LeagueId'
      responses:
        '200':
          description: The league after this request / 이번 요청 뒤 리그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDto'
        '400':
          description: The league number is not a number — INVALID_ARGUMENT / 리그 번호가 숫자가 아니다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The league does not exist or is not this owner's. One answer for both — NOT_FOUND / 리그가 없거나 이 소유자의 것이 아니다. 둘 다 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A seat is still playing — LEAGUE_NOT_SETTLED / 아직 진행 중인 참가가 있다 — LEAGUE_NOT_SETTLED
          x-error-codes: [LEAGUE_NOT_SETTLED]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    runnerToken:
      type: apiKey
      in: header
      name: X-Antlab-Runner-Token
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      description: Agent member identifier from registration / 등록에서 받은 에이전트 회원 식별자
      schema:
        type: integer
        format: int64
    SeasonId:
      name: seasonId
      in: path
      required: true
      description: Season identifier / 시즌 식별자
      schema:
        type: integer
        format: int64
    TurnNo:
      name: turnNo
      in: path
      required: true
      description: Turn number, 0 or more / 턴 번호, 0 이상
      schema:
        type: integer
        format: int32
        minimum: 0
    LeagueId:
      name: leagueId
      in: path
      required: true
      description: League identifier from the league creation / 리그 생성에서 받은 리그 식별자
      schema:
        type: integer
        format: int64
  responses:
    Unauthenticated:
      description: |-
        The service token is missing, wrong or not configured — UNAUTHENTICATED

        서비스 토큰이 없거나 틀렸거나 설정되지 않았다 — UNAUTHENTICATED
      x-error-codes: [UNAUTHENTICATED]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: |-
        An unexpected server error — INTERNAL_ERROR. The message is a fixed sentence that carries no exception content

        예상하지 못한 서버 오류 — INTERNAL_ERROR. 예외 내용은 싣지 않는 고정 문장이다
      x-error-codes: [INTERNAL_ERROR]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RegisterAgentRequest:
      type: object
      required: [personaKey, modelRoute, modelId, displayName]
      properties:
        personaKey:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Persona key, lowercase words joined by hyphens / 페르소나 키, 하이픈으로 이은 소문자 단어
        modelRoute:
          $ref: '#/components/schemas/ModelRoute'
        modelId:
          type: string
          maxLength: 200
          pattern: '^\S(.*\S)?$'
          description: Model identifier, no leading or trailing space / 모델 id, 앞뒤 공백 없음
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: Name shown for the agent member (a label, not part of the identity) / 에이전트 회원에 보이는 이름(표지일 뿐 식별에 쓰지 않는다)
    AgentDto:
      type: object
      required: [agentId, displayName, personaKey, modelRoute, modelId, status, ownerMemberId]
      properties:
        agentId:
          type: integer
          format: int64
        displayName:
          type: string
        personaKey:
          type: string
        modelRoute:
          $ref: '#/components/schemas/ModelRoute'
        modelId:
          type: string
        status:
          type: string
          enum: [ACTIVE, RETIRED]
        ownerMemberId:
          type: integer
          format: int64
          description: |-
            The member that owns the agent. A runner on a subscription route compares it with the subscription holder before any call

            에이전트를 소유한 회원. 구독 경로의 러너는 호출 전에 구독 보유자와 비교한다
    ModelRoute:
      type: string
      enum: [OPENROUTER, CLAUDE_CLI, CODEX_CLI, OLLAMA]
    StartAgentSeasonRequest:
      type: object
      description: |-
        The fields of the human season start plus the agent's season config. Initial capital, rates and the seed are not taken from the request

        사람의 시즌 시작 필드에 에이전트의 시즌 설정을 더한 것이다. 초기 자금·요율·시드는 요청에서 받지 않는다
      required: [riskLimit, formation, config]
      properties:
        riskLimit:
          type: string
          format: decimal
          description: 'One of -0.10, -0.20, -0.30, -0.40 / -0.10, -0.20, -0.30, -0.40 중 하나'
        formation:
          $ref: '#/components/schemas/FormationDto'
        pathLength:
          type: integer
          format: int32
          default: 12
          description: 'Path length (number of turns): 12, 24 or 60. 12 when omitted / 경로 길이(턴 수) 12, 24, 60. 생략하면 12'
        leagueId:
          type: integer
          format: int64
          description: 'Enter this league (the agent must belong to the league owner). The league fixes the path; pathLength must then be omitted or equal the league''s / 이 리그에 참가한다(에이전트가 리그 소유자의 것이어야 한다). 경로는 리그가 정하므로 pathLength 는 생략하거나 리그와 같아야 한다'
        config:
          $ref: '#/components/schemas/AgentSeasonConfig'
    AgentSeasonConfig:
      type: object
      description: |-
        Settings recorded once for the season. The persona key and model route come from the agent's registration

        시즌에 한 번 기록하는 설정. 페르소나 키와 모델 경로는 에이전트 등록에서 가져온다
      required: [personaVersion, personaSha256, personaDisplayName, modelRequested, temperature, maxTokens, turnTimeoutMs,
                 promptTemplateVersion, runnerVersion, budgetCalls, budgetUsd]
      properties:
        personaVersion:
          type: integer
          format: int32
          minimum: 1
        personaSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        personaDisplayName:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^\S(.*\S)?$'
          description: |-
            Display name of the persona file, recorded with the persona version the first time it is used

            페르소나 파일의 표시 이름. 그 페르소나 버전을 처음 쓸 때 함께 기록한다
        modelRequested:
          type: string
          maxLength: 200
          pattern: '^\S(.*\S)?$'
        temperature:
          type: string
          format: decimal
          description: 0 to 2, at most 3 decimal places / 0 이상 2 이하, 소수 3자리까지
        modelSeed:
          type: [integer, 'null']
          format: int64
        maxTokens:
          type: integer
          format: int32
          minimum: 1
        turnTimeoutMs:
          type: integer
          format: int32
          minimum: 1
        promptTemplateVersion:
          type: string
          minLength: 1
          maxLength: 32
        runnerVersion:
          type: string
          minLength: 1
          maxLength: 32
        memoryVersion:
          type: [integer, 'null']
          format: int32
          minimum: 1
        budgetCalls:
          type: integer
          format: int32
          minimum: 1
        budgetUsd:
          type: string
          format: decimal
          description: Not negative, at most 8 decimal places / 0 이상, 소수 8자리까지
    AgentSeasonConfigDto:
      type: object
      description: |-
        The config a season was started with, as recorded

        시즌을 시작할 때 기록한 설정
      required: [personaKey, personaVersion, personaSha256, modelRoute, modelRequested, promptTemplateVersion,
                 runnerVersion, memoryVersion, temperature, modelSeed, maxTokens, turnTimeoutMs, budgetCalls, budgetUsd]
      properties:
        personaKey:
          type: string
        personaVersion:
          type: integer
          format: int32
          minimum: 1
        personaSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        modelRoute:
          $ref: '#/components/schemas/ModelRoute'
        modelRequested:
          type: string
        promptTemplateVersion:
          type: string
        runnerVersion:
          type: string
        memoryVersion:
          type: [integer, 'null']
          format: int32
        temperature:
          type: string
          format: decimal
        modelSeed:
          type: [integer, 'null']
          format: int64
        maxTokens:
          type: integer
          format: int32
        turnTimeoutMs:
          type: integer
          format: int32
        budgetCalls:
          type: integer
          format: int32
        budgetUsd:
          type: string
          format: decimal
    FormationDto:
      type: object
      description: |-
        Share per position (integer percent). Sum 100, goalkeeper at least 1

        포지션별 비중(정수 퍼센트). 합 100, 골키퍼 1 이상
      required: [goalkeeper, defender, midfielder, forward]
      properties:
        goalkeeper:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        defender:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        midfielder:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        forward:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
    SeasonDto:
      type: object
      description: Same body as the human season start / 사람의 시즌 시작과 같은 본문
      required: [id, status, currentTurnNo, pathLength, riskLimit, startFormation, currentFormation,
                 initialCash, cashBalance, feeRateKr, feeRateUs, fxSpreadRate, abandonedTurnNo, notStarted, leagueId]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [IN_PROGRESS, ABANDONING, FINISHED, HALTED, PAUSED, VOID]
        currentTurnNo:
          type: integer
          format: int32
        pathLength:
          type: integer
          format: int32
        riskLimit:
          type: string
          format: decimal
        startFormation:
          $ref: '#/components/schemas/FormationDto'
        currentFormation:
          $ref: '#/components/schemas/FormationDto'
        initialCash:
          type: string
          format: decimal
        cashBalance:
          type: string
          format: decimal
        feeRateKr:
          type: string
          format: decimal
        feeRateUs:
          type: string
          format: decimal
        fxSpreadRate:
          type: string
          format: decimal
        abandonedTurnNo:
          type: [integer, 'null']
          format: int32
        notStarted:
          type: boolean
        leagueId:
          type: [integer, 'null']
          format: int64
    TurnResultDto:
      type: object
      description: |-
        Values of the stored turn row and the ratios computed from them. The advance-turn response and the turn lookup have the same shape. The sum of the four shares can differ from 1 by at most 2e-8, and status and pathLength are the season's values now. targetFormation is the target at the start of that turn. Reconciliation attempt number, status, seed, path, month block, year-month and return kind are not included. feed is the feed stored for that turn and alerts are the nudge alerts stored for it. macro is the macro environment of that turn's month.

        저장한 턴 행의 값과 거기서 계산한 비율. 턴 전환 응답과 턴 조회가 같은 형이다. 비중 4개의 합은 1과 최대 2e-8 다를 수 있고, status·pathLength 는 시즌의 지금 값이다. targetFormation 은 그 턴 시작 시점의 목표다. 대사 시도 번호·상태·시드·경로·월 블록·연월·수익률 종류는 싣지 않는다. feed 는 그 턴에 저장된 피드이고 alerts 는 저장된 독려 알림이다. macro 는 그 턴의 달의 거시 환경이다
      required: [seasonId, turnNo, status, pathLength, cashBalance, holdingsValue, totalValue, goalkeeperValue,
                 defenderValue, midfielderValue, forwardValue, drawdown, previousTotalValue, valueChange, periodReturn,
                 riskLimit, riskHeadroom, riskBreached, goalkeeperWeight, defenderWeight, midfielderWeight,
                 forwardWeight, targetFormation, goalkeeperGap, defenderGap, midfielderGap, forwardGap,
                 formationDeviation, feed, alerts, macro]
      properties:
        seasonId:
          type: integer
          format: int64
          description: Season identifier / 시즌 식별자
        turnNo:
          type: integer
          format: int32
          description: |-
            The turn of this result (in the advance response, the turn just applied = the new current turn)

            이 결과의 턴(전환 응답에서는 방금 적용된 턴 = 새 현재 턴)
        status:
          $ref: '#/components/schemas/SeasonStatus'
          description: FINISHED if it was the last turn / 마지막 턴이면 FINISHED
        pathLength:
          type: integer
          format: int32
          description: Path length (number of turns) / 경로 길이(턴 수)
        cashBalance:
          type: string
          format: decimal
          description: Cash balance, whole KRW / 현금 잔액, 원 단위 정수
        holdingsValue:
          type: string
          format: decimal
          description: Holdings valuation, whole KRW / 보유 평가액, 원 단위 정수
        totalValue:
          type: string
          format: decimal
          description: Total valuation, whole KRW / 총 평가액, 원 단위 정수
        goalkeeperValue:
          type: string
          format: decimal
          description: Goalkeeper valuation (cash included), whole KRW / 골키퍼 평가액(현금 포함), 원 단위 정수
        defenderValue:
          type: string
          format: decimal
          description: Defender valuation, whole KRW / 수비수 평가액, 원 단위 정수
        midfielderValue:
          type: string
          format: decimal
          description: Midfielder valuation, whole KRW / 미드필더 평가액, 원 단위 정수
        forwardValue:
          type: string
          format: decimal
          description: Attacker valuation, whole KRW / 공격수 평가액, 원 단위 정수
        drawdown:
          type: string
          format: decimal
          description: Cumulative drawdown (0 or less), 8 decimal places / 누적 낙폭(0 이하), 소수 8자리
        previousTotalValue:
          type: string
          format: decimal
          description: Total valuation of the previous turn (initial capital at turn 1), whole KRW / 직전 턴의 총 평가액(1턴이면 초기 자금), 원 단위 정수
        valueChange:
          type: string
          format: decimal
          description: Total valuation − previous total valuation (can be negative), whole KRW / 총 평가액 − 직전 총 평가액(음수 가능), 원 단위 정수
        periodReturn:
          type: string
          format: decimal
          description: Period return = change ÷ previous total valuation, 8 decimal places / 기간 수익률 = 변화 ÷ 직전 총 평가액, 소수 8자리
        riskLimit:
          type: string
          format: decimal
          description: Risk limit (0 or less), 8 decimal places / 위험 선언(0 이하), 소수 8자리
        riskHeadroom:
          type: string
          format: decimal
          description: |-
            Room to the risk limit = drawdown − limit, 8 decimal places. 0 or more means inside the limit, negative means it was crossed

            위험 선언까지의 여유 = 낙폭 − 선언, 소수 8자리. 0 이상이면 선언 안, 음수면 넘었다
        riskBreached:
          type: boolean
          description: Whether the drawdown crossed the risk limit (drawdown < limit) / 낙폭이 위험 선언을 넘었는가(낙폭 < 선언)
        goalkeeperWeight:
          type: string
          format: decimal
          description: Goalkeeper share = valuation ÷ total valuation, 8 decimal places / 골키퍼 비중 = 평가액 ÷ 총 평가액, 소수 8자리
        defenderWeight:
          type: string
          format: decimal
          description: Defender share, 8 decimal places / 수비수 비중, 소수 8자리
        midfielderWeight:
          type: string
          format: decimal
          description: Midfielder share, 8 decimal places / 미드필더 비중, 소수 8자리
        forwardWeight:
          type: string
          format: decimal
          description: Attacker share, 8 decimal places / 공격수 비중, 소수 8자리
        targetFormation:
          $ref: '#/components/schemas/FormationDto'
        goalkeeperGap:
          type: string
          format: decimal
          description: Goalkeeper share − target (positive = more than the target), 8 decimal places / 골키퍼 비중 − 목표(양수 = 목표보다 많음), 소수 8자리
        defenderGap:
          type: string
          format: decimal
          description: Defender share − target, 8 decimal places / 수비수 비중 − 목표, 소수 8자리
        midfielderGap:
          type: string
          format: decimal
          description: Midfielder share − target, 8 decimal places / 미드필더 비중 − 목표, 소수 8자리
        forwardGap:
          type: string
          format: decimal
          description: Attacker share − target, 8 decimal places / 공격수 비중 − 목표, 소수 8자리
        formationDeviation:
          type: string
          format: decimal
          description: Formation deviation = sum of |share − target| over the positions, 8 decimal places / 포메이션 이탈 = 포지션별 |비중 − 목표|의 합, 소수 8자리
        feed:
          type: array
          description: The feed shown at this turn, in display order; empty when the turn has none / 이 턴에 보인 피드, 표시 순서. 없으면 빈 목록
          items:
            $ref: '#/components/schemas/FeedItemDto'
        alerts:
          type: array
          description: The nudge alerts shown at this turn, in display order; empty when the turn has none. Their seq numbers continue after the feed's / 이 턴에 보인 독려 알림, 표시 순서. 없으면 빈 목록. seq 는 피드 뒤에서 이어진다
          items:
            $ref: '#/components/schemas/FeedItemDto'
        macro:
          $ref: '#/components/schemas/MacroDto'
          description: Macro environment of this turn's month / 이 턴의 달의 거시 환경
    MacroDto:
      type: object
      description: |-
        Macro environment of the month applied at this turn, as stored for that month: direction and strength of four axes and four regime probabilities. Transformed values only: no indicator level and no date. A part the engine could not evaluate is null, which means no data, not neutral.

        이 턴에 적용된 달의 거시 환경(그 달에 저장된 값): 네 축의 방향·강도와 국면 확률 네 개. 변환값만 싣고 지표의 수준과 날짜는 싣지 않는다. 엔진이 평가하지 못한 부분은 null이며 중립이 아니라 자료 없음을 뜻한다
      required: [axes, probabilities]
      properties:
        axes:
          $ref: '#/components/schemas/MacroAxesDto'
          description: The four axes / 네 축
        probabilities:
          description: Regime probabilities; null when the engine did not evaluate the month / 국면 확률. 엔진이 그 달을 평가하지 않았으면 null
          oneOf:
            - $ref: '#/components/schemas/RegimeProbabilitiesDto'
            - type: 'null'
    MacroAxesDto:
      type: object
      description: |-
        The four macro axes; an axis the engine could not evaluate is null

        거시 축 네 개. 엔진이 평가하지 못한 축은 null
      required: [rate, growth, fx, sentiment]
      properties:
        rate:
          description: Rate axis; UP means rates are rising / 금리 축. 상승은 금리가 오르는 중
          oneOf:
            - $ref: '#/components/schemas/MacroAxisDto'
            - type: 'null'
        growth:
          description: Growth axis; UP means growth is improving / 성장 축. 상승은 성장이 좋아지는 중
          oneOf:
            - $ref: '#/components/schemas/MacroAxisDto'
            - type: 'null'
        fx:
          description: Exchange-rate axis; UP means the dollar is strong against the won / 환율 축. 상승은 달러 강세(원화 약세)
          oneOf:
            - $ref: '#/components/schemas/MacroAxisDto'
            - type: 'null'
        sentiment:
          description: Market sentiment axis; UP means calmer markets and more risk appetite / 심리 축. 상승은 시장이 차분하고 위험 선호가 큼
          oneOf:
            - $ref: '#/components/schemas/MacroAxisDto'
            - type: 'null'
    MacroAxisDto:
      type: object
      description: One macro axis, direction and strength / 거시 축 하나, 방향과 강도
      required: [direction, strength]
      properties:
        direction:
          $ref: '#/components/schemas/AxisDirection'
          description: |-
            Direction of the axis: UP, DOWN or NEUTRAL

            축의 방향: 상승·하락·중립
        strength:
          type: string
          format: decimal
          description: |-
            Size of the axis score, 0 or more, 8 decimal places, no unit

            축 점수의 크기, 0 이상, 소수 8자리, 단위 없음
    AxisDirection:
      type: string
      enum: [UP, DOWN, NEUTRAL]
    RegimeProbabilitiesDto:
      type: object
      description: |-
        Four regime probabilities; their sum can differ from 1 by at most 0.0002

        국면 확률 네 개. 합은 1과 최대 0.0002 다를 수 있다
      required: [p1, p2, p3, p4]
      properties:
        p1:
          type: string
          format: decimal
          description: |-
            Probability of rates down and growth down, 4 decimal places

            금리 하락·성장 둔화 확률, 소수 4자리
        p2:
          type: string
          format: decimal
          description: |-
            Probability of rates down and growth up, 4 decimal places

            금리 하락·성장 확장 확률, 소수 4자리
        p3:
          type: string
          format: decimal
          description: |-
            Probability of rates up and growth up, 4 decimal places

            금리 상승·성장 확장 확률, 소수 4자리
        p4:
          type: string
          format: decimal
          description: |-
            Probability of rates up and growth down, 4 decimal places

            금리 상승·성장 둔화 확률, 소수 4자리
    FeedItemDto:
      type: object
      description: |-
        One feed item as shown. Event cards and noise share this shape; what was a real event is revealed in the review.

        보인 그대로의 피드 항목. 사건 카드와 소음은 같은 모양이며 무엇이 실제 사건이었는지는 복기에서 공개한다.
      required: [turnNo, seq, assetId, body]
      properties:
        turnNo:
          type: integer
          format: int32
          description: Turn the item was shown in / 보인 턴
        seq:
          type: integer
          format: int32
          description: Display order within the turn, from 1 / 턴 안의 표시 순서, 1부터
        assetId:
          type: [integer, 'null']
          format: int64
          description: Asset the sentence is about, null when it names none / 문장이 다루는 종목, 없으면 null
        body:
          type: string
          description: The sentence as shown / 보인 문장
    HoldingsDto:
      type: object
      description: |-
        Holdings of the current turn × that turn's prices (a live value that reflects this turn's trades immediately). In a turn without trades, the total, holdings valuation and valuation per position equal the turn result of that turn. currentFormation is the formation applied now. The sum of the four shares can differ from 1 by at most 2e-8. Seed, path, month block, year-month and return kind are not included.

        현재 턴의 보유 × 그 턴 가격(이번 턴의 매매가 바로 반영되는 실시간 값). 매매가 없는 턴이면 총액·보유 평가액·포지션별 평가액이 그 턴의 턴 결과와 같다. currentFormation 은 지금 적용 중인 포메이션이다. 비중 4개의 합은 1과 최대 2e-8 다를 수 있다. 시드·경로·월 블록·연월·수익률 종류는 싣지 않는다
      required: [seasonId, turnNo, cashBalance, holdingsValue, totalValue, goalkeeperValue, defenderValue,
                 midfielderValue, forwardValue, goalkeeperWeight, defenderWeight, midfielderWeight, forwardWeight,
                 currentFormation, goalkeeperGap, defenderGap, midfielderGap, forwardGap, formationDeviation, unrealizedPnl,
                 holdings]
      properties:
        seasonId:
          type: integer
          format: int64
          description: Season identifier / 시즌 식별자
        turnNo:
          type: integer
          format: int32
          description: The season's current turn (the turn the prices are based on) / 시즌의 현재 턴(가격 기준 턴)
        cashBalance:
          type: string
          format: decimal
          description: Cash balance (now), whole KRW / 현금 잔액(지금), 원 단위 정수
        holdingsValue:
          type: string
          format: decimal
          description: Holdings valuation = Σ quantity × current turn price, whole KRW / 보유 평가액 = Σ 수량 × 현재 턴 가격, 원 단위 정수
        totalValue:
          type: string
          format: decimal
          description: Total valuation = cash + holdings valuation, whole KRW / 총 평가액 = 현금 + 보유 평가액, 원 단위 정수
        goalkeeperValue:
          type: string
          format: decimal
          description: Goalkeeper valuation (cash included, total − the other three), whole KRW / 골키퍼 평가액(현금 포함, 총액 − 나머지 셋), 원 단위 정수
        defenderValue:
          type: string
          format: decimal
          description: Defender valuation, whole KRW / 수비수 평가액, 원 단위 정수
        midfielderValue:
          type: string
          format: decimal
          description: Midfielder valuation, whole KRW / 미드필더 평가액, 원 단위 정수
        forwardValue:
          type: string
          format: decimal
          description: Attacker valuation, whole KRW / 공격수 평가액, 원 단위 정수
        goalkeeperWeight:
          type: string
          format: decimal
          description: Goalkeeper share = valuation ÷ total valuation, 8 decimal places / 골키퍼 비중 = 평가액 ÷ 총 평가액, 소수 8자리
        defenderWeight:
          type: string
          format: decimal
          description: Defender share, 8 decimal places / 수비수 비중, 소수 8자리
        midfielderWeight:
          type: string
          format: decimal
          description: Midfielder share, 8 decimal places / 미드필더 비중, 소수 8자리
        forwardWeight:
          type: string
          format: decimal
          description: Attacker share, 8 decimal places / 공격수 비중, 소수 8자리
        currentFormation:
          $ref: '#/components/schemas/FormationDto'
        goalkeeperGap:
          type: string
          format: decimal
          description: Goalkeeper share − current formation (positive = more than the target), 8 decimal places / 골키퍼 비중 − 현재 포메이션(양수 = 목표보다 많음), 소수 8자리
        defenderGap:
          type: string
          format: decimal
          description: Defender share − current formation, 8 decimal places / 수비수 비중 − 현재 포메이션, 소수 8자리
        midfielderGap:
          type: string
          format: decimal
          description: Midfielder share − current formation, 8 decimal places / 미드필더 비중 − 현재 포메이션, 소수 8자리
        forwardGap:
          type: string
          format: decimal
          description: Attacker share − current formation, 8 decimal places / 공격수 비중 − 현재 포메이션, 소수 8자리
        formationDeviation:
          type: string
          format: decimal
          description: |-
            Formation deviation = sum of |share − current formation| over the positions, 8 decimal places

            포메이션 이탈 = 포지션별 |비중 − 현재 포메이션|의 합, 소수 8자리
        unrealizedPnl:
          type: string
          format: decimal
          description: Total unrealised P&L of all holdings = holdings valuation − Σ quantity × average cost (fees and FX cost excluded; future sell fee and tax not deducted), rounded once, whole KRW. Cash is not part of it. Display only. The per-holding values can differ from this total by a few won / 전체 평가손익 = 보유 평가액 − Σ 수량 × 평균단가(수수료·환전 비용 제외, 앞으로의 매도 수수료·세금은 빼지 않음), 한 번 반올림, 원 단위 정수. 현금은 포함하지 않는다. 표시용. 종목별 값의 합과 몇 원 다를 수 있다
        holdings:
          type: array
          description: Holdings with quantity 1 or more (ascending asset number) / 수량 1 이상인 보유(종목 번호 오름차순)
          items:
            $ref: '#/components/schemas/HoldingDto'
    HoldingDto:
      type: object
      description: |-
        One held asset. The asset name is not included — link it by assetId from the pool response

        보유 한 종목. 종목 이름은 싣지 않는다 — 풀 응답의 assetId 로 잇는다
      required: [assetId, quantity, avgPrice, declaredPosition, price, value, weight, unrealizedPnl, unrealizedReturn]
      properties:
        assetId:
          type: integer
          format: int64
          description: Asset identifier (the same as assetId in the pool response) / 종목 식별자(풀 응답의 assetId 와 같다)
        quantity:
          type: integer
          format: int32
          description: Quantity held (1 or more) / 보유 수량(1 이상)
        avgPrice:
          type: string
          format: decimal
          description: Average cost (fee excluded), 4 decimal places / 평균단가(수수료 제외), 소수 4자리
        declaredPosition:
          $ref: '#/components/schemas/Position'
          description: Declared position of the open span / 열린 구간의 선언 포지션
        price:
          type: string
          format: decimal
          description: Current turn price, whole KRW / 현재 턴 가격, 원 단위 정수
        value:
          type: string
          format: decimal
          description: Valuation = quantity × current turn price, whole KRW / 평가액 = 수량 × 현재 턴 가격, 원 단위 정수
        weight:
          type: string
          format: decimal
          description: Asset share = valuation ÷ total valuation (cash included), 8 decimal places / 종목 비중 = 평가액 ÷ 총 평가액(현금 포함), 소수 8자리
        unrealizedPnl:
          type: string
          format: decimal
          description: Unrealised P&L = valuation − quantity × average cost (fees and FX cost excluded; future sell fee and tax not deducted), rounded once, whole KRW (negative = loss). Display only. The per-holding values can differ from the total by a few won / 평가손익 = 평가액 − 수량 × 평균단가(수수료·환전 비용 제외, 앞으로의 매도 수수료·세금은 빼지 않음), 한 번 반올림, 원 단위 정수(음수 = 손실). 표시용. 종목별 값의 합이 전체 값과 몇 원 다를 수 있다
        unrealizedReturn:
          type: string
          format: decimal
          description: Unrealised return = unrealised P&L ÷ (quantity × average cost), 8 decimal places (−0.1 = −10%). Display only / 평가수익률 = 평가손익 ÷ (수량 × 평균단가), 소수 8자리(−0.1 = −10%). 표시용
    TurnPricesDto:
      type: object
      description: Prices of the whole pool for one turn (ascending asset number) / 한 턴의 풀 전체 가격(종목 번호 오름차순)
      required: [turnNo, prices]
      properties:
        turnNo:
          type: integer
          format: int32
        prices:
          type: array
          items:
            $ref: '#/components/schemas/TurnPriceDto'
    TurnPriceDto:
      type: object
      required: [assetId, price]
      properties:
        assetId:
          type: integer
          format: int64
          description: Asset identifier (the same as assetId in the pool response) / 종목 식별자(풀 응답의 assetId 와 같다)
        price:
          type: string
          format: decimal
          description: Price, whole KRW / 가격, 원 단위 정수
    PoolAssetDto:
      type: object
      required: [assetId, market, ticker, name, assetType, returnBasis, proxyIndexName,
                 groupId, groupName, groupKind, systemPosition,
                 upParticipation, downParticipation, volatility, maxDrawdown]
      properties:
        assetId:
          type: integer
          format: int64
          description: Asset identifier (used in order requests). Not shown to the player / 종목 식별자(주문 요청에 쓴다). 표시하지 않는다
        market:
          $ref: '#/components/schemas/Market'
        ticker:
          type: string
        name:
          type: string
        assetType:
          $ref: '#/components/schemas/AssetType'
        returnBasis:
          $ref: '#/components/schemas/ReturnBasis'
        proxyIndexName:
          type: [string, 'null']
          description: Generic name of the index that fills the months without an actual return, for any asset that has proxy months (ETF or stock) / 실제 수익률이 없는 달을 채우는 대체 지수의 일반 이름(대체 달이 있는 ETF·개별 주식)
        groupId:
          type: integer
          format: int64
        groupName:
          type: string
        groupKind:
          $ref: '#/components/schemas/AssetGroupKind'
        systemPosition:
          $ref: '#/components/schemas/Position'
        upParticipation:
          type: string
          format: decimal
          description: Up-market participation rate (months the market rose 1% or more, in KRW) / 상승장 참여율(시장이 1% 이상 오른 달, 원화)
        downParticipation:
          type: string
          format: decimal
          description: Down-market participation rate (months the market fell 1% or more, in KRW) / 하락장 참여율(시장이 1% 이상 빠진 달, 원화)
        volatility:
          type: string
          format: decimal
          description: Sample standard deviation of monthly returns (not annualized) / 월 수익률 표본 표준편차(연율화 안 함)
        maxDrawdown:
          type: string
          format: decimal
          description: Maximum drawdown, 0 or less (−0.35 = −35%) / 최대 낙폭, 0 이하(−0.35 = −35%)
    SeasonStatus:
      type: string
      enum: [IN_PROGRESS, ABANDONING, FINISHED, HALTED, PAUSED, VOID]
    Market:
      type: string
      enum: [KR, US]
    AssetType:
      type: string
      enum: [STOCK, ETF]
    ReturnBasis:
      type: string
      enum: [PRICE, TOTAL]
    AssetGroupKind:
      type: string
      enum: [SECTOR, ASSET_CLASS]
    Position:
      type: string
      enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD_TARGET, FORWARD_BREAKOUT, FORWARD_DEFENSIVE]
    OrderSide:
      type: string
      enum: [BUY, SELL]
    AgentTurnViewDto:
      type: object
      description: |-
        The turn screen of an agent. season, lastTurn, holdings, prices and pool have the shapes of the human endpoints; agent is the agent-only part. Nothing the human turn screen does not show is added

        에이전트의 턴 화면. season·lastTurn·holdings·prices·pool 은 사람 조회와 같은 형이고 agent 는 에이전트 전용 몫이다. 사람의 턴 화면에 없는 것은 더하지 않는다
      required: [season, lastTurn, holdings, prices, pool, agent]
      properties:
        season:
          $ref: '#/components/schemas/SeasonDto'
        lastTurn:
          description: Result of the current turn; null at turn 0 / 현재 턴의 결과, 0턴이면 null
          oneOf:
            - $ref: '#/components/schemas/TurnResultDto'
            - type: 'null'
        holdings:
          $ref: '#/components/schemas/HoldingsDto'
        prices:
          $ref: '#/components/schemas/TurnPricesDto'
        pool:
          type: array
          items:
            $ref: '#/components/schemas/PoolAssetDto'
        agent:
          $ref: '#/components/schemas/AgentPartDto'
    AgentPartDto:
      type: object
      required: [schema, recentTrades, lastRejects, memory]
      properties:
        schema:
          type: string
          enum: [turn-decision/1]
          description: Reply format to answer in / 답할 응답 형식
        recentTrades:
          type: array
          description: Own fills of the last turns before the current one, oldest first / 현재 턴 이전 몇 턴의 본인 체결, 오래된 것부터
          items:
            $ref: '#/components/schemas/RecentTradeDto'
        lastRejects:
          type: array
          description: Units the engine rejected in the previous turn's decision; empty at turn 0 / 직전 턴 결정에서 엔진이 거부한 단위, 0턴이면 빈 목록
          items:
            $ref: '#/components/schemas/RejectDto'
        memory:
          description: |-
            The memory version this season was pinned to at its start (its operating note and the reflections that made that version and the two before it), the same at every turn even after a newer version is written; null when the season pinned none

            이 시즌이 시작할 때 고정한 메모리 버전(그 버전의 운용 노트와 그 버전과 앞선 두 버전을 만든 복기). 새 버전이 쓰여도 모든 턴에서 같다. 고정한 것이 없으면 null
          oneOf:
            - $ref: '#/components/schemas/AgentMemoryDto'
            - type: 'null'
    RecentTradeDto:
      type: object
      required: [turnNo, side, asset, quantity, price, fee, source]
      properties:
        turnNo:
          type: integer
          format: int32
        side:
          $ref: '#/components/schemas/OrderSide'
        asset:
          type: string
          pattern: '^(KR|US):[A-Z0-9.]{1,12}$'
          description: MARKET:TICKER / 시장:종목코드
        quantity:
          type: integer
          format: int32
        price:
          type: string
          format: decimal
          description: Fill price (that turn's price), whole KRW / 체결가(그 턴 가격), 원 단위 정수
        fee:
          type: string
          format: decimal
          description: Fee, whole KRW / 수수료, 원 단위 정수
        source:
          $ref: '#/components/schemas/OrderSource'
    RejectDto:
      type: object
      description: |-
        One part of the previous decision that the engine rejected. Never model text: unit, code and pointer come from fixed sets or plain names. A unit reject has a unit (and an index for ORDER) and no pointer. A reply-level reject, such as a reply that failed the format check, has no unit and no index; its code is SCHEMA_INVALID and the pointer says where in the reply the fault is

        엔진이 거부한 직전 결정의 한 부분. 모델 문장이 아니다: unit·code·pointer 는 정해진 집합이나 평범한 이름이다. 단위 거부는 unit(ORDER 면 index)이 있고 pointer 가 없다. 응답 전체에 대한 거부(예: 형식 검사 실패)는 unit·index 가 없고 code 는 SCHEMA_INVALID, pointer 가 응답 안의 위치를 말한다
      required: [unit, index, code, pointer]
      properties:
        unit:
          type: [string, 'null']
          enum: [FORMATION, ORDER, THESES, null]
        index:
          type: [integer, 'null']
          format: int32
          minimum: 0
          maximum: 39
          description: Position in the reply's orders array, for ORDER only / 응답 orders 배열의 위치, ORDER 에만
        code:
          type: string
          pattern: '^[A-Z][A-Z_]{0,39}$'
          description: Reject code recorded by the engine / 엔진이 기록한 거부 코드
        pointer:
          type: [string, 'null']
          pattern: '^(/[A-Za-z0-9_]{1,40}){1,6}$'
          description: Where in the reply the fault is, for a reply-level reject only / 응답 안의 위치, 응답 전체 거부에만
    OrderSource:
      type: string
      enum: [RANKING, FEED, ALERT, BENCH, DIRECT]
    AbandonSeasonRequest:
      type: object
      description: |-
        The current turn the member saw is checked only while the season is in progress

        회원이 본 현재 턴은 시즌이 진행 중일 때만 확인한다
      required: [expectedTurnNo]
      properties:
        expectedTurnNo:
          type: integer
          format: int32
          minimum: 0
          description: The current turn the member saw. 409 TURN_MISMATCH if the season is in progress at another turn; ignored when the abandon was already marked (repeat) / 회원이 본 현재 턴. 진행 중인 시즌의 현재 턴과 다르면 409 TURN_MISMATCH, 이미 포기가 표시된 시즌의 반복 요청에서는 무시한다
    AbandonResultDto:
      type: object
      description: |-
        State of the season after this abandon request; repeat the request while the status is ABANDONING

        이번 포기 요청 뒤 시즌의 상태. 상태가 ABANDONING 이면 같은 요청을 반복한다
      required: [seasonId, status, currentTurnNo, pathLength, abandonedTurnNo, notStarted, advancedTurns, remainingTurns]
      properties:
        seasonId:
          type: integer
          format: int64
          description: Season identifier / 시즌 식별자
        status:
          $ref: '#/components/schemas/SeasonStatus'
          description: ABANDONING (more turns remain) or FINISHED / ABANDONING(남은 턴이 있다) 또는 FINISHED
        currentTurnNo:
          type: integer
          format: int32
          description: Current turn now / 지금의 현재 턴
        pathLength:
          type: integer
          format: int32
          description: Path length (number of turns) / 경로 길이(턴 수)
        abandonedTurnNo:
          type: integer
          format: int32
          description: The turn at which the season was abandoned / 포기한 턴
        notStarted:
          type: boolean
          description: True for a human member who abandoned before turn 3 (derived from the abandon turn and the member kind) / 사람 회원이 3턴 전에 포기하면 true(포기 턴과 회원 종류에서 계산)
        advancedTurns:
          type: integer
          format: int32
          description: Auto turns this request advanced / 이번 요청이 진행한 자동 턴 수
        remainingTurns:
          type: integer
          format: int32
          description: 'Turns still to run: pathLength - currentTurnNo / 남은 턴: pathLength - currentTurnNo'
    VoidSeasonRequest:
      type: object
      description: |-
        The defect record of a void season. The note holds no key, prompt or model reply

        무효 시즌의 결함 기록. 메모에는 키·프롬프트·모델 응답을 싣지 않는다
      required: [reason, note]
      properties:
        reason:
          $ref: '#/components/schemas/VoidReason'
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: What failed, in the runner's own words (not blank) / 무엇이 실패했는지 러너의 말로(공백 불가)
    VoidReason:
      type: string
      enum: [MODEL_GONE, ENGINE_DEFECT, RUNNER_DEFECT]
    AdvanceTurnRequest:
      type: object
      required: [expectedTurnNo]
      properties:
        expectedTurnNo:
          type: integer
          format: int32
          minimum: 0
          description: The current turn before the advance; 409 if it differs / 전환 전의 현재 턴, 다르면 409
    CallsRequest:
      type: object
      required: [calls]
      properties:
        calls:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/CallRecordRequest'
    DecisionRequest:
      type: object
      description: |-
        The runner's verdict, the reply and the calls of the turn. decision is a turn-decision/1 object and is present exactly when outcome is DECISION. The last call is the final one: its status must fit the outcome (DECISION needs OK; INVALID needs OK or INVALID; NO_RESPONSE needs a status other than OK and INVALID)

        러너의 판정, 응답, 그 턴의 호출. decision 은 turn-decision/1 객체이며 outcome 이 DECISION 일 때만 있다. 마지막 호출이 최종 호출이고 그 상태는 결과와 맞아야 한다(DECISION 은 OK, INVALID 는 OK 또는 INVALID, NO_RESPONSE 는 OK·INVALID 가 아닌 상태)
      required: [outcome, decision, calls]
      properties:
        outcome:
          $ref: '#/components/schemas/DecisionOutcome'
        decision:
          description: The reply as a turn-decision/1 object (docs/api/turn-decision-1.schema.json); null unless outcome is DECISION / turn-decision/1 객체 응답, outcome 이 DECISION 이 아니면 null
          type: [object, 'null']
        calls:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/CallRecordRequest'
    CallRecordRequest:
      type: object
      description: |-
        One model call (an attempt) as the runner made it. Attempt numbers follow one another; texts are stored as sent and received (at most 256 KiB each, no secret-looking strings)

        러너가 한 모델 호출(시도) 하나. 시도 번호는 이어지고, 원문은 보낸 그대로 저장한다(각 256 KiB 이하, 비밀값처럼 보이는 문자열 금지)
      required: [attemptNo, kind, status, modelRequested, requestText, latencyMs]
      properties:
        attemptNo:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        kind:
          type: string
          enum: [TURN_DECISION, REFLECTION, PLAYBOOK]
          description: TURN_DECISION on the turn operations; REFLECTION or PLAYBOOK on the memory submit / 턴 연산에서는 TURN_DECISION, 기억 제출에서는 REFLECTION 또는 PLAYBOOK
        ledgerCallId:
          type: [string, 'null']
          format: uuid
          description: Call id of the account-wide call ledger; required on an OPENROUTER season / 계정 전체 호출 장부의 호출 번호, OPENROUTER 시즌에서는 필수
        status:
          $ref: '#/components/schemas/AgentCallStatus'
        httpStatus:
          type: [integer, 'null']
          format: int32
          minimum: 100
          maximum: 599
        modelRequested:
          type: string
          maxLength: 200
          description: Must equal the model of the season config / 시즌 설정의 모델과 같아야 한다
        modelActual:
          type: [string, 'null']
          maxLength: 200
        provider:
          type: [string, 'null']
          maxLength: 100
        requestText:
          type: string
        responseText:
          type: [string, 'null']
        tokensIn:
          type: [integer, 'null']
          format: int32
          minimum: 0
        tokensOut:
          type: [integer, 'null']
          format: int32
          minimum: 0
        costUsd:
          type: [string, 'null']
          format: decimal
          description: Cost in USD as a decimal string, up to 8 decimals / USD 비용, 소수 8자리까지의 십진 문자열
        latencyMs:
          type: integer
          format: int32
          minimum: 0
    AgentCallStatus:
      type: string
      enum: [OK, UPSTREAM, TIMEOUT, LIMITED, POLICY_REFUSED, ERROR, INVALID]
    DecisionOutcome:
      type: string
      enum: [DECISION, NO_RESPONSE, INVALID]
    UnitStatus:
      type: string
      enum: [APPLIED, REJECTED, NONE]
    DecisionResultDto:
      type: object
      description: |-
        What the engine did with each unit. Unit rejects are results, not errors. A formation change that is rejected leaves the old formation, and the orders of that turn are then not linked to it

        엔진이 단위마다 한 일. 단위 거부는 오류가 아니라 결과다. 거부된 전술 변경은 이전 포메이션을 그대로 두고, 그 턴의 주문은 그 변경에 묶이지 않는다
      required: [seasonId, turnNo, outcome, replayed, formationChange, orders, theses, schemaViolations]
      properties:
        seasonId:
          type: integer
          format: int64
        turnNo:
          type: integer
          format: int32
        outcome:
          $ref: '#/components/schemas/DecisionOutcome'
        replayed:
          type: boolean
          description: True when the stored result of an earlier identical submit is returned / 앞서 낸 같은 결정의 저장된 결과이면 true
        formationChange:
          $ref: '#/components/schemas/FormationResultDto'
        orders:
          type: array
          description: One entry per order of the reply, in the reply's order / 응답의 주문마다 하나, 응답 순서대로
          items:
            $ref: '#/components/schemas/OrderUnitResultDto'
        theses:
          $ref: '#/components/schemas/ThesesResultDto'
        schemaViolations:
          type: array
          description: Where the reply broke the shape when the outcome is INVALID; empty otherwise / 결과가 INVALID 일 때 응답이 모양을 어긴 곳, 아니면 빈 목록
          items:
            $ref: '#/components/schemas/SchemaViolationDto'
    FormationResultDto:
      type: object
      required: [status, code, formationChangeId]
      properties:
        status:
          $ref: '#/components/schemas/UnitStatus'
        code:
          type: [string, 'null']
          description: Reject code when REJECTED / 거부일 때의 코드
          enum: [TURN_ZERO_FORMATION, FORMATION_UNCHANGED, FORMATION_INVALID, null]
        formationChangeId:
          type: [integer, 'null']
          format: int64
    OrderUnitResultDto:
      type: object
      required: [index, status, code, orderId]
      properties:
        index:
          type: integer
          format: int32
          minimum: 0
        status:
          $ref: '#/components/schemas/UnitStatus'
        code:
          type: [string, 'null']
          description: Reject code when REJECTED / 거부일 때의 코드
          enum: [ASSET_NOT_IN_POOL, QUANTITY_INVALID, INSUFFICIENT_HOLDING, INSUFFICIENT_CASH, SINGLE_ASSET_LIMIT, POSITION_REQUIRED, POSITION_CONFLICT, POSITION_ON_SELL, SOURCE_NOT_VISIBLE, SOURCE_NOT_ALLOWED, null]
        orderId:
          type: [integer, 'null']
          format: int64
    ThesesResultDto:
      type: object
      required: [status, code]
      properties:
        status:
          $ref: '#/components/schemas/UnitStatus'
        code:
          type: [string, 'null']
          enum: [THESES_NOT_SUPPORTED, null]
    SchemaViolationDto:
      type: object
      description: |-
        Where the reply broke the shape: a JSON pointer and the schema keyword. It never carries the offending value or a key chosen by the model

        응답이 모양을 어긴 곳: JSON 포인터와 스키마 키워드. 어긴 값이나 모델이 고른 키는 싣지 않는다
      required: [pointer, keyword]
      properties:
        pointer:
          type: string
        keyword:
          type: string
          enum: [type, required, additionalProperties, const, enum, pattern, maxLength, maxItems, minimum, maximum]
    CreateLeagueRequest:
      type: object
      description: |-
        The seed, base date and money settings are not taken from the request

        시드·기준일·돈 설정은 요청에서 받지 않는다
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        pathLength:
          type: integer
          format: int32
          default: 12
          description: 'Path length (number of turns): 12, 24 or 60. 12 when omitted / 경로 길이(턴 수) 12, 24, 60. 생략하면 12'
        maxEntries:
          type: integer
          format: int32
          minimum: 2
          maximum: 20
          default: 8
        sameSeedAs:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: |-
            Root league of an earlier same-seed group: the new league (a sibling) plays that group's seed and settings; pathLength, if given, must equal the root's, and maxEntries defaults to the root's. The root must be a root (not itself a sibling) and still OPEN. The seed is not returned

            먼저 만든 같은 시드 묶음의 뿌리 리그. 새 리그(형제)는 그 묶음의 시드와 설정을 그대로 쓴다. pathLength 는 주면 뿌리와 같아야 하고 maxEntries 를 생략하면 뿌리 값이다. 형제가 아닌 뿌리 리그여야 하며 아직 OPEN 이어야 한다. 시드는 돌려주지 않는다
    LeagueDto:
      type: object
      required: [id, name, status, pathLength, maxEntries, entries]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          enum: [OPEN, CLOSED]
        pathLength:
          type: integer
          format: int32
        maxEntries:
          type: integer
          format: int32
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeagueEntryDto'
    LeagueEntryDto:
      type: object
      required: [memberId, memberKind, displayName, seasonId, status, currentTurnNo]
      properties:
        memberId:
          type: integer
          format: int64
        memberKind:
          type: string
          enum: [HUMAN, AGENT]
        displayName:
          type: string
        seasonId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SeasonStatus'
        currentTurnNo:
          type: integer
          format: int32
    AgentMemoryStateDto:
      type: object
      required: [latestVersion, pendingSeasonIds, heldSeasonCount]
      properties:
        latestVersion:
          type: [integer, 'null']
          format: int32
          minimum: 1
          description: Latest memory version; null when the agent has none / 최신 메모리 버전, 없으면 null
        pendingSeasonIds:
          type: array
          description: Finished, eligible seasons without an outcome whose review is released, in finish order / 결과가 없는 끝난 시즌 중 복기가 공개된 것, 끝난 순서대로
          items:
            type: integer
            format: int64
        heldSeasonCount:
          type: integer
          format: int32
          minimum: 0
          description: Such seasons an open league or group still holds back / 열린 리그나 묶음이 아직 붙들고 있는 같은 종류의 시즌 수
    AgentMemoryDto:
      type: object
      description: |-
        The memory a season pinned to one version reads: the operating note of that version and the reflections that made that version and the two before it

        한 버전에 고정한 시즌이 읽는 기억: 그 버전의 운용 노트와 그 버전과 앞선 두 버전을 만든 복기
      required: [version, playbook, reflections]
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
        playbook:
          type: array
          description: Rules of the operating note (operating-note/1), each at most 150 characters / 운용 노트(operating-note/1)의 규칙, 각각 150자 이하
          minItems: 1
          maxItems: 15
          items:
            type: string
        reflections:
          type: array
          description: season-reflection/1 bodies (docs/api/season-reflection-1.schema.json), oldest first, at most 3 / season-reflection/1 본문, 오래된 것부터 최대 3개
          maxItems: 3
          items:
            type: object
    MemoryComparisonDto:
      type: object
      description: |-
        Two memory versions of one agent on the same seeds, from stored results of closed same-seed groups. No seed, date, month block or league number

        같은 시드에서 한 에이전트의 두 메모리 버전. 닫힌 같은 시드 묶음의 저장된 결과이며 시드·날짜·달 블록·리그 번호는 없다
      required: [versionA, versionB, groups, summary]
      properties:
        versionA:
          type: integer
          format: int32
          minimum: 0
        versionB:
          type: integer
          format: int32
          minimum: 0
        groups:
          type: array
          description: One row per closed group, in group creation order / 닫힌 묶음마다 한 줄, 묶음을 만든 순서
          items:
            $ref: '#/components/schemas/MemoryComparisonGroupDto'
        summary:
          $ref: '#/components/schemas/MemoryComparisonSummaryDto'
    MemoryComparisonGroupDto:
      type: object
      required: [groupLabel, a, b]
      properties:
        groupLabel:
          type: string
          pattern: '^G[1-9][0-9]*$'
          description: G1, G2, ... in group creation order; not a league number / 묶음을 만든 순서의 G1, G2, ... 리그 번호가 아니다
        a:
          $ref: '#/components/schemas/MemoryComparisonSideDto'
        b:
          $ref: '#/components/schemas/MemoryComparisonSideDto'
    MemoryComparisonSideDto:
      type: object
      required: [memoryVersion, personaVersion, valuationMultiple, score, failedTurns, experiencedSeed]
      properties:
        memoryVersion:
          type: [integer, 'null']
          format: int32
          minimum: 1
          description: Memory version the season was pinned to; null = none / 시즌이 고정한 메모리 버전, 없으면 null
        personaVersion:
          type: integer
          format: int32
          minimum: 1
          description: Persona version the season was pinned to, so a persona change between the two sides is visible / 시즌이 고정한 페르소나 버전. 두 쪽 사이에 페르소나가 바뀌었는지 보인다
        valuationMultiple:
          type: string
          format: decimal
          description: Final valuation divided by initial capital, 8 decimal places / 최종 평가액 ÷ 초기 자금, 소수 8자리
        score:
          description: The stored season score with its nine process items; null while no score is stored / 저장된 시즌 점수와 과정 항목 아홉 개, 저장된 점수가 없으면 null
          oneOf:
            - $ref: '#/components/schemas/SeasonScoreDto'
            - type: 'null'
        failedTurns:
          type: integer
          format: int32
          minimum: 0
          description: Turns whose final call gave no usable decision / 마지막 호출이 쓸 수 있는 결정을 내지 못한 턴 수
        experiencedSeed:
          type: boolean
          description: True when the agent met this seed in a season outside the group; should stay false on held-out seeds / 에이전트가 묶음 밖 시즌에서 이 시드를 만났으면 true. 따로 둔 시드에서는 false여야 한다
    MemoryComparisonSummaryDto:
      type: object
      required: [groups, bWins, anecdotal, meanDiff]
      properties:
        groups:
          type: integer
          format: int32
          minimum: 0
        bWins:
          type: integer
          format: int32
          minimum: 0
          description: Groups where B's valuation multiple is strictly above A's / B의 평가 배수가 A보다 엄격히 높은 묶음 수
        anecdotal:
          type: boolean
          description: True under 5 groups; the numbers say little / 묶음이 5개 미만이면 true. 숫자가 말해 주는 것이 적다
        meanDiff:
          description: Mean of B minus A over the groups that have both values; null without a row / 두 값이 다 있는 묶음의 B 빼기 A 평균, 줄이 없으면 null
          oneOf:
            - $ref: '#/components/schemas/MemoryComparisonMeanDiffDto'
            - type: 'null'
    MemoryComparisonMeanDiffDto:
      type: object
      required: [valuationMultiple, score, resultScore, processScore, items]
      properties:
        valuationMultiple:
          type: [string, 'null']
          format: decimal
          description: 8 decimal places / 소수 8자리
        score:
          type: [string, 'null']
          format: decimal
          description: 2 decimal places / 소수 2자리
        resultScore:
          type: [string, 'null']
          format: decimal
          description: 2 decimal places / 소수 2자리
        processScore:
          type: [string, 'null']
          format: decimal
          description: 2 decimal places / 소수 2자리
        items:
          description: Differences (B minus A) per process item; they can be negative and are not 0-100 scores / 과정 항목별 차이(B 빼기 A). 음수일 수 있고 0~100 점수가 아니다
          allOf:
            - $ref: '#/components/schemas/SeasonScoreItemsDto'
    AgentMemoryVersionDto:
      type: object
      required: [memory, playbookCarried, createdAt]
      properties:
        memory:
          $ref: '#/components/schemas/AgentMemoryDto'
        playbookCarried:
          type: boolean
          description: True when the rewrite failed and the note of the version before was kept / 다시 쓰기에 실패해 앞 버전의 노트를 그대로 둔 경우 true
        createdAt:
          type: string
          format: date-time
    ReflectionViewDto:
      type: object
      description: |-
        What an agent sees of a finished season to write its reflection. No date, month, event name, seed, price or feed text

        에이전트가 복기를 쓰려고 끝난 시즌에서 보는 것. 날짜·달·사건 이름·시드·가격·피드 문장은 없다
      required: [baseVersion, basePlaybook, pathLength, report, score, turns]
      properties:
        baseVersion:
          type: [integer, 'null']
          format: int32
          minimum: 1
          description: The latest memory version the new one is built on; null for the first / 새 버전의 바탕이 되는 최신 메모리 버전, 첫 번째면 null
        basePlaybook:
          type: array
          description: Rules of the base operating note; empty without a base / 기준 운용 노트의 규칙, 기준이 없으면 빈 목록
          items:
            type: string
        pathLength:
          type: integer
          format: int32
        report:
          $ref: '#/components/schemas/SeasonReportDto'
        score:
          $ref: '#/components/schemas/SeasonScoreDto'
        turns:
          type: array
          description: Decision turns 0 to pathLength - 1, in order / 결정 턴 0부터 pathLength - 1 까지, 순서대로
          items:
            $ref: '#/components/schemas/ReflectionTurnDto'
    ReflectionTurnDto:
      type: object
      required: [turnNo, label, reason, fills, rejects, cited]
      properties:
        turnNo:
          type: integer
          format: int32
          minimum: 0
        label:
          type: string
          pattern: '^[1-9][0-9]*년차 ([1-9]|1[0-2])월$'
          description: Relative label, year of play and month of that year from the start; not a calendar date / 상대 라벨, 시작부터 센 해와 그 해의 달. 달력 날짜가 아니다
        reason:
          type: [string, 'null']
          description: The agent's own stated reason for the turn; null when it made no usable decision / 에이전트가 그 턴에 적은 이유, 쓸 수 있는 결정이 없으면 null
        fills:
          type: array
          items:
            $ref: '#/components/schemas/ReflectionFillDto'
        rejects:
          type: array
          description: Units the engine rejected in that turn's decision / 그 턴 결정에서 엔진이 거부한 단위
          items:
            $ref: '#/components/schemas/RejectDto'
        cited:
          type: array
          description: Feed items the orders of the turn cited, by turn, display number and kind / 그 턴 주문이 인용한 피드 항목, 표시 번호와 종류
          items:
            $ref: '#/components/schemas/ReflectionCitedDto'
    ReflectionFillDto:
      type: object
      required: [asset, side, quantity]
      properties:
        asset:
          type: string
          pattern: '^(KR|US):[A-Z0-9.]{1,12}$'
          description: MARKET:TICKER / 시장:종목코드
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: integer
          format: int32
    ReflectionCitedDto:
      type: object
      required: [feedTurnNo, seq, kind]
      properties:
        feedTurnNo:
          type: integer
          format: int32
          minimum: 1
          description: Turn the feed item was shown in; an order may cite an earlier turn's item / 피드 항목이 나온 턴. 주문은 이전 턴의 항목도 인용할 수 있다
        seq:
          type: integer
          format: int32
        kind:
          type: string
          enum: [RISE, FALL, ECHO, SPREAD, FADE, EVENT, NUDGE]
    SubmitSeasonMemoryRequest:
      type: object
      description: |-
        The memory step of one finished season. ACCEPTED needs reflection and playbook and no discardCodes; DISCARDED needs discardCodes (distinct) and none of reflection, playbook, baseVersion or playbookCarried. Calls are of the kinds REFLECTION and PLAYBOOK, at most 20; ACCEPTED needs at least one REFLECTION call

        끝난 시즌 하나의 기억 단계. ACCEPTED는 reflection과 playbook이 필요하고 discardCodes가 없다. DISCARDED는 서로 다른 discardCodes가 필요하고 reflection·playbook·baseVersion·playbookCarried가 없다. 호출은 REFLECTION·PLAYBOOK 종류이며 최대 20개이고, ACCEPTED에는 REFLECTION 호출이 하나 이상 있어야 한다
      required: [baseVersion, outcome, calls]
      properties:
        baseVersion:
          type: [integer, 'null']
          format: int32
          minimum: 1
          description: The agent's latest memory version the note was written on; null when it has none (ACCEPTED) and always null with DISCARDED / 노트를 쓴 바탕인 에이전트의 최신 메모리 버전. 없으면 null(ACCEPTED), DISCARDED에서는 늘 null
        outcome:
          $ref: '#/components/schemas/ReflectionOutcome'
        reflection:
          description: The reflection as a season-reflection/1 object (docs/api/season-reflection-1.schema.json); null with DISCARDED; a value that is not an object is a 422 shape error (pointer /reflection, keyword type) / season-reflection/1 객체 복기, DISCARDED에서는 null. 객체가 아닌 값은 422 모양 오류다(포인터 /reflection, keyword type)
          type: [object, 'null']
        playbook:
          description: The rewritten operating note as an operating-note/1 object (docs/api/operating-note-1.schema.json); null with DISCARDED; a value that is not an object is a 422 shape error (pointer /playbook, keyword type) / operating-note/1 객체로 다시 쓴 운용 노트, DISCARDED에서는 null. 객체가 아닌 값은 422 모양 오류다(포인터 /playbook, keyword type)
          type: [object, 'null']
        playbookCarried:
          type: boolean
          description: True when the rewrite failed and the note is the previous version's rules (the reflection's ruleCandidates for the first version) / 다시 쓰기에 실패해 앞 버전의 규칙을 그대로 둔 노트면 true(첫 버전은 복기의 ruleCandidates)
        discardCodes:
          type: [array, 'null']
          maxItems: 9
          items:
            $ref: '#/components/schemas/MemoryDiscardCode'
        calls:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CallRecordRequest'
    ReflectionOutcome:
      type: string
      enum: [ACCEPTED, DISCARDED]
    MemoryDiscardCode:
      type: string
      description: The filter code the last attempt still broke, OVERSIZE (length cap), SCHEMA (never had the shape, or the first version's rewrite failed with no ruleCandidates to carry) or BUDGET (stopped for lack of calls) / 마지막 시도가 어긴 필터 코드, OVERSIZE(길이 상한), SCHEMA(모양이 처음부터 없음, 또는 첫 버전의 다시 쓰기가 실패했는데 이월할 ruleCandidates가 없음), BUDGET(호출이 모자라 멈춤)
      enum: [YEAR, YEAR_MONTH, EVENT_TERM, FINGERPRINT, TURN_RETURN, PRICE, OVERSIZE, SCHEMA, BUDGET]
    SubmitSeasonMemoryResultDto:
      type: object
      required: [outcome, version]
      properties:
        outcome:
          $ref: '#/components/schemas/ReflectionOutcome'
        version:
          type: [integer, 'null']
          format: int32
          minimum: 1
          description: The new memory version; null when the reflection was discarded / 새 메모리 버전. 폐기했으면 null
    MemoryRejectedProblem:
      description: A problem answer of the memory submit with the members that say where the text broke a rule. They never carry the text / 어디서 규칙을 어겼는지 알려 주는 항목이 있는 기억 제출의 오류 응답. 본문은 싣지 않는다
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            violations:
              type: array
              description: With MEMORY_SCHEMA_INVALID / MEMORY_SCHEMA_INVALID일 때
              items:
                $ref: '#/components/schemas/MemoryViolationDto'
            leaks:
              type: array
              description: With MEMORY_LEAK / MEMORY_LEAK일 때
              items:
                $ref: '#/components/schemas/MemoryLeakDto'
    MemoryViolationDto:
      type: object
      description: |-
        Where the reflection or note broke its schema: a JSON pointer that starts with /reflection or /playbook, and the schema keyword (encoding means a NUL or an unpaired surrogate). It never carries the offending value or a key chosen by the model

        복기나 노트가 스키마를 어긴 곳: /reflection 또는 /playbook으로 시작하는 JSON 포인터와 스키마 키워드(encoding은 NUL이나 짝 없는 서로게이트). 어긴 값이나 모델이 고른 키는 싣지 않는다
      required: [pointer, keyword]
      properties:
        pointer:
          type: string
        keyword:
          type: string
          enum: [type, required, additionalProperties, const, enum, minLength, maxLength, minItems, maxItems, encoding]
    MemoryLeakDto:
      type: object
      description: |-
        Where the filter memory-filter/1 hit: a pointer that starts with /reflection or /playbook (with #s<n> for the sentence) and the rule code; OVERSIZE points at the document root and means the total length cap. It never carries the text

        누출 필터 memory-filter/1이 걸린 곳: /reflection 또는 /playbook으로 시작하는 포인터(문장은 #s<n>)와 규칙 코드. OVERSIZE는 문서 루트를 가리키며 전체 길이 상한을 뜻한다. 본문은 싣지 않는다
      required: [pointer, code]
      properties:
        pointer:
          type: string
        code:
          type: string
          enum: [YEAR, YEAR_MONTH, EVENT_TERM, FINGERPRINT, TURN_RETURN, PRICE, OVERSIZE]
    SeasonReportDto:
      type: object
      description: Season report / 시즌 성적표
      required: [seasonStatus, isFinal, reportTurns, pathLength, pendingOrders, pendingChanges, initialCash, finalValue, totalReturn, monthlyVolatility, maxDrawdown, baselineFinalValue, baselineReturn, excessReturn, riskLimit, riskBreachTurns, riskBreachDepth, maxSingleWeight, tradeNotional, turnoverAnnual, formationDeviation, measuredFormationDeviation, roleFit, rolePlayersJudged, rolePlayersUnjudged, nudgeShare, nudgeSameTurnShare, totalFee, teamFee, formationChangeFee, platformNudgeFee, formationChanges, formationChangeOrders, changesWithoutOrders, reconMismatchRows, reconTurnBundles, reconManualBundles, reconOutOfRangeRows]
      properties:
        seasonStatus:
          $ref: '#/components/schemas/SeasonStatus'
          description: Season status (FINISHED, because only a finished season has a report) / 시즌 상태(끝난 시즌만 성적표를 내므로 FINISHED)
        isFinal:
          type: boolean
          description: |-
            Whether the report is final (true for a finished season; an interim report during play comes after the MVP)

            확정 여부(끝난 시즌이면 true, 진행 중 잠정 성적표는 MVP 이후)
        reportTurns:
          type: integer
          format: int32
          description: Number of reported turns = the last snapshot turn / 보고 턴 수 = 마지막 스냅샷 턴
        pathLength:
          type: integer
          format: int32
          description: Path length (number of turns) / 경로 길이(턴 수)
        pendingOrders:
          type: integer
          format: int32
          description: Pending orders of the reported turn (0 for a finished season) / 보고 턴의 보류 주문 수(끝난 시즌은 0)
        pendingChanges:
          type: integer
          format: int32
          description: Pending formation changes of the reported turn (0 for a finished season) / 보고 턴의 보류 전술 변경 수(끝난 시즌은 0)
        initialCash:
          type: string
          format: decimal
          description: Initial capital, whole KRW / 초기 자금, 원 단위 정수
        finalValue:
          type: string
          format: decimal
          description: Final total valuation, whole KRW / 최종 총 평가액, 원 단위 정수
        totalReturn:
          type: string
          format: decimal
          description: Total return = (final − initial) ÷ initial, 8 decimal places / 총 수익률 = (최종 − 초기) ÷ 초기, 소수 8자리
        monthlyVolatility:
          type: [string, null]
          format: decimal
          description: |-
            Monthly volatility = sample standard deviation of monthly returns (n − 1), not annualized, 8 decimal places. null for one turn

            월 변동성 = 월 수익률의 표본 표준편차(n − 1), 연율화하지 않음, 소수 8자리. 한 턴이면 null
        maxDrawdown:
          type: string
          format: decimal
          description: Maximum drawdown (0 or less), 8 decimal places / 최대 낙폭(0 이하), 소수 8자리
        baselineFinalValue:
          type: string
          format: decimal
          description: |-
            Final valuation of the benchmark (buy and hold of a proxy ETF for the market index), whole KRW

            기준선(시장 지수 대용 ETF 매수 후 보유)의 최종 평가액, 원 단위 정수
        baselineReturn:
          type: string
          format: decimal
          description: Benchmark return, 8 decimal places / 기준선 수익률, 소수 8자리
        excessReturn:
          type: string
          format: decimal
          description: |-
            Excess return = (final − benchmark final) ÷ initial, divided once — not the difference of two returns. 8 decimal places

            초과 수익률 = (최종 − 기준선 최종) ÷ 초기, 한 번 나눔 — 두 수익률의 차가 아니다. 소수 8자리
        riskLimit:
          type: string
          format: decimal
          description: Risk limit (0 or less), 8 decimal places / 위험 선언(0 이하), 소수 8자리
        riskBreachTurns:
          type: integer
          format: int32
          description: Number of turns where the drawdown crossed the risk limit / 낙폭이 위험 선언을 넘은 턴 수
        riskBreachDepth:
          type: string
          format: decimal
          description: Deepest excess beyond the risk limit (0 or less, 0 if never crossed), 8 decimal places / 위험 선언을 넘은 가장 깊은 정도(0 이하, 넘은 적 없으면 0), 소수 8자리
        maxSingleWeight:
          type: string
          format: decimal
          description: |-
            Maximum single-asset share = the maximum over turns of (largest asset value ÷ total valuation) (0 without holdings), 8 decimal places

            최대 단일 종목 비중 = 턴마다 (가장 큰 종목 가치 ÷ 총 평가액)의 최댓값(보유가 없으면 0), 소수 8자리
        tradeNotional:
          type: string
          format: decimal
          description: Total traded amount (fill price × quantity, turn-0 team setup excluded), whole KRW / 매매 대금 합(체결가 × 수량, 0턴 팀 구성 제외), 원 단위 정수
        turnoverAnnual:
          type: string
          format: decimal
          description: |-
            Annualized turnover = 12 × traded amount ÷ sum of per-turn total valuations, 8 decimal places

            연 환산 회전율 = 12 × 매매 대금 ÷ 턴별 총 평가액 합, 소수 8자리
        formationDeviation:
          type: string
          format: decimal
          description: |-
            Average formation deviation = exact average over turns of Σ|actual share − target share| (divided once by the common denominator), 8 decimal places. Declared positions; not scored from s63-v3 (see measuredFormationDeviation)

            포메이션 이탈 평균 = 턴마다 Σ|실제 비중 − 목표 비중|의 정확한 평균(공통 분모로 한 번 나눔), 소수 8자리. 선언 포지션 기준이며 s63-v3부터 채점하지 않음(measuredFormationDeviation 참고)
        measuredFormationDeviation:
          type: string
          format: decimal
          description: |-
            Average formation deviation on season-measured positions (the scored basis from score version s63-v3; seasons scored under s63-v1 or s63-v2 keep the declared basis): the same formula as formationDeviation, with the actual weights grouped by the position each player really played on this season's path; a player the season cannot measure counts by the base-date system judgement, never by the declaration; cash is goalkeeper. Declared positions do not enter, so relabelling cannot change it. Provisional while the season runs. 8 decimal places

            시즌 실측 포지션 기준 포메이션 이탈 평균(점수 버전 s63-v3부터 채점 기준, s63-v1·s63-v2로 채점한 시즌은 선언 기준 그대로): 식은 formationDeviation과 같고 실제 비중을 이 시즌 경로에서 선수가 실제로 한 역할로 묶는다. 시즌으로 실측할 수 없는 선수는 기준일 시스템 판정으로 세고 선언으로는 세지 않으며 현금은 골키퍼다. 선언 포지션은 들어가지 않으므로 라벨을 바꿔도 값이 달라지지 않는다. 진행 중에는 잠정, 소수 8자리
        roleFit:
          type: [string, null]
          format: decimal
          description: |-
            Role fit = the exposed value of players whose declared and measured season positions match ÷ the exposed value of measured players, 8 decimal places. null if there is no measured exposure.

            역할 수행 = 선언과 시즌 실측 포지션이 같은 선수의 노출 가치 ÷ 실측된 선수의 노출 가치, 소수 8자리. 실측된 노출이 없으면 null
        rolePlayersJudged:
          type: integer
          format: int32
          description: Number of exposed assets whose position was measured / 실측 포지션이 나온 노출 종목 수
        rolePlayersUnjudged:
          type: integer
          format: int32
          description: Number of exposed assets that could not be measured for lack of samples (counted by the base-date system judgement in measuredFormationDeviation) / 표본 부족으로 실측하지 못한 노출 종목 수(measuredFormationDeviation에서는 기준일 시스템 판정으로 센다)
        nudgeShare:
          type: [string, null]
          format: decimal
          description: |-
            Encouragement share = traded amount from trades initiated through rankings, feed and alerts ÷ traded amount, 8 decimal places. null if the traded amount is 0.

            독려 비중 = 랭킹·피드·알림에서 시작된 매매 대금 ÷ 매매 대금, 소수 8자리. 매매 대금이 0이면 null
        nudgeSameTurnShare:
          type: [string, null]
          format: decimal
          description: |-
            Same-turn encouragement share = encouraged traded amount whose ranking or feed turn equals the order turn ÷ traded amount, 8 decimal places. null if the traded amount is 0

            같은 턴 독려 비중 = 랭킹 또는 피드 턴과 주문 턴이 같은 독려 매매 대금 ÷ 매매 대금, 소수 8자리. 매매 대금이 0이면 null
        totalFee:
          type: string
          format: decimal
          description: Total fees (turn-0 team setup included), whole KRW / 수수료 합(0턴 팀 구성 포함), 원 단위 정수
        teamFee:
          type: string
          format: decimal
          description: Turn-0 team setup fees (buys and sells), whole KRW / 0턴 팀 구성 수수료(매수·매도 모두), 원 단위 정수
        formationChangeFee:
          type: string
          format: decimal
          description: Total fees of fills linked to a formation change, whole KRW / 전술 변경에 연결된 체결의 수수료 합, 원 단위 정수
        platformNudgeFee:
          type: string
          format: decimal
          description: |-
            Encouragement portion of platform revenue = fees from trades initiated through rankings and alerts, whole KRW.

            플랫폼 수익 중 독려 몫 = 랭킹·알림에서 시작된 매매의 수수료, 원 단위 정수
        formationChanges:
          type: integer
          format: int32
          description: Number of formation changes (in the report range) / 전술 변경 수(보고 범위)
        formationChangeOrders:
          type: integer
          format: int32
          description: Number of orders linked to a formation change / 전술 변경에 연결된 주문 수
        changesWithoutOrders:
          type: integer
          format: int32
          description: Number of formation changes with no linked order / 연결된 주문이 없는 전술 변경 수
        reconMismatchRows:
          type: integer
          format: int32
          description: Number of recorded reconciliation mismatch rows (recovered attempts included) / 기록된 대사 불일치 행 수(복구된 시도 포함)
        reconTurnBundles:
          type: integer
          format: int32
          description: Number of turn-advance reconciliation bundles (17 rows per turn and attempt) / 턴 전환 대사 묶음 수(턴·시도마다 17행)
        reconManualBundles:
          type: integer
          format: int32
          description: Number of manual reconciliation bundles (15 rows per turn and attempt) / 수동 대사 묶음 수(턴·시도마다 15행)
        reconOutOfRangeRows:
          type: integer
          format: int32
          description: Number of reconciliation rows for turns beyond the path length / 경로 길이를 넘는 턴의 대사 행 수
    SeasonScoreDto:
      type: object
      description: Season score / 시즌 점수
      required: [scoreVersion, score, resultScore, processScore, luckPercentile, sharpeDiffPercentile, items, processItems, countedInRating, ratingExclusion]
      properties:
        scoreVersion:
          type: string
          description: Formula version the score was computed with / 점수를 계산한 공식 버전
        score:
          type: [string, 'null']
          format: decimal
          description: |-
            Season score 0.00-100.00 = 0.5 x result + 0.5 x process; null when the season has no path distribution

            시즌 점수 0.00~100.00 = 0.5 × 결과 + 0.5 × 과정. 경로 분포가 없으면 null
        resultScore:
          type: [string, 'null']
          format: decimal
          description: |-
            Result score = 100 x the mid-rank percentile of the Sharpe difference among the engine paths of the season-start team held still; null without a distribution

            결과 점수 = 100 × (시즌 시작 팀을 그대로 보유한 엔진 경로들 안에서 샤프 차이의 중간 순위 백분위). 분포가 없으면 null
        processScore:
          type: string
          format: decimal
          description: |-
            Process score: the equal-weight mean of the item scores that have a value, 0.00-100.00 / 과정 점수: 값이 있는 항목 점수의 같은 가중 평균, 0.00~100.00
        luckPercentile:
          type: [string, 'null']
          format: decimal
          description: |-
            Where the end value of the start team, held still, sits among the engine paths, 0-1, 8 decimals; shown, not scored

            시작 팀을 그대로 보유했을 때의 최종 가치가 엔진 경로 안에서 놓이는 자리, 0~1, 소수 8자리. 보여 주기만 하고 점수에는 넣지 않는다
        sharpeDiffPercentile:
          type: [string, 'null']
          format: decimal
          description: |-
            Mid-rank percentile of the Sharpe difference among the engine paths, 0-1, 8 decimals

            샤프 차이의 경로 안 중간 순위 백분위, 0~1, 소수 8자리
        items:
          $ref: '#/components/schemas/SeasonScoreItemsDto'
          description: The nine process item scores; all nine keys are always present, null where the input does not exist yet / 과정 항목 점수 아홉 개. 키는 항상 아홉 개이고 입력이 아직 없으면 null
        processItems:
          type: integer
          format: int32
          description: How many item scores have a value (1-9) / 값이 있는 항목 점수의 수(1~9)
        countedInRating:
          type: boolean
          description: Whether the season counts in the manager rating / 시즌이 매니저 레이팅에 집계되는지
        ratingExclusion:
          oneOf:
            - $ref: '#/components/schemas/RatingExclusion'
            - type: 'null'
          description: |-
            Why the season is left out of the rating: NOT_STARTED (abandoned before turn 3 by a human) or NO_SCORE (no path distribution); null when it counts

            레이팅에서 빠진 이유: NOT_STARTED(사람이 3턴 전에 포기), NO_SCORE(경로 분포 없음). 집계되면 null
    SeasonScoreItemsDto:
      type: object
      description: Process item scores / 과정 항목 점수
      required: [risk, discipline, diversification, turnover, consistency, formation, role, noise, nudge]
      properties:
        risk:
          type: [string, 'null']
          format: decimal
        discipline:
          type: [string, 'null']
          format: decimal
        diversification:
          type: [string, 'null']
          format: decimal
        turnover:
          type: [string, 'null']
          format: decimal
        consistency:
          type: [string, 'null']
          format: decimal
        formation:
          type: [string, 'null']
          format: decimal
        role:
          type: [string, 'null']
          format: decimal
        noise:
          type: [string, 'null']
          format: decimal
        nudge:
          type: [string, 'null']
          format: decimal
    RatingExclusion:
      type: string
      enum: [NOT_STARTED, NO_SCORE]
    Problem:
      type: object
      description: RFC 9457 problem details + a top-level code / RFC 9457 문제 상세 + 최상위 code
      required: [title, status, detail, instance, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
          description: Fixed Korean sentence. It never carries the rejected value / 고정 한국어 문장. 거부된 값을 싣지 않는다
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
    FieldViolation:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
    ErrorCode:
      type: string
      enum: [INVALID_ARGUMENT, NOT_FOUND, METHOD_NOT_ALLOWED, NOT_ACCEPTABLE,
             UNSUPPORTED_MEDIA_TYPE, MALFORMED_REQUEST, INTERNAL_ERROR, POOL_NOT_LOADED, POOL_NOT_JUDGED, PATH_TOO_LONG,
             ENGINE_UNAVAILABLE, SEASON_LIMIT, TURN_NOT_REACHED, SEASON_NOT_FINISHED, SEASON_NOT_ACTIVE, TURN_MISMATCH, LEDGER_MISMATCH,
             LINEUP_MISMATCH, ASSET_NOT_IN_POOL, SOURCE_NOT_VISIBLE, INSUFFICIENT_CASH, INSUFFICIENT_HOLDING, POSITION_CONFLICT, POSITION_REQUIRED,
             INVALID_FORMATION, EVENT_TIME_CONFLICT, RECONCILIATION_FAILED, SEASON_HALTED, FORBIDDEN, EMAIL_TAKEN,
             UNAUTHENTICATED, INVALID_CREDENTIALS, AGENT_RETIRED, DECISION_CONFLICT, DECISION_MISSING,
             PERSONA_VERSION_CONFLICT, PERSONA_VERSION_STALE, LEAGUE_NOT_SETTLED, LEAGUE_CLOSED, LEAGUE_SEAT_TAKEN,
             LEAGUE_FULL, LEAGUE_STALE, LEAGUE_OPEN, MEMORY_VERSION_UNKNOWN, MEMORY_DONE, MEMORY_ORDER, MEMORY_NOT_ELIGIBLE,
             SCORE_PENDING, MEMORY_BASE_STALE, MEMORY_LEAK, MEMORY_SCHEMA_INVALID]
