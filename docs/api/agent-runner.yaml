openapi: 3.1.0
info:
  title: my Fund Manager agent runner API (internal)
  version: 0.1.0
  description: |-
    Internal contract between the agent runner service and the API. It is not part of the public API description (docs/api/openapi.yaml) and the proxy never routes /internal/** to the outside. Every request carries the service token in the X-Antlab-Runner-Token header; a human access token is never read on these paths. Operations under /agents/{agentId} act for that agent, which must belong to the owner the API is configured with.

    에이전트 러너와 API 사이의 내부 계약이다. 공개 API 명세(docs/api/openapi.yaml)에 넣지 않으며, 프록시는 /internal/** 을 바깥으로 연결하지 않는다. 모든 요청은 X-Antlab-Runner-Token 헤더에 서비스 토큰을 싣고, 사람의 접근 토큰은 이 경로에서 읽지 않는다. /agents/{agentId} 아래 연산은 그 에이전트를 대신해 일하며, 에이전트는 API 설정의 소유자에게 속해야 한다.
# Errors raised by the framework for any operation (a request the security firewall rejects, a body over 12 MiB (MALFORMED_REQUEST), wrong method, unsupported Accept or Content-Type). They are not repeated per operation. / 프레임워크가 모든 연산에 공통으로 내는 오류(보안 방화벽이 거절한 요청, 메서드·Accept·Content-Type). 연산마다 적지 않는다.
x-framework-errors:
  '400': [MALFORMED_REQUEST]
  '405': [METHOD_NOT_ALLOWED]
  '406': [NOT_ACCEPTABLE]
  '415': [UNSUPPORTED_MEDIA_TYPE]
security:
  - runnerToken: []
paths:
  /internal/agent-runner/v1/agents:
    post:
      tags: [agent]
      operationId: registerAgent
      summary: Register an agent / 에이전트 등록
      description: |-
        Registers the agent for the configured owner, idempotently on (persona key, model route, model id). A different model is a different agent. 201 when created, 200 when it already existed.

        설정된 소유자의 에이전트를 (페르소나 키, 모델 경로, 모델 id)로 멱등하게 등록한다. 다른 모델은 다른 에이전트다. 새로 만들면 201, 이미 있으면 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '200':
          description: The agent already existed / 이미 있던 에이전트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDto'
        '201':
          description: The agent that was created / 새로 만든 에이전트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDto'
        '400':
          description: The input is invalid — INVALID_ARGUMENT / 입력이 틀렸다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/agent-runner/v1/agents/{agentId}/seasons:
    post:
      tags: [agent]
      operationId: startAgentSeason
      summary: Start a season as the agent / 에이전트로 시즌 시작
      description: |-
        Starts a season for the agent with the same rules as a human start, and records the season config in the same transaction. A retired agent cannot start a season; an agent may start a limited number of seasons per week. An agent with a paused or abandoning (unfinished) season cannot start one: SEASON_LIMIT.

        사람과 같은 규칙으로 에이전트의 시즌을 시작하고, 같은 트랜잭션에서 시즌 설정을 기록한다. 은퇴한 에이전트는 시작할 수 없고, 에이전트가 한 주에 시작할 수 있는 시즌 수에는 상한이 있다. 일시 정지 중이거나 포기 중인(끝나지 않은) 시즌이 있으면 SEASON_LIMIT 으로 거절한다.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAgentSeasonRequest'
      responses:
        '201':
          description: The season that was started / 시작한 시즌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
        '400':
          description: |-
            The input is invalid — INVALID_ARGUMENT. This includes a config.modelRequested that differs from the model the agent was registered with: an agent is its persona and model pair, so another model is another agent

            입력이 틀렸다 — INVALID_ARGUMENT. config.modelRequested 가 에이전트가 등록된 모델과 다른 경우도 포함한다: 에이전트는 (페르소나, 모델) 쌍이라 다른 모델은 다른 에이전트다
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: |-
            The agent does not exist or is not this owner's; with a leagueId, also a league that does not exist or is not this owner's. One answer for all — NOT_FOUND

            에이전트가 없거나 이 소유자의 것이 아니다. leagueId 가 있으면 없는 리그나 이 소유자의 것이 아닌 리그도 포함한다. 모두 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |-
            A season cannot be started now — POOL_NOT_LOADED, POOL_NOT_JUDGED, SEASON_LIMIT (3 in progress, or the weekly limit), AGENT_RETIRED, PERSONA_VERSION_CONFLICT (the persona version is recorded with another file hash, or this hash with another version), PERSONA_VERSION_STALE (a newer persona version is recorded); with a leagueId: LEAGUE_CLOSED, LEAGUE_SEAT_TAKEN (one seat per member), LEAGUE_FULL, LEAGUE_STALE (the settings or the path no longer match the league's). The start records the persona version on first use; on refusal no season is left

            지금은 시작할 수 없다 — POOL_NOT_LOADED, POOL_NOT_JUDGED, SEASON_LIMIT(진행 중 3개 또는 주간 상한), AGENT_RETIRED, PERSONA_VERSION_CONFLICT(그 페르소나 버전이 다른 파일 해시로, 또는 이 해시가 다른 버전으로 기록되어 있다), PERSONA_VERSION_STALE(더 새로운 페르소나 버전이 기록되어 있다). leagueId 가 있으면 LEAGUE_CLOSED, LEAGUE_SEAT_TAKEN(회원당 한 자리), LEAGUE_FULL, LEAGUE_STALE(설정이나 경로가 리그와 달라졌다). 처음 쓰는 페르소나 버전은 시작 때 기록하고, 거절하면 시즌이 남지 않는다
          x-error-codes: [POOL_NOT_LOADED, POOL_NOT_JUDGED, SEASON_LIMIT, AGENT_RETIRED, PERSONA_VERSION_CONFLICT, PERSONA_VERSION_STALE, LEAGUE_CLOSED, LEAGUE_SEAT_TAKEN, LEAGUE_FULL, LEAGUE_STALE]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: A path of the requested length cannot be built — PATH_TOO_LONG / 요청한 길이의 경로를 만들 수 없다 — PATH_TOO_LONG
          x-error-codes: [PATH_TOO_LONG]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The path service is busy or not reachable; the runner retries later, the agent is not marked failed — ENGINE_UNAVAILABLE / 경로 서비스가 바쁘거나 연결되지 않는다. 러너는 나중에 다시 시도하고 에이전트를 실패로 표시하지 않는다 — ENGINE_UNAVAILABLE
          x-error-codes: [ENGINE_UNAVAILABLE]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/agent-runner/v1/agents/{agentId}/seasons/{seasonId}/config:
    get:
      tags: [agent]
      operationId: getAgentSeasonConfig
      summary: Config of an agent season / 에이전트 시즌의 설정
      description: |-
        Returns the settings the season was started with, as recorded. The runner compares persona key, version and hash, model route, requested model and prompt template version with its own before it sends anything; a difference ends the run. The runner version may differ. A season of another member, a human season and a missing season give the same answer.

        시즌을 시작할 때 기록한 설정을 그대로 준다. 러너는 아무것도 보내기 전에 페르소나 키·버전·해시, 모델 경로, 요청 모델, 프롬프트 템플릿 버전을 자기 값과 비교하고, 다르면 실행을 끝낸다. 러너 버전은 달라도 된다. 다른 회원의 시즌, 사람의 시즌, 없는 시즌은 같은 응답이다.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          description: The recorded config / 기록된 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSeasonConfigDto'
        '400':
          description: The season number is not a number — INVALID_ARGUMENT / 시즌 번호가 숫자가 아니다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: |-
            The agent does not exist or is not this owner's, or the season is not an agent season of this agent. One answer for all — NOT_FOUND

            에이전트가 없거나 이 소유자의 것이 아니거나, 시즌이 이 에이전트의 에이전트 시즌이 아니다. 모두 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/agent-runner/v1/agents/{agentId}/seasons/{seasonId}/turn-view:
    get:
      tags: [agent]
      operationId: getAgentTurnView
      summary: Turn view of the agent / 에이전트의 턴 화면
      description: |-
        Returns what the agent may see at the current turn: the season, the result of the current turn (null at turn 0), the holdings, the prices of the whole pool, the pool, and the agent part. The first five have the same values and shape as the human endpoints (season, turn result, holdings, prices, pool), read in one snapshot. The agent part carries the reply format name, the agent's own fills of the last turns before the current one (oldest first), and the units the engine rejected in the previous turn's decision. No date, seed, engine version, path or return kind is included. A season of another member is not found.

        에이전트가 현재 턴에 볼 수 있는 것을 준다: 시즌, 현재 턴의 결과(0턴이면 null), 보유, 풀 전체 가격, 풀, 에이전트 몫. 앞의 다섯은 사람의 조회와 값·형이 같고(시즌, 턴 결과, 보유, 가격, 풀) 한 스냅샷에서 읽는다. 에이전트 몫은 응답 형식 이름, 현재 턴 이전 몇 턴의 본인 체결(오래된 것부터), 직전 턴 결정에서 엔진이 거부한 단위를 싣는다. 날짜·시드·엔진 버전·경로·수익률 종류는 싣지 않는다. 다른 회원의 시즌은 없는 것과 같다.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          description: The turn view / 턴 화면
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTurnViewDto'
        '400':
          description: The season number is not a number — INVALID_ARGUMENT / 시즌 번호가 숫자가 아니다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: |-
            The agent does not exist or is not this owner's, or the season is not this agent's. One answer for all — NOT_FOUND

            에이전트가 없거나 이 소유자의 것이 아니거나, 시즌이 이 에이전트의 것이 아니다. 모두 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The pool is not ready — POOL_NOT_LOADED, POOL_NOT_JUDGED / 풀이 준비되지 않았다 — POOL_NOT_LOADED, POOL_NOT_JUDGED
          x-error-codes: [POOL_NOT_LOADED, POOL_NOT_JUDGED]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/agent-runner/v1/agents/{agentId}/seasons/{seasonId}/turns/{turnNo}/calls:
    post:
      tags: [agent]
      operationId: flushAgentCalls
      summary: Store attempts made before the decision / 결정 전에 한 시도를 저장한다
      description: |-
        Stores model calls of the current turn as non-final attempts (before a pause or a wait). Attempts are numbered one after another; one that is already stored and identical is skipped, a different one under a stored number is DECISION_CONFLICT. Nothing can be added to a turn that already has a final decision.

        현재 턴의 모델 호출을 최종이 아닌 시도로 저장한다(멈춤이나 기다림 전에). 시도 번호는 이어져야 하고, 이미 저장된 같은 내용은 건너뛰며, 저장된 번호에 다른 내용이 오면 DECISION_CONFLICT 다. 이미 최종 결정이 있는 턴에는 더할 수 없다.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/TurnNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallsRequest'
      responses:
        '204':
          description: Stored (or already stored) / 저장했다(이미 저장되어 있었다)
        '400':
          description: The request is wrong — INVALID_ARGUMENT (empty or too long list, numbers that do not follow one another, text over 256 KiB, a character that cannot be stored, something that looks like a secret, a model other than the season's, a missing ledger call id on an OPENROUTER season) / 요청이 틀렸다 — INVALID_ARGUMENT(빈 목록·너무 긴 목록, 이어지지 않는 번호, 256 KiB 를 넘는 원문, 저장할 수 없는 문자, 비밀값처럼 보이는 문자열, 시즌과 다른 모델, OPENROUTER 시즌의 장부 호출 번호 누락)
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The agent, the season or the agent config does not exist for this owner. One answer for all — NOT_FOUND / 에이전트·시즌·에이전트 설정이 이 소유자에게 없다. 모두 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The season is not in progress, the turn is not the current one, or the stored attempts differ — SEASON_NOT_ACTIVE, TURN_MISMATCH, DECISION_CONFLICT / 시즌이 진행 중이 아니거나 현재 턴이 아니거나 저장된 시도와 다르다 — SEASON_NOT_ACTIVE, TURN_MISMATCH, DECISION_CONFLICT
          x-error-codes: [SEASON_NOT_ACTIVE, TURN_MISMATCH, DECISION_CONFLICT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/agent-runner/v1/agents/{agentId}/seasons/{seasonId}/turns/{turnNo}/decision:
    post:
      tags: [agent]
      operationId: submitAgentDecision
      summary: Submit the decision of a turn / 한 턴의 결정을 낸다
      description: |-
        Submits the runner's verdict on the model reply, the reply itself (a turn-decision/1 object, only with DECISION) and the model calls of the turn; the last call is the final one. The engine checks the reply as a whole against docs/api/turn-decision-1.schema.json (a shape error records the outcome INVALID and applies nothing), then unit by unit in a fixed order: the formation change, the sells in the reply's order, the buys in the reply's order. A unit that fails its check is rejected alone with a code and the other units still run; this is a 200 result, not an HTTP error. Applied units are written exactly as human orders and formation changes. The source of an order unit goes through the same origin rule as a human order and is stored with the order: FEED and ALERT refer to an item of this turn's feed by its feed_seq (a missing or unknown feed_seq, an item of the other kind, or an item that names another asset rejects that unit with SOURCE_NOT_VISIBLE; an item that names no asset starts an order for any asset); a feed_seq on another kind and ranking_rank are ignored; RANKING needs the asset on this turn's ranking board, recomputed from this turn's data only (turn 0 has no board, so it is refused there); BENCH is SOURCE_NOT_ALLOWED. / 주문 단위의 source는 사람의 주문과 같은 출발점 규칙을 지나 주문과 함께 저장된다. FEED·ALERT는 이번 턴 피드의 항목을 feed_seq로 가리킨다(feed_seq가 없거나 없는 번호이거나, 종류가 다른 항목이거나, 다른 종목이 적힌 항목이면 그 단위를 SOURCE_NOT_VISIBLE로 거절하고, 종목이 없는 항목은 어느 종목 주문이든 시작할 수 있다). 다른 종류에 붙은 feed_seq와 ranking_rank는 무시하며, RANKING은 이번 턴 순위판에 그 종목이 있어야 하고(이번 턴 자료만으로 다시 계산하며, 0턴에는 순위판이 없어 거절), BENCH는 SOURCE_NOT_ALLOWED다. A broken state (ledger, lineup, formation chain, event time) aborts the whole decision with a 409 and records nothing. Order of the checks inside one order unit: source, pool (asset known and priced this turn), quantity; then for a sell the declared position (a sell must not carry one) before the holding, for a buy the cash before the declared position and the single-asset limit; the first failing check names the code. A NUL character anywhere in the reply, text that looks like a secret (a key-shaped token such as sk-or-v1-…, or a Bearer value with a digit), a reply over 256 KiB, a ledger call id used twice, or a body over 12 MiB is a 400. The last call of a NO_RESPONSE may have any status except OK and INVALID. The same decision sent again for the current turn answers the stored result with replayed = true (for a turn already passed, read it with GET);  a different decision for a decided turn is DECISION_CONFLICT.

        러너가 모델 응답에 내린 판정, 응답 자체(turn-decision/1 객체, DECISION 일 때만), 그 턴의 모델 호출을 낸다. 마지막 호출이 최종 호출이다. 엔진은 먼저 응답 전체를 docs/api/turn-decision-1.schema.json 으로 검사하고(모양 오류는 결과를 INVALID 로 기록하고 아무것도 적용하지 않는다), 이어 정해진 순서로 단위별 검사한다: 전술 변경, 응답 순서대로 매도, 응답 순서대로 매수. 검사에 걸린 단위는 코드와 함께 그 단위만 거부하고 나머지는 계속하며, 이것은 HTTP 오류가 아니라 200 결과다. 적용한 단위는 사람의 주문·전술 변경과 똑같이 기록한다. 손상 상태(원장·라인업·포메이션 사슬·이벤트 시각)는 결정 전체를 409 로 되돌리고 아무것도 기록하지 않는다. 한 주문 단위 안의 검사 순서: 출처, 풀(종목을 알고 이 턴에 가격이 있음), 수량; 이어 매도는 선언 포지션(매도에는 없어야 함) 다음 보유, 매수는 현금 다음 선언 포지션과 단일 종목 한도이며, 처음 걸린 검사가 코드를 정한다. 응답 안의 NUL 문자, 비밀값처럼 보이는 문자열(sk-or-v1-… 같은 키 모양, 숫자가 든 Bearer 값), 256 KiB 를 넘는 응답, 두 번 쓴 장부 호출 번호, 12 MiB 를 넘는 본문은 400 이다. 같은 결정을 다시 보내면(현재 턴일 때) 저장된 결과를 replayed = true 로 돌려주고(지난 턴은 GET 으로 읽는다), 이미 결정된 턴에 다른 결정을 보내면 DECISION_CONFLICT 다.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/TurnNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: What the engine did with each unit / 엔진이 단위마다 한 일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResultDto'
        '400':
          description: The envelope is wrong — INVALID_ARGUMENT (a decision with an outcome other than DECISION, or none with DECISION; attempt numbers that do not follow one another; a last call whose status does not fit the outcome; the rules of the calls endpoint). Nothing is recorded / 봉투가 틀렸다 — INVALID_ARGUMENT(DECISION 이 아닌데 결정이 있거나 DECISION 인데 없음, 이어지지 않는 시도 번호, 결과와 맞지 않는 마지막 호출 상태, 호출 저장 연산의 규칙). 아무것도 기록하지 않는다
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The agent, the season or the agent config does not exist for this owner. One answer for all — NOT_FOUND / 에이전트·시즌·에이전트 설정이 이 소유자에게 없다. 모두 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The decision cannot be taken now — TURN_MISMATCH, SEASON_NOT_ACTIVE, DECISION_CONFLICT; a broken state aborts the whole decision — LEDGER_MISMATCH, LINEUP_MISMATCH, INVALID_FORMATION, EVENT_TIME_CONFLICT / 지금은 받을 수 없다 — TURN_MISMATCH, SEASON_NOT_ACTIVE, DECISION_CONFLICT. 손상 상태는 결정 전체를 되돌린다 — LEDGER_MISMATCH, LINEUP_MISMATCH, INVALID_FORMATION, EVENT_TIME_CONFLICT
          x-error-codes: [TURN_MISMATCH, SEASON_NOT_ACTIVE, DECISION_CONFLICT, LEDGER_MISMATCH, LINEUP_MISMATCH, INVALID_FORMATION, EVENT_TIME_CONFLICT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [agent]
      operationId: getAgentDecision
      summary: Read the stored result of a turn's decision / 한 턴 결정의 저장된 결과를 읽는다
      description: |-
        Returns the stored result of a decided turn with replayed = true, for a runner that restarted. Not found while the turn has no final decision.

        다시 시작한 러너를 위해 결정된 턴의 저장된 결과를 replayed = true 로 돌려준다. 최종 결정이 없는 턴은 없는 것과 같다.
