openapi: 3.1.0
info:
  title: my Fund Manager agent runner API (internal)
  version: 0.1.0
  description: |-
    Internal contract between the agent runner service and the API. It is not part of the public API description (docs/api/openapi.yaml) and the proxy never routes /internal/** to the outside. Every request carries the service token in the X-Antlab-Runner-Token header; a human access token is never read on these paths. Operations under /agents/{agentId} act for that agent, which must belong to the owner the API is configured with.

    에이전트 러너와 API 사이의 내부 계약이다. 공개 API 명세(docs/api/openapi.yaml)에 넣지 않으며, 프록시는 /internal/** 을 바깥으로 연결하지 않는다. 모든 요청은 X-Antlab-Runner-Token 헤더에 서비스 토큰을 싣고, 사람의 접근 토큰은 이 경로에서 읽지 않는다. /agents/{agentId} 아래 연산은 그 에이전트를 대신해 일하며, 에이전트는 API 설정의 소유자에게 속해야 한다.
# Errors raised by the framework for any operation. They are not repeated per operation. / 프레임워크가 모든 연산에 공통으로 내는 오류. 연산마다 적지 않는다.
x-framework-errors:
  '405': [METHOD_NOT_ALLOWED]
  '406': [NOT_ACCEPTABLE]
  '415': [UNSUPPORTED_MEDIA_TYPE]
security:
  - runnerToken: []
paths:
  /internal/agent-runner/v1/agents:
    post:
      tags: [agent]
      operationId: registerAgent
      summary: Register an agent / 에이전트 등록
      description: |-
        Registers the agent for the configured owner, idempotently on (persona key, model route, model id). A different model is a different agent. 201 when created, 200 when it already existed.

        설정된 소유자의 에이전트를 (페르소나 키, 모델 경로, 모델 id)로 멱등하게 등록한다. 다른 모델은 다른 에이전트다. 새로 만들면 201, 이미 있으면 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '200':
          description: The agent already existed / 이미 있던 에이전트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDto'
        '201':
          description: The agent that was created / 새로 만든 에이전트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDto'
        '400':
          description: The input is invalid — INVALID_ARGUMENT / 입력이 틀렸다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/agent-runner/v1/agents/{agentId}/seasons:
    post:
      tags: [agent]
      operationId: startAgentSeason
      summary: Start a season as the agent / 에이전트로 시즌 시작
      description: |-
        Starts a season for the agent with the same rules as a human start, and records the season config in the same transaction. A retired agent cannot start a season; an agent may start a limited number of seasons per week.

        사람과 같은 규칙으로 에이전트의 시즌을 시작하고, 같은 트랜잭션에서 시즌 설정을 기록한다. 은퇴한 에이전트는 시작할 수 없고, 에이전트가 한 주에 시작할 수 있는 시즌 수에는 상한이 있다.
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAgentSeasonRequest'
      responses:
        '201':
          description: The season that was started / 시작한 시즌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonDto'
        '400':
          description: |-
            The input is invalid — INVALID_ARGUMENT. This includes a config.modelRequested that differs from the model the agent was registered with: an agent is its persona and model pair, so another model is another agent

            입력이 틀렸다 — INVALID_ARGUMENT. config.modelRequested 가 에이전트가 등록된 모델과 다른 경우도 포함한다: 에이전트는 (페르소나, 모델) 쌍이라 다른 모델은 다른 에이전트다
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: |-
            The agent does not exist or is not this owner's. One answer for both — NOT_FOUND

            에이전트가 없거나 이 소유자의 것이 아니다. 둘 다 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |-
            A season cannot be started now — POOL_NOT_LOADED, POOL_NOT_JUDGED, SEASON_LIMIT (3 in progress, or the weekly limit), AGENT_RETIRED

            지금은 시작할 수 없다 — POOL_NOT_LOADED, POOL_NOT_JUDGED, SEASON_LIMIT(진행 중 3개 또는 주간 상한), AGENT_RETIRED
          x-error-codes: [POOL_NOT_LOADED, POOL_NOT_JUDGED, SEASON_LIMIT, AGENT_RETIRED]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: A path of the requested length cannot be built — PATH_TOO_LONG / 요청한 길이의 경로를 만들 수 없다 — PATH_TOO_LONG
          x-error-codes: [PATH_TOO_LONG]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/agent-runner/v1/agents/{agentId}/seasons/{seasonId}/turn-view:
    get:
      tags: [agent]
      operationId: getAgentTurnView
      summary: Turn view of the agent / 에이전트의 턴 화면
      description: |-
        Returns what the agent may see at the current turn: the season, the result of the current turn (null at turn 0), the holdings, the prices of the whole pool, the pool, and the agent part. The first five have the same values and shape as the human endpoints (season, turn result, holdings, prices, pool), read in one snapshot. The agent part carries the reply format name, the agent's own fills of the last turns before the current one (oldest first), and the units the engine rejected in the previous turn's decision. No date, seed, engine version, path or return kind is included. A season of another member is not found.

        에이전트가 현재 턴에 볼 수 있는 것을 준다: 시즌, 현재 턴의 결과(0턴이면 null), 보유, 풀 전체 가격, 풀, 에이전트 몫. 앞의 다섯은 사람의 조회와 값·형이 같고(시즌, 턴 결과, 보유, 가격, 풀) 한 스냅샷에서 읽는다. 에이전트 몫은 응답 형식 이름, 현재 턴 이전 몇 턴의 본인 체결(오래된 것부터), 직전 턴 결정에서 엔진이 거부한 단위를 싣는다. 날짜·시드·엔진 버전·경로·수익률 종류는 싣지 않는다. 다른 회원의 시즌은 없는 것과 같다.
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          description: The turn view / 턴 화면
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTurnViewDto'
        '400':
          description: The season number is not a number — INVALID_ARGUMENT / 시즌 번호가 숫자가 아니다 — INVALID_ARGUMENT
          x-error-codes: [INVALID_ARGUMENT]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: |-
            The agent does not exist or is not this owner's, or the season is not this agent's. One answer for all — NOT_FOUND

            에이전트가 없거나 이 소유자의 것이 아니거나, 시즌이 이 에이전트의 것이 아니다. 모두 같은 응답이다 — NOT_FOUND
          x-error-codes: [NOT_FOUND]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The pool is not ready — POOL_NOT_LOADED, POOL_NOT_JUDGED / 풀이 준비되지 않았다 — POOL_NOT_LOADED, POOL_NOT_JUDGED
          x-error-codes: [POOL_NOT_LOADED, POOL_NOT_JUDGED]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    runnerToken:
      type: apiKey
      in: header
      name: X-Antlab-Runner-Token
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      description: Agent member identifier from registration / 등록에서 받은 에이전트 회원 식별자
      schema:
        type: integer
        format: int64
    SeasonId:
      name: seasonId
      in: path
      required: true
      description: Season identifier / 시즌 식별자
      schema:
        type: integer
        format: int64
  responses:
    Unauthenticated:
      description: |-
        The service token is missing, wrong or not configured — UNAUTHENTICATED

        서비스 토큰이 없거나 틀렸거나 설정되지 않았다 — UNAUTHENTICATED
      x-error-codes: [UNAUTHENTICATED]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: |-
        An unexpected server error — INTERNAL_ERROR. The message is a fixed sentence that carries no exception content

        예상하지 못한 서버 오류 — INTERNAL_ERROR. 예외 내용은 싣지 않는 고정 문장이다
      x-error-codes: [INTERNAL_ERROR]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RegisterAgentRequest:
      type: object
      required: [personaKey, modelRoute, modelId, displayName]
      properties:
        personaKey:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Persona key, lowercase words joined by hyphens / 페르소나 키, 하이픈으로 이은 소문자 단어
        modelRoute:
          $ref: '#/components/schemas/ModelRoute'
        modelId:
          type: string
          maxLength: 200
          pattern: '^\S(.*\S)?$'
          description: Model identifier, no leading or trailing space / 모델 id, 앞뒤 공백 없음
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: Name shown for the agent member (a label, not part of the identity) / 에이전트 회원에 보이는 이름(표지일 뿐 식별에 쓰지 않는다)
    AgentDto:
      type: object
      required: [agentId, displayName, personaKey, modelRoute, modelId, status]
      properties:
        agentId:
          type: integer
          format: int64
        displayName:
          type: string
        personaKey:
          type: string
        modelRoute:
          $ref: '#/components/schemas/ModelRoute'
        modelId:
          type: string
        status:
          type: string
          enum: [ACTIVE, RETIRED]
    ModelRoute:
      type: string
      enum: [OPENROUTER, CLAUDE_CLI, CODEX_CLI, OLLAMA]
    StartAgentSeasonRequest:
      type: object
      description: |-
        The fields of the human season start plus the agent's season config. Initial capital, rates and the seed are not taken from the request

        사람의 시즌 시작 필드에 에이전트의 시즌 설정을 더한 것이다. 초기 자금·요율·시드는 요청에서 받지 않는다
      required: [riskLimit, formation, config]
      properties:
        riskLimit:
          type: string
          format: decimal
          description: 'One of -0.10, -0.20, -0.30, -0.40 / -0.10, -0.20, -0.30, -0.40 중 하나'
        formation:
          $ref: '#/components/schemas/FormationDto'
        pathLength:
          type: integer
          format: int32
          default: 12
          description: 'Path length (number of turns): 12, 24 or 60. 12 when omitted / 경로 길이(턴 수) 12, 24, 60. 생략하면 12'
        config:
          $ref: '#/components/schemas/AgentSeasonConfig'
    AgentSeasonConfig:
      type: object
      description: |-
        Settings recorded once for the season. The persona key and model route come from the agent's registration

        시즌에 한 번 기록하는 설정. 페르소나 키와 모델 경로는 에이전트 등록에서 가져온다
      required: [personaVersion, personaSha256, modelRequested, temperature, maxTokens, turnTimeoutMs,
                 promptTemplateVersion, runnerVersion, budgetCalls, budgetUsd]
      properties:
        personaVersion:
          type: integer
          format: int32
          minimum: 1
        personaSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        modelRequested:
          type: string
          maxLength: 200
          pattern: '^\S(.*\S)?$'
        temperature:
          type: string
          format: decimal
          description: 0 to 2, at most 3 decimal places / 0 이상 2 이하, 소수 3자리까지
        modelSeed:
          type: [integer, 'null']
          format: int64
        maxTokens:
          type: integer
          format: int32
          minimum: 1
        turnTimeoutMs:
          type: integer
          format: int32
          minimum: 1
        promptTemplateVersion:
          type: string
          minLength: 1
          maxLength: 32
        runnerVersion:
          type: string
          minLength: 1
          maxLength: 32
        memoryVersion:
          type: [integer, 'null']
          format: int32
          minimum: 1
        budgetCalls:
          type: integer
          format: int32
          minimum: 1
        budgetUsd:
          type: string
          format: decimal
          description: Not negative, at most 8 decimal places / 0 이상, 소수 8자리까지
    FormationDto:
      type: object
      description: |-
        Share per position (integer percent). Sum 100, goalkeeper at least 1

        포지션별 비중(정수 퍼센트). 합 100, 골키퍼 1 이상
      required: [goalkeeper, defender, midfielder, forward]
      properties:
        goalkeeper:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        defender:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        midfielder:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        forward:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
    SeasonDto:
      type: object
      description: Same body as the human season start / 사람의 시즌 시작과 같은 본문
      required: [id, status, currentTurnNo, pathLength, riskLimit, startFormation, currentFormation,
                 initialCash, cashBalance, feeRateKr, feeRateUs, fxSpreadRate]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [IN_PROGRESS, ABANDONING, FINISHED]
        currentTurnNo:
          type: integer
          format: int32
        pathLength:
          type: integer
          format: int32
        riskLimit:
          type: string
          format: decimal
        startFormation:
          $ref: '#/components/schemas/FormationDto'
        currentFormation:
          $ref: '#/components/schemas/FormationDto'
        initialCash:
          type: string
          format: decimal
        cashBalance:
          type: string
          format: decimal
        feeRateKr:
          type: string
          format: decimal
        feeRateUs:
          type: string
          format: decimal
        fxSpreadRate:
          type: string
          format: decimal
    TurnResultDto:
      type: object
      description: |-
        Values of the stored turn row and the ratios computed from them. The advance-turn response and the turn lookup have the same shape. The sum of the four shares can differ from 1 by at most 2e-8, and status and pathLength are the season's values now. targetFormation is the target at the start of that turn. Reconciliation attempt number, status, seed, path, month block, year-month and return kind are not included.

        저장한 턴 행의 값과 거기서 계산한 비율. 턴 전환 응답과 턴 조회가 같은 형이다. 비중 4개의 합은 1과 최대 2e-8 다를 수 있고, status·pathLength 는 시즌의 지금 값이다. targetFormation 은 그 턴 시작 시점의 목표다. 대사 시도 번호·상태·시드·경로·월 블록·연월·수익률 종류는 싣지 않는다
      required: [seasonId, turnNo, status, pathLength, cashBalance, holdingsValue, totalValue, goalkeeperValue,
                 defenderValue, midfielderValue, forwardValue, drawdown, previousTotalValue, valueChange, periodReturn,
                 riskLimit, riskHeadroom, riskBreached, goalkeeperWeight, defenderWeight, midfielderWeight,
                 forwardWeight, targetFormation, goalkeeperGap, defenderGap, midfielderGap, forwardGap,
                 formationDeviation]
      properties:
        seasonId:
          type: integer
          format: int64
          description: Season identifier / 시즌 식별자
        turnNo:
          type: integer
          format: int32
          description: |-
            The turn of this result (in the advance response, the turn just applied = the new current turn)

            이 결과의 턴(전환 응답에서는 방금 적용된 턴 = 새 현재 턴)
        status:
          $ref: '#/components/schemas/SeasonStatus'
          description: FINISHED if it was the last turn / 마지막 턴이면 FINISHED
        pathLength:
          type: integer
          format: int32
          description: Path length (number of turns) / 경로 길이(턴 수)
        cashBalance:
          type: string
          format: decimal
          description: Cash balance, whole KRW / 현금 잔액, 원 단위 정수
        holdingsValue:
          type: string
          format: decimal
          description: Holdings valuation, whole KRW / 보유 평가액, 원 단위 정수
        totalValue:
          type: string
          format: decimal
          description: Total valuation, whole KRW / 총 평가액, 원 단위 정수
        goalkeeperValue:
          type: string
          format: decimal
          description: Goalkeeper valuation (cash included), whole KRW / 골키퍼 평가액(현금 포함), 원 단위 정수
        defenderValue:
          type: string
          format: decimal
          description: Defender valuation, whole KRW / 수비수 평가액, 원 단위 정수
        midfielderValue:
          type: string
          format: decimal
          description: Midfielder valuation, whole KRW / 미드필더 평가액, 원 단위 정수
        forwardValue:
          type: string
          format: decimal
          description: Attacker valuation, whole KRW / 공격수 평가액, 원 단위 정수
        drawdown:
          type: string
          format: decimal
          description: Cumulative drawdown (0 or less), 8 decimal places / 누적 낙폭(0 이하), 소수 8자리
        previousTotalValue:
          type: string
          format: decimal
          description: Total valuation of the previous turn (initial capital at turn 1), whole KRW / 직전 턴의 총 평가액(1턴이면 초기 자금), 원 단위 정수
        valueChange:
          type: string
          format: decimal
          description: Total valuation − previous total valuation (can be negative), whole KRW / 총 평가액 − 직전 총 평가액(음수 가능), 원 단위 정수
        periodReturn:
          type: string
          format: decimal
          description: Period return = change ÷ previous total valuation, 8 decimal places / 기간 수익률 = 변화 ÷ 직전 총 평가액, 소수 8자리
        riskLimit:
          type: string
          format: decimal
          description: Risk limit (0 or less), 8 decimal places / 위험 선언(0 이하), 소수 8자리
        riskHeadroom:
          type: string
          format: decimal
          description: |-
            Room to the risk limit = drawdown − limit, 8 decimal places. 0 or more means inside the limit, negative means it was crossed

            위험 선언까지의 여유 = 낙폭 − 선언, 소수 8자리. 0 이상이면 선언 안, 음수면 넘었다
        riskBreached:
          type: boolean
          description: Whether the drawdown crossed the risk limit (drawdown < limit) / 낙폭이 위험 선언을 넘었는가(낙폭 < 선언)
        goalkeeperWeight:
          type: string
          format: decimal
          description: Goalkeeper share = valuation ÷ total valuation, 8 decimal places / 골키퍼 비중 = 평가액 ÷ 총 평가액, 소수 8자리
        defenderWeight:
          type: string
          format: decimal
          description: Defender share, 8 decimal places / 수비수 비중, 소수 8자리
        midfielderWeight:
          type: string
          format: decimal
          description: Midfielder share, 8 decimal places / 미드필더 비중, 소수 8자리
        forwardWeight:
          type: string
          format: decimal
          description: Attacker share, 8 decimal places / 공격수 비중, 소수 8자리
        targetFormation:
          $ref: '#/components/schemas/FormationDto'
        goalkeeperGap:
          type: string
          format: decimal
          description: Goalkeeper share − target (positive = more than the target), 8 decimal places / 골키퍼 비중 − 목표(양수 = 목표보다 많음), 소수 8자리
        defenderGap:
          type: string
          format: decimal
          description: Defender share − target, 8 decimal places / 수비수 비중 − 목표, 소수 8자리
        midfielderGap:
          type: string
          format: decimal
          description: Midfielder share − target, 8 decimal places / 미드필더 비중 − 목표, 소수 8자리
        forwardGap:
          type: string
          format: decimal
          description: Attacker share − target, 8 decimal places / 공격수 비중 − 목표, 소수 8자리
        formationDeviation:
          type: string
          format: decimal
          description: Formation deviation = sum of |share − target| over the positions, 8 decimal places / 포메이션 이탈 = 포지션별 |비중 − 목표|의 합, 소수 8자리
    HoldingsDto:
      type: object
      description: |-
        Holdings of the current turn × that turn's prices (a live value that reflects this turn's trades immediately). In a turn without trades, the total, holdings valuation and valuation per position equal the turn result of that turn. currentFormation is the formation applied now. The sum of the four shares can differ from 1 by at most 2e-8. Seed, path, month block, year-month and return kind are not included.

        현재 턴의 보유 × 그 턴 가격(이번 턴의 매매가 바로 반영되는 실시간 값). 매매가 없는 턴이면 총액·보유 평가액·포지션별 평가액이 그 턴의 턴 결과와 같다. currentFormation 은 지금 적용 중인 포메이션이다. 비중 4개의 합은 1과 최대 2e-8 다를 수 있다. 시드·경로·월 블록·연월·수익률 종류는 싣지 않는다
      required: [seasonId, turnNo, cashBalance, holdingsValue, totalValue, goalkeeperValue, defenderValue,
                 midfielderValue, forwardValue, goalkeeperWeight, defenderWeight, midfielderWeight, forwardWeight,
                 currentFormation, goalkeeperGap, defenderGap, midfielderGap, forwardGap, formationDeviation, holdings]
      properties:
        seasonId:
          type: integer
          format: int64
          description: Season identifier / 시즌 식별자
        turnNo:
          type: integer
          format: int32
          description: The season's current turn (the turn the prices are based on) / 시즌의 현재 턴(가격 기준 턴)
        cashBalance:
          type: string
          format: decimal
          description: Cash balance (now), whole KRW / 현금 잔액(지금), 원 단위 정수
        holdingsValue:
          type: string
          format: decimal
          description: Holdings valuation = Σ quantity × current turn price, whole KRW / 보유 평가액 = Σ 수량 × 현재 턴 가격, 원 단위 정수
        totalValue:
          type: string
          format: decimal
          description: Total valuation = cash + holdings valuation, whole KRW / 총 평가액 = 현금 + 보유 평가액, 원 단위 정수
        goalkeeperValue:
          type: string
          format: decimal
          description: Goalkeeper valuation (cash included, total − the other three), whole KRW / 골키퍼 평가액(현금 포함, 총액 − 나머지 셋), 원 단위 정수
        defenderValue:
          type: string
          format: decimal
          description: Defender valuation, whole KRW / 수비수 평가액, 원 단위 정수
        midfielderValue:
          type: string
          format: decimal
          description: Midfielder valuation, whole KRW / 미드필더 평가액, 원 단위 정수
        forwardValue:
          type: string
          format: decimal
          description: Attacker valuation, whole KRW / 공격수 평가액, 원 단위 정수
        goalkeeperWeight:
          type: string
          format: decimal
          description: Goalkeeper share = valuation ÷ total valuation, 8 decimal places / 골키퍼 비중 = 평가액 ÷ 총 평가액, 소수 8자리
        defenderWeight:
          type: string
          format: decimal
          description: Defender share, 8 decimal places / 수비수 비중, 소수 8자리
        midfielderWeight:
          type: string
          format: decimal
          description: Midfielder share, 8 decimal places / 미드필더 비중, 소수 8자리
        forwardWeight:
          type: string
          format: decimal
          description: Attacker share, 8 decimal places / 공격수 비중, 소수 8자리
        currentFormation:
          $ref: '#/components/schemas/FormationDto'
        goalkeeperGap:
          type: string
          format: decimal
          description: Goalkeeper share − current formation (positive = more than the target), 8 decimal places / 골키퍼 비중 − 현재 포메이션(양수 = 목표보다 많음), 소수 8자리
        defenderGap:
          type: string
          format: decimal
          description: Defender share − current formation, 8 decimal places / 수비수 비중 − 현재 포메이션, 소수 8자리
        midfielderGap:
          type: string
          format: decimal
          description: Midfielder share − current formation, 8 decimal places / 미드필더 비중 − 현재 포메이션, 소수 8자리
        forwardGap:
          type: string
          format: decimal
          description: Attacker share − current formation, 8 decimal places / 공격수 비중 − 현재 포메이션, 소수 8자리
        formationDeviation:
          type: string
          format: decimal
          description: |-
            Formation deviation = sum of |share − current formation| over the positions, 8 decimal places

            포메이션 이탈 = 포지션별 |비중 − 현재 포메이션|의 합, 소수 8자리
        holdings:
          type: array
          description: Holdings with quantity 1 or more (ascending asset number) / 수량 1 이상인 보유(종목 번호 오름차순)
          items:
            $ref: '#/components/schemas/HoldingDto'
    HoldingDto:
      type: object
      description: |-
        One held asset. The asset name is not included — link it by assetId from the pool response

        보유 한 종목. 종목 이름은 싣지 않는다 — 풀 응답의 assetId 로 잇는다
      required: [assetId, quantity, avgPrice, declaredPosition, price, value, weight]
      properties:
        assetId:
          type: integer
          format: int64
          description: Asset identifier (the same as assetId in the pool response) / 종목 식별자(풀 응답의 assetId 와 같다)
        quantity:
          type: integer
          format: int32
          description: Quantity held (1 or more) / 보유 수량(1 이상)
        avgPrice:
          type: string
          format: decimal
          description: Average cost (fee excluded), 4 decimal places / 평균단가(수수료 제외), 소수 4자리
        declaredPosition:
          $ref: '#/components/schemas/Position'
          description: Declared position of the open span / 열린 구간의 선언 포지션
        price:
          type: string
          format: decimal
          description: Current turn price, whole KRW / 현재 턴 가격, 원 단위 정수
        value:
          type: string
          format: decimal
          description: Valuation = quantity × current turn price, whole KRW / 평가액 = 수량 × 현재 턴 가격, 원 단위 정수
        weight:
          type: string
          format: decimal
          description: Asset share = valuation ÷ total valuation (cash included), 8 decimal places / 종목 비중 = 평가액 ÷ 총 평가액(현금 포함), 소수 8자리
    TurnPricesDto:
      type: object
      description: Prices of the whole pool for one turn (ascending asset number) / 한 턴의 풀 전체 가격(종목 번호 오름차순)
      required: [turnNo, prices]
      properties:
        turnNo:
          type: integer
          format: int32
        prices:
          type: array
          items:
            $ref: '#/components/schemas/TurnPriceDto'
    TurnPriceDto:
      type: object
      required: [assetId, price]
      properties:
        assetId:
          type: integer
          format: int64
          description: Asset identifier (the same as assetId in the pool response) / 종목 식별자(풀 응답의 assetId 와 같다)
        price:
          type: string
          format: decimal
          description: Price, whole KRW / 가격, 원 단위 정수
    PoolAssetDto:
      type: object
      required: [assetId, market, ticker, name, assetType, returnBasis, proxyIndexName,
                 groupId, groupName, groupKind, systemPosition,
                 upParticipation, downParticipation, volatility, maxDrawdown]
      properties:
        assetId:
          type: integer
          format: int64
          description: Asset identifier (used in order requests). Not shown to the player / 종목 식별자(주문 요청에 쓴다). 표시하지 않는다
        market:
          $ref: '#/components/schemas/Market'
        ticker:
          type: string
        name:
          type: string
        assetType:
          $ref: '#/components/schemas/AssetType'
        returnBasis:
          $ref: '#/components/schemas/ReturnBasis'
        proxyIndexName:
          type: [string, 'null']
          description: Name of the tracked index used for the period before listing (ETFs only) / 상장 전 구간에 쓰는 추종 지수 이름(ETF만)
        groupId:
          type: integer
          format: int64
        groupName:
          type: string
        groupKind:
          $ref: '#/components/schemas/AssetGroupKind'
        systemPosition:
          $ref: '#/components/schemas/Position'
        upParticipation:
          type: string
          format: decimal
          description: Up-market participation rate (months the market rose 1% or more, in KRW) / 상승장 참여율(시장이 1% 이상 오른 달, 원화)
        downParticipation:
          type: string
          format: decimal
          description: Down-market participation rate (months the market fell 1% or more, in KRW) / 하락장 참여율(시장이 1% 이상 빠진 달, 원화)
        volatility:
          type: string
          format: decimal
          description: Sample standard deviation of monthly returns (not annualized) / 월 수익률 표본 표준편차(연율화 안 함)
        maxDrawdown:
          type: string
          format: decimal
          description: Maximum drawdown, 0 or less (−0.35 = −35%) / 최대 낙폭, 0 이하(−0.35 = −35%)
    SeasonStatus:
      type: string
      enum: [IN_PROGRESS, ABANDONING, FINISHED]
    Market:
      type: string
      enum: [KR, US]
    AssetType:
      type: string
      enum: [STOCK, ETF]
    ReturnBasis:
      type: string
      enum: [PRICE, TOTAL]
    AssetGroupKind:
      type: string
      enum: [SECTOR, ASSET_CLASS]
    Position:
      type: string
      enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD_TARGET, FORWARD_BREAKOUT, FORWARD_DEFENSIVE]
    OrderSide:
      type: string
      enum: [BUY, SELL]
    AgentTurnViewDto:
      type: object
      description: |-
        The turn screen of an agent. season, lastTurn, holdings, prices and pool have the shapes of the human endpoints; agent is the agent-only part. Nothing the human turn screen does not show is added

        에이전트의 턴 화면. season·lastTurn·holdings·prices·pool 은 사람 조회와 같은 형이고 agent 는 에이전트 전용 몫이다. 사람의 턴 화면에 없는 것은 더하지 않는다
      required: [season, lastTurn, holdings, prices, pool, agent]
      properties:
        season:
          $ref: '#/components/schemas/SeasonDto'
        lastTurn:
          description: Result of the current turn; null at turn 0 / 현재 턴의 결과, 0턴이면 null
          oneOf:
            - $ref: '#/components/schemas/TurnResultDto'
            - type: 'null'
        holdings:
          $ref: '#/components/schemas/HoldingsDto'
        prices:
          $ref: '#/components/schemas/TurnPricesDto'
        pool:
          type: array
          items:
            $ref: '#/components/schemas/PoolAssetDto'
        agent:
          $ref: '#/components/schemas/AgentPartDto'
    AgentPartDto:
      type: object
      required: [schema, recentTrades, lastRejects, memory]
      properties:
        schema:
          type: string
          enum: [turn-decision/1]
          description: Reply format to answer in / 답할 응답 형식
        recentTrades:
          type: array
          description: Own fills of the last turns before the current one, oldest first / 현재 턴 이전 몇 턴의 본인 체결, 오래된 것부터
          items:
            $ref: '#/components/schemas/RecentTradeDto'
        lastRejects:
          type: array
          description: Units the engine rejected in the previous turn's decision; empty at turn 0 / 직전 턴 결정에서 엔진이 거부한 단위, 0턴이면 빈 목록
          items:
            $ref: '#/components/schemas/RejectDto'
        memory:
          type: 'null'
          description: Reserved for agent memory; always null for now / 에이전트 기억 자리, 지금은 항상 null
    RecentTradeDto:
      type: object
      required: [turnNo, side, asset, quantity, price, fee, source]
      properties:
        turnNo:
          type: integer
          format: int32
        side:
          $ref: '#/components/schemas/OrderSide'
        asset:
          type: string
          pattern: '^(KR|US):[A-Z0-9.]{1,12}$'
          description: MARKET:TICKER / 시장:종목코드
        quantity:
          type: integer
          format: int32
        price:
          type: string
          format: decimal
          description: Fill price (that turn's price), whole KRW / 체결가(그 턴 가격), 원 단위 정수
        fee:
          type: string
          format: decimal
          description: Fee, whole KRW / 수수료, 원 단위 정수
        source:
          $ref: '#/components/schemas/OrderSource'
    RejectDto:
      type: object
      required: [unit, index, code]
      properties:
        unit:
          type: string
          enum: [FORMATION, ORDER, THESES]
        index:
          type: [integer, 'null']
          format: int32
          description: Position in the reply's orders array; null for the formation and theses units / 응답 orders 배열의 위치, 포메이션·논지 단위는 null
        code:
          type: string
          description: Reject code recorded by the engine / 엔진이 기록한 거부 코드
    OrderSource:
      type: string
      enum: [RANKING, FEED, ALERT, BENCH, DIRECT]
    Problem:
      type: object
      description: RFC 9457 problem details + a top-level code / RFC 9457 문제 상세 + 최상위 code
      required: [title, status, detail, instance, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
          description: Fixed Korean sentence. It never carries the rejected value / 고정 한국어 문장. 거부된 값을 싣지 않는다
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
    FieldViolation:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
    ErrorCode:
      type: string
      enum: [INVALID_ARGUMENT, NOT_FOUND, METHOD_NOT_ALLOWED, NOT_ACCEPTABLE,
             UNSUPPORTED_MEDIA_TYPE, MALFORMED_REQUEST, INTERNAL_ERROR, POOL_NOT_LOADED, POOL_NOT_JUDGED, PATH_TOO_LONG,
             SEASON_LIMIT, TURN_NOT_REACHED, SEASON_NOT_FINISHED, SEASON_NOT_ACTIVE, TURN_MISMATCH, LEDGER_MISMATCH,
             LINEUP_MISMATCH, ASSET_NOT_IN_POOL, INSUFFICIENT_CASH, INSUFFICIENT_HOLDING, POSITION_CONFLICT, POSITION_REQUIRED,
             INVALID_FORMATION, EVENT_TIME_CONFLICT, RECONCILIATION_FAILED, FORBIDDEN, EMAIL_TAKEN,
             UNAUTHENTICATED, INVALID_CREDENTIALS, AGENT_RETIRED]
