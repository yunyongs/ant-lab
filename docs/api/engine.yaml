openapi: 3.1.0
info:
  title: my Fund Manager engine API
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        '200':
          description: Liveness probe / 생존성 확인
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/info:
    get:
      operationId: getEngineInfo
      responses:
        '200':
          description: Engine information / 엔진 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/paths:
    post:
      operationId: createPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathRequest'
      responses:
        '200':
          description: One path of months / 달 경로 하나
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathResult'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PoolNotFound'
        '422':
          $ref: '#/components/responses/PathTooLong'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/HistoryUnavailable'
  /v1/projections:
    post:
      operationId: createProjection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectionRequest'
      responses:
        '200':
          description: Projection of the portfolios / 포트폴리오별 예상 분포
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionResult'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PoolNotFound'
        '422':
          $ref: '#/components/responses/PathTooLong'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ProjectionUnavailable'
  /v1/percentiles:
    post:
      operationId: createPercentile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PercentileRequest'
      responses:
        '200':
          description: Rank counts of the observed values / 관측값의 순위 개수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PercentileResult'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PoolNotFound'
        '422':
          $ref: '#/components/responses/PathTooLong'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ProjectionUnavailable'
components:
  securitySchemes:
    EngineToken:
      type: apiKey
      in: header
      name: X-Antlab-Engine-Token
  responses:
    Unauthenticated:
      description: Unauthenticated / 인증되지 않음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Internal error / 내부 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidArgument:
      description: Invalid argument / 잘못된 인자
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PoolNotFound:
      description: No pool is stored for the base date / 기준일의 풀이 없다
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PathTooLong:
      description: The replayable history cannot build a path of this length (code PATH_TOO_LONG, same status as the public API) / 재생 가능한 이력으로 이 길이의 경로를 만들 수 없다(코드 PATH_TOO_LONG, 공개 API와 같은 상태)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProjectionUnavailable:
      headers:
        Retry-After:
          description: Seconds to wait before retrying, sent with ENGINE_BUSY / ENGINE_BUSY일 때 다시 호출하기까지 기다릴 초
          schema: {type: string}
      description: The history database is not configured or not reachable (HISTORY_UNAVAILABLE), or too many projections are running and the call may be retried later (ENGINE_BUSY) / 이력 DB가 설정되지 않았거나 닿지 않는다(HISTORY_UNAVAILABLE), 또는 실행 중인 예상 분포가 너무 많아 나중에 다시 호출하면 된다(ENGINE_BUSY)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    HistoryUnavailable:
      description: The history database is not configured or not reachable / 이력 DB가 설정되지 않았거나 닿지 않는다
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    EngineInfo:
      type: object
      required: [service, apiVersion, version]
      properties:
        service: {type: string}
        apiVersion: {type: string}
        version: {type: string}
    PathRequest:
      type: object
      description: >-
        Draws one path. `seed` is a decimal string (signed 64-bit). `recentMonths` and `maxOverlap` apply to
        `m2-sb6-v1` only; `p0-boot6-v1` rejects them. `conditional` must be false until regime-conditional
        paths exist. / 경로 하나를 뽑는다. `seed`는 부호 있는 64비트 십진 문자열이다. `recentMonths`·`maxOverlap`은
        `m2-sb6-v1`에만 쓰이고 `p0-boot6-v1`은 거부한다. `conditional`은 국면 조건 경로가 생기기 전까지 false여야 한다.
      additionalProperties: false
      required: [engineVersion, seed, length, baseDate]
      properties:
        engineVersion:
          type: string
          enum: [p0-boot6-v1, m2-sb6-v1]
        seed:
          type: string
          pattern: '^-?[0-9]{1,19}$'
        length:
          type: integer
          enum: [12, 24, 60, 120]
        baseDate: {type: string, format: date}
        conditional: {type: boolean, default: false}
        recentMonths:
          type: array
          maxItems: 4000
          uniqueItems: true
          items:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        maxOverlap:
          type: string
          default: '1'
          pattern: '^(0(\.[0-9]{1,4})?|1(\.0{1,4})?)$'
    PathBlock:
      type: object
      required: [startTurn, drawnLength, length, tier]
      properties:
        startTurn: {type: integer}
        drawnLength: {type: integer}
        length: {type: integer}
        tier:
          type: string
          enum: [ALIGNED, NEAR, FREE, JOIN]
    PathResult:
      type: object
      description: >-
        Months (`YYYY-MM`, turn order) are replay-only data for the internal backend route; they must not
        reach a public or agent response before review. `historyDigest` is the SHA-256 (hex) of
        `engineVersion` and the sorted replayable `YYYY-MM` months of the snapshot, each on its own line. /
        달(`YYYY-MM`, 턴 순서)은 내부 backend 경로 전용 복기 데이터이며 복기 전에는 공개·에이전트 응답에 나가면 안 된다. `historyDigest`는 `engineVersion`과 스냅샷의 재생 가능한 `YYYY-MM` 달을 정렬해 한 줄에 하나씩 이은 문자열의 SHA-256(16진)이다.
      required: [engineVersion, months, blocks, overlapMonths, overlapMet, attempt, historyDigest]
      properties:
        engineVersion: {type: string}
        months:
          type: array
          items:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        blocks:
          type: array
          items: {$ref: '#/components/schemas/PathBlock'}
        overlapMonths: {type: integer}
        overlapMet: {type: boolean}
        attempt: {type: integer}
        historyDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ProjectionRequest:
      type: object
      description: >-
        Projects fixed holdings (no trades, fees, interest or contributions) over `n` paths of `m2-sb6-v1`
        whose seeds derive from `seasonSeed`, so the season's own path is never one of them. Every
        portfolio sees the same paths. `weights` plus `cash` of each portfolio must add up to exactly 1;
        an asset must not repeat inside a portfolio and portfolio keys are unique. Summary turns above
        `horizonTurns` are dropped and `horizonTurns` itself is always summarised. All numbers are decimal
        strings. / 고정 보유(매매·수수료·이자·적립 없음)를 `m2-sb6-v1`의 `n`개 경로에 돌린다. 경로 시드는
        `seasonSeed`에서 파생하므로 시즌 경로는 그중 하나가 아니다. 모든 포트폴리오가 같은 경로를 쓴다.
        포트폴리오마다 `weights`와 `cash`의 합은 정확히 1이어야 하고, 한 포트폴리오 안에서 종목이 반복되면 안 되며
        포트폴리오 키는 유일하다. `horizonTurns`보다 큰 요약 턴은 버리고 `horizonTurns`는 항상 요약한다.
        모든 수는 십진 문자열이다.
      additionalProperties: false
      required: [seasonSeed, baseDate, horizonTurns, riskLimit, portfolios]
      properties:
        seasonSeed:
          type: string
          pattern: '^-?[0-9]{1,19}$'
        baseDate: {type: string, format: date}
        horizonTurns:
          type: integer
          enum: [60, 120]
        n:
          type: integer
          minimum: 100
          maximum: 5000
          default: 2000
        riskLimit:
          type: string
          pattern: '^-0\.[0-9]{1,8}$'
        summaryTurns:
          type: array
          minItems: 1
          maxItems: 20
          default: [60, 120]
          items: {type: integer, minimum: 1, maximum: 120}
        portfolios:
          type: array
          minItems: 1
          maxItems: 6
          items: {$ref: '#/components/schemas/ProjectionPortfolio'}
    ProjectionPortfolio:
      type: object
      additionalProperties: false
      required: [key, cash, weights]
      properties:
        key:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,31}$'
        cash:
          type: string
          pattern: '^(0(\.[0-9]{1,12})?|1(\.0{1,12})?)$'
        weights:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/Holding'}
    Holding:
      type: object
      additionalProperties: false
      required: [asset, weight]
      properties:
        asset:
          type: string
          pattern: '^(KR|US):[A-Z0-9.\-]{1,16}$'
        weight:
          type: string
          pattern: '^(0(\.[0-9]{1,12})?|1(\.0{1,12})?)$'
    ProjectionResult:
      type: object
      description: >-
        Value multiples, drawdowns and probabilities as decimal strings with eight fractional digits
        (rounded half up once at the wire). No months, no won amounts and no per-path values leave the
        engine. `historyDigest` is the SHA-256 (hex) of this ASCII text, lines joined by LF without a final LF:
        `projectionVersion`; `engineVersion`; the held asset keys sorted and joined by a space; then one line
        per eligible month in ascending order, `YYYY-MM` followed by ` <local_return>,<fx_change>` for each held
        asset in that order. Eligible months are the replayable months in which every held asset has a return.
        Returns are the stored decimals written plain, without exponent or trailing zeros (zero is `0`); KR
        assets carry fx `0`; no float text is used, so it can be recomputed from the stored history.
        Multiples are not clipped: a multiple may exceed the 9,999.99999999 of `NUMERIC(12,8)`, so a store
        needs a wider column. `ENGINE_BUSY` (503) carries `Retry-After: 1`. / 평가 배수·낙폭·확률은
        소수 여덟 자리 십진 문자열이다(전송 경계에서 한 번 반올림, 반올림 방식은 half up). 달·원화 금액·경로별 값은
        엔진 밖으로 나가지 않는다. `historyDigest`는 버전, 보유 종목, 자격 있는 달(모든 보유 종목에 수익률이 있는
        `YYYY-MM`)과 성장 배수에 대한 SHA-256(hex)이다.
      required: [projectionVersion, engineVersion, n, horizonTurns, historyDigest, portfolios]
      properties:
        projectionVersion: {type: string}
        engineVersion: {type: string}
        n: {type: integer}
        horizonTurns: {type: integer}
        historyDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        portfolios:
          type: array
          items: {$ref: '#/components/schemas/ProjectionPortfolioResult'}
    ProjectionPortfolioResult:
      type: object
      required: [key, bands, summaries]
      properties:
        key: {type: string}
        bands:
          type: array
          items: {$ref: '#/components/schemas/ProjectionBand'}
        summaries:
          type: array
          items: {$ref: '#/components/schemas/ProjectionSummary'}
    ProjectionBand:
      type: object
      required: [turn, p05, p25, p50, p75, p95]
      properties:
        turn: {type: integer}
        p05: {type: string, pattern: '^[0-9]{1,24}\.[0-9]{8}$'}
        p25: {type: string, pattern: '^[0-9]{1,24}\.[0-9]{8}$'}
        p50: {type: string, pattern: '^[0-9]{1,24}\.[0-9]{8}$'}
        p75: {type: string, pattern: '^[0-9]{1,24}\.[0-9]{8}$'}
        p95: {type: string, pattern: '^[0-9]{1,24}\.[0-9]{8}$'}
    ProjectionSummary:
      type: object
      required: [turn, end, mdd, breachCount, breachProbability]
      properties:
        turn: {type: integer}
        end: {$ref: '#/components/schemas/EndQuantiles'}
        mdd: {$ref: '#/components/schemas/MddQuantiles'}
        breachCount: {type: integer}
        breachProbability:
          type: string
          pattern: '^(0\.[0-9]{8}|1\.0{8})$'
    EndQuantiles:
      type: object
      required: [p05, p25, p50, p75, p95]
      properties:
        p05: {type: string, pattern: '^[0-9]{1,24}\.[0-9]{8}$'}
        p25: {type: string, pattern: '^[0-9]{1,24}\.[0-9]{8}$'}
        p50: {type: string, pattern: '^[0-9]{1,24}\.[0-9]{8}$'}
        p75: {type: string, pattern: '^[0-9]{1,24}\.[0-9]{8}$'}
        p95: {type: string, pattern: '^[0-9]{1,24}\.[0-9]{8}$'}
    MddQuantiles:
      type: object
      required: [p05, p10, p25, p50, p75, p95]
      properties:
        p05: {type: string, pattern: '^(0\.0{8}|-(0\.[0-9]{8}|1\.0{8}))$'}
        p10: {type: string, pattern: '^(0\.0{8}|-(0\.[0-9]{8}|1\.0{8}))$'}
        p25: {type: string, pattern: '^(0\.0{8}|-(0\.[0-9]{8}|1\.0{8}))$'}
        p50: {type: string, pattern: '^(0\.0{8}|-(0\.[0-9]{8}|1\.0{8}))$'}
        p75: {type: string, pattern: '^(0\.0{8}|-(0\.[0-9]{8}|1\.0{8}))$'}
        p95: {type: string, pattern: '^(0\.0{8}|-(0\.[0-9]{8}|1\.0{8}))$'}
    PercentileRequest:
      type: object
      description: >-
        Ranks an observed season among `n` paths of `m2-sb6-v1` whose seeds derive from `seasonSeed`, so the
        season's own path is never one of them. `team` (the season-start team) and `benchmark` are held as
        fixed quantities over the same paths (no trades, fees, interest or contributions); `weights` plus
        `cash` of each must add up to exactly 1 and an asset must not repeat inside one. Per path the engine
        takes the team's end multiple `v[horizonTurns]` and the Sharpe difference `sharpe(team) -
        sharpe(benchmark)`, where `sharpe = mean(r) / std(r, ddof=1)` over the turn returns
        `r_t = v_t / v_(t-1) - 1` (0 when the deviation is 0, risk-free rate 0, not annualised). `observed`
        carries the two values to rank; all numbers are decimal strings. / 관측한 시즌이 `m2-sb6-v1` 경로
        `n`개 안에서 어디에 놓이는지 센다. 경로 시드는 `seasonSeed`에서 파생하므로 시즌 경로는 그중 하나가
        아니다. `team`(시즌 시작 팀)과 `benchmark`는 같은 경로에서 고정 수량으로 보유한다(매매·수수료·이자·적립
        없음). 각각 `weights`와 `cash`의 합은 정확히 1이어야 하고 한 포트폴리오 안에서 종목이 반복되면 안 된다.
        경로마다 팀의 최종 배수 `v[horizonTurns]`와 샤프 차이 `sharpe(team) - sharpe(benchmark)`를 구한다.
        샤프는 턴 수익률 `r_t = v_t / v_(t-1) - 1`의 `mean(r) / std(r, ddof=1)`이고 편차가 0이면 0이며
        무위험 이자율은 0, 연율화하지 않는다. `observed`는 순위를 매길 두 값이다. 모든 수는 십진 문자열이다.
      additionalProperties: false
      required: [seasonSeed, baseDate, horizonTurns, team, benchmark, observed]
      properties:
        seasonSeed:
          type: string
          pattern: '^-?[0-9]{1,19}$'
        baseDate: {type: string, format: date}
        horizonTurns:
          type: integer
          enum: [12, 24, 60, 120]
        n:
          type: integer
          minimum: 100
          maximum: 5000
          default: 2000
        team: {$ref: '#/components/schemas/PercentilePortfolio'}
        benchmark: {$ref: '#/components/schemas/PercentilePortfolio'}
        observed: {$ref: '#/components/schemas/PercentileObserved'}
    PercentilePortfolio:
      type: object
      additionalProperties: false
      required: [cash, weights]
      properties:
        cash:
          type: string
          pattern: '^(0(\.[0-9]{1,12})?|1(\.0{1,12})?)$'
        weights:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/Holding'}
    PercentileObserved:
      type: object
      additionalProperties: false
      required: [endMultiple, sharpeDiff]
      properties:
        endMultiple:
          type: string
          pattern: '^[0-9]{1,12}(\.[0-9]{1,12})?$'
        sharpeDiff:
          type: string
          pattern: '^-?[0-9]{1,6}(\.[0-9]{1,12})?$'
    PercentileResult:
      type: object
      description: >-
        Integer counts, never rounded values: `below` paths are strictly smaller than the observed value and
        `equal` paths are exactly equal (float64), so `0 <= below + equal <= n`. The caller derives the
        percentile, for example the mid-rank `(below + equal / 2) / n`. No months, no won amounts and no
        per-path values leave the engine. `historyDigest` is built as in `ProjectionResult`, over the assets
        held by `team` and `benchmark`. `ENGINE_BUSY` (503) carries `Retry-After: 1`. /
        정수 개수만 돌려주며 반올림한 값은 없다: `below`는 관측값보다 엄격히 작은 경로, `equal`은 float64로
        정확히 같은 경로이므로 `0 <= below + equal <= n`이다. 백분위는 호출 쪽이 계산한다(예: 중간 순위
        `(below + equal / 2) / n`). 달·원화 금액·경로별 값은 엔진 밖으로 나가지 않는다. `historyDigest`는
        `ProjectionResult`와 같은 방식이며 `team`과 `benchmark`가 보유한 종목에 대해 만든다.
      required: [projectionVersion, engineVersion, n, horizonTurns, historyDigest, endMultiple, sharpeDiff]
      properties:
        projectionVersion: {type: string}
        engineVersion: {type: string}
        n: {type: integer, minimum: 100, maximum: 5000}
        horizonTurns: {type: integer, enum: [12, 24, 60, 120]}
        historyDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        endMultiple: {$ref: '#/components/schemas/RankCounts'}
        sharpeDiff: {$ref: '#/components/schemas/RankCounts'}
    RankCounts:
      type: object
      required: [below, equal]
      properties:
        below: {type: integer, minimum: 0, maximum: 5000}
        equal: {type: integer, minimum: 0, maximum: 5000}
    FieldViolation:
      type: object
      required: [field, reason]
      properties:
        field: {type: string}
        reason: {type: string}
    Problem:
      type: object
      required: [title, status, detail, instance, code]
      properties:
        title: {type: string}
        status: {type: integer, format: int32}
        detail: {type: string}
        instance: {type: string}
        code: {$ref: '#/components/schemas/ErrorCode'}
        errors:
          type: array
          items: {$ref: '#/components/schemas/FieldViolation'}
    ErrorCode:
      type: string
      enum: [INVALID_ARGUMENT, NOT_FOUND, METHOD_NOT_ALLOWED, UNAUTHENTICATED, INTERNAL_ERROR,
           PATH_TOO_LONG, POOL_NOT_FOUND, HISTORY_UNAVAILABLE, ENGINE_BUSY]
security:
  - EngineToken: []
