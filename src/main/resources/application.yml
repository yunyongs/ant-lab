# 공통 문서: 프로필 없이 떠도 운영에 가까운 안전한 값이다(SQL 로그 꺼짐, 명세·Swagger UI 꺼짐 — local 에서만 켠다).
# 비밀값은 파일에 쓰지 않는다. 자리표시자 ${이름:기본값} 으로 환경 변수에서 읽는다.
spring:
  application:
    name: antlab
  datasource:
    url: ${ANTLAB_DB_URL:jdbc:postgresql://localhost:5432/antlab_api}
    username: ${ANTLAB_DB_USER:${USER:antlab}}
    password: ${ANTLAB_DB_PASSWORD:}
    hikari:
      # 세션 시간대를 JVM 기본값과 떼어 놓는다(db/README 규칙: DB 시간대 Asia/Seoul).
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
      data-source-properties:
        # Kept here, not in the URL: prod replaces the whole URL via env, which would drop URL-side properties.
        logServerErrorDetail: "false"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    deserialization:
      # 정수 필드(수량·턴 번호·포메이션 비중)에 소수가 오면 잘라 받지 않고 400 으로 거부한다.
      accept-float-as-int: false

server:
  shutdown: graceful

antlab:
  pool:
    # 기준일 풀(PLAN §7 매년 1월 첫 거래일). 표본 = 2026-01-02(db/20_season_start.sql 설정 표와 같음)
    base-date: ${ANTLAB_POOL_BASE_DATE:2026-01-02}
  # 새 시즌에 적는 설정(요청에서 받지 않는다). 요율은 PLAN §4.6, 환전 비용 0.40% 는 소유자 결정(2026-11-08).
  # 기준일은 antlab.pool.base-date 를 그대로 쓴다. 표본 스냅샷 날짜 = db/sample/README 상태 줄(db/20 설정 표와 같음).
  season:
    initial-cash: 30000000
    fee-rate-kr: 0.00015
    fee-rate-us: 0.0025
    fx-spread-rate: 0.0040
    data-snapshot-date: 2026-11-07
  # Tokens (SEC-03). The signing key has no default in any profile: without it the app does not start.
  # Base64 of at least 32 bytes (openssl rand -base64 32). In prod the file /run/secrets/antlab.auth.jwt-secret also works.
  auth:
    jwt-secret: ${ANTLAB_JWT_SECRET:}
    access-token-ttl: PT15M
    refresh-token-ttl: P14D

# springdoc 은 설정이 없으면 켜진다(matchIfMissing). 공통에서 끄고 local 에서만 켠다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    # Actuator and metrics live on this port only; compose never publishes it (docs/DEPLOY.md §5).
    port: ${ANTLAB_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        # /livez and /readyz on the API port, so the container healthcheck needs no management port.
        add-additional-paths: true
      group:
        # liveness 는 기본(DB 가 죽어도 재시작하지 않음), readiness 는 DB 가 없으면 트래픽을 받지 않음
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: antlab-api
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      minimum-expected-value:
        "[http.server.requests]": 5ms
      maximum-expected-value:
        "[http.server.requests]": 10s

---
spring:
  config:
    activate:
      on-profile: local
# 개발 엔드포인트는 이 컴퓨터에서만 부른다(고정 헤더 관문과 함께 이중 제한).
server:
  address: 127.0.0.1
management:
  server:
    # Boot does not inherit server.address for the management port.
    address: 127.0.0.1
logging:
  level:
    org.hibernate.SQL: debug
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
    # 운영 비밀(DB 비밀번호 등)은 파일로 받는다: /run/secrets/spring.datasource.password -> spring.datasource.password.
    # 디렉터리가 없어도(로컬 compose) 기동한다. 같은 속성을 환경 변수(SPRING_DATASOURCE_PASSWORD)로도 주면 환경 변수가 이긴다.
    import: optional:configtree:/run/secrets/
  datasource:
    # 기본값 없음: 운영 프로필에서 ANTLAB_DB_URL 을 빠뜨리면 localhost 로 가지 않고 기동에 실패한다.
    url: ${ANTLAB_DB_URL}
server:
  forward-headers-strategy: framework
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
