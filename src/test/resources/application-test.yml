# 시험 전용 값(jar 에 들어가지 않는다). DB 접속 정보는 Testcontainers(@ServiceConnection)가 준다.
logging:
  level:
    org.hibernate.SQL: info
    # 통계를 켜면 세션마다 요약 로그가 INFO 로 나온다 — 시험 출력을 조용하게 한다.
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: warn
spring:
  jpa:
    properties:
      # 쿼리 수 단언용(N+1 방지 시험이 Statistics 를 읽는다)
      hibernate.generate_statistics: true
      # 실행된 SQL 을 스레드별로 기록한다(SqlRecorder) — UPDATE 가 나갔는지, 잠금 SQL 이 무엇인지 단언하는 데 쓴다.
      hibernate.session_factory.statement_inspector: antlab.support.SqlRecorder
# 명세(/v3/api-docs) 단언용. Swagger UI 는 끈 채로 둔다.
springdoc:
  api-docs:
    enabled: true
# Test-only signing key: Base64 of a visibly fake phrase over 32 bytes. Never a real key.
antlab:
  auth:
    jwt-secret: dGVzdC1vbmx5LWp3dC1rZXktbmV2ZXItdXNlLWluLXByb2QhIQ==
