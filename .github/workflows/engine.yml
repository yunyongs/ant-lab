name: engine

on:
  pull_request:
    paths: ['engine/**', 'docs/api/engine.yaml', 'src/test/resources/engine/p0-boot6-v1_vectors.csv', 'src/test/resources/engine/contract/**', 'src/test/resources/engine/parity/**', 'src/test/resources/sim/**', 'docs/api/sim-decisions-1.schema.json', 'docs/api/turn-decision-1.schema.json', 'src/test/resources/agent/turn-decision/**', 'src/main/java/antlab/common/money/**', 'src/main/java/antlab/account/**', 'src/main/java/antlab/season/**', 'src/main/java/antlab/scoring/**', 'db/roles/**', 'src/main/resources/db/migration/**', 'src/main/java/antlab/common/error/ErrorCode.java', 'src/main/java/antlab/api/error/ErrorHttpMapping.java', '.github/workflows/engine.yml']
  push:
    branches: [main]
    paths: ['engine/**', 'docs/api/engine.yaml', 'src/test/resources/engine/p0-boot6-v1_vectors.csv', 'src/test/resources/engine/contract/**', 'src/test/resources/engine/parity/**', 'src/test/resources/sim/**', 'docs/api/sim-decisions-1.schema.json', 'docs/api/turn-decision-1.schema.json', 'src/test/resources/agent/turn-decision/**', 'src/main/java/antlab/common/money/**', 'src/main/java/antlab/account/**', 'src/main/java/antlab/season/**', 'src/main/java/antlab/scoring/**', 'db/roles/**', 'src/main/resources/db/migration/**', 'src/main/java/antlab/common/error/ErrorCode.java', 'src/main/java/antlab/api/error/ErrorHttpMapping.java', '.github/workflows/engine.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: antlab_testsrv_ci
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.13
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
        env:
          ANTLAB_ENGINE_DB_TESTS: required
          ANTLAB_ENGINE_TEST_SERVER_ID: ci
          ANTLAB_ENGINE_TEST_ADMIN_DSN: host=127.0.0.1 port=55432 user=postgres dbname=antlab_testsrv_ci
      - run: docker build .
