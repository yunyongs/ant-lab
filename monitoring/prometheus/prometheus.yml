global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: antlab-api
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: ["api:8081"]

  # OBS-06: database statistics from postgres_exporter (read as antlab_metrics). `up` is 1 whenever the exporter answers; pg_up tells whether it reached the database.
  - job_name: antlab-db
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # OBS-05: engine metrics on the internal port 8001 (no token, never published). `up` is 0 while the engine profile is not running.
  - job_name: antlab-engine
    static_configs:
      - targets: ["engine:8001"]

  # OBS-08: numbers from the host ledgers (OpenRouter, Ollama Cloud, fetch tool). `up` is 1 whenever the exporter answers; antlab_ledger_readable says whether each file could be read.
  - job_name: antlab-ledgers
    static_configs:
      - targets: ["ledger-exporter:9190"]

  # OBS-13: the host exporter (processes, containers, worktrees, slots of this Mac). It runs on the host, not in compose: Docker Desktop routes host.docker.internal to the host loopback, where it listens on 127.0.0.1:9191 only. While the exporter is not installed or not running the target is simply down (`up` 0) and nothing else is affected.
  - job_name: antlab-host
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets: ["host.docker.internal:9191"]
