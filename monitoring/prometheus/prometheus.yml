global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: antlab-api
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: ["api:8081"]

  # OBS-06: database statistics from postgres_exporter (read as antlab_metrics). `up` is 1 whenever the exporter answers; pg_up tells whether it reached the database.
  - job_name: antlab-db
    static_configs:
      - targets: ["postgres-exporter:9187"]
