plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'antlab'
version = '0.0.1-SNAPSHOT'
description = 'my Fund Manager API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.yaml:snakeyaml'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        // 실제 표본 CSV 가 필요한 SQL 골든만 빼고 돌리려면 -PexcludeSqlGolden, 그것만 돌리려면 -PonlySqlGolden
        if (project.hasProperty('excludeSqlGolden')) {
            excludeTags 'sql-golden'
        }
        if (project.hasProperty('onlySqlGolden')) {
            includeTags 'sql-golden'
        }
    }
    // 시험이 실행 중에 읽는 SQL·사건 파일과 표본 위치가 바뀌면 다시 돌린다 (UP-TO-DATE 로 건너뛰지 않게)
    inputs.dir('db').withPropertyName('sqlScripts').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('events').withPropertyName('eventFiles').withPathSensitivity(PathSensitivity.RELATIVE)
    def sampleDir = System.getenv('ANTLAB_GOLDEN_SAMPLE_DIR')
    inputs.property('goldenSampleDir', sampleDir ?: '')
    if (sampleDir) {
        inputs.files(fileTree(sampleDir) { include '*.csv' }).withPropertyName('goldenSampleCsv')
                .withPathSensitivity(PathSensitivity.NAME_ONLY)
    }
    // 운영 컨테이너 JVM 이 UTC 일 수 있다. 같은 조건에서 시간대 독립성을 시험한다.
    systemProperty 'user.timezone', 'UTC'
}

tasks.named('bootJar') {
    // Dockerfile 이 이름으로 집는다. plain JAR·와일드카드 선택 실수를 막는다.
    archiveFileName = 'app.jar'
}

tasks.named('bootRun') {
    // 프로필을 빠뜨린 컨테이너가 개발 설정으로 뜨지 않게, local 은 bootRun 에서만 기본으로 준다.
    systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
}

tasks.named('bootTestRun') {
    // 일회용 PostgreSQL 17 로 띄우는 개발 실행도 local 프로필(SQL 로그)을 기본으로 쓴다.
    systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
}
