[project]
name = "antlab-engine"
version = "0.1.0"
description = "Deterministic internal simulation engine"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pyyaml>=6,<7", "ruff>=0.11,<1"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["antlab_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "db: needs an isolated PostgreSQL server (ANTLAB_ENGINE_TEST_ADMIN_DSN)",
    "sample: needs ANTLAB_GOLDEN_SAMPLE_DIR and a sample-loaded database",
]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient"]
